<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sinapse</title>
<meta name="description" content="Sinapse: cadernos para escrever à mão, com caneta, marca-texto e PDFs.">
<meta name="theme-color" content="#F3E7FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120B22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sinapse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Shrikhand&display=swap">
<style>
/* =====================================================================
   Estética "Aura": manchas de luz lilás, rosa e pêssego, grão de papel,
   brilhos holográficos e vidro fosco.
   ===================================================================== */
:root{
  --bg:#F6EEFF; --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.84); --surface-2:rgba(124,77,255,.08);
  --ink:#2A1B3D; --muted:#74658A; --line:rgba(120,90,180,.20);
  --accent:#7A4FE0; --accent-2:#E2549C; --accent-ink:#FFFFFF; --accent-soft:rgba(139,92,246,.14);
  --danger:#C9365A; --ring:#2A1B3D;
  --a1:#E3C2FF; --a2:#FFC2DD; --a3:#FFD9BD; --a4:#C7D6FF;
  --shadow:0 2px 6px rgba(80,40,140,.08),0 14px 40px rgba(110,60,180,.16);
  --page-shadow:0 2px 6px rgba(70,30,120,.10),0 18px 44px rgba(90,50,160,.16);
  --glow:0 6px 22px rgba(196,88,196,.38);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120B22; --glass:rgba(34,22,60,.60); --glass-strong:rgba(36,24,64,.90); --surface-2:rgba(200,170,255,.10);
    --ink:#F7EFFF; --muted:#B8A8D6; --line:rgba(200,170,255,.18);
    --accent:#BBA0FF; --accent-2:#FF8CC6; --accent-ink:#1A0F30; --accent-soft:rgba(184,156,255,.18);
    --danger:#FF8FAB; --ring:#F7EFFF;
    --a1:#4E2496; --a2:#8E2A6E; --a3:#27378F; --a4:#6A35B0;
    --shadow:0 2px 6px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.45);
    --page-shadow:0 2px 6px rgba(0,0,0,.45),0 18px 44px rgba(0,0,0,.5);
    --glow:0 6px 24px rgba(220,110,220,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120B22; --glass:rgba(34,22,60,.60); --glass-strong:rgba(36,24,64,.90); --surface-2:rgba(200,170,255,.10);
  --ink:#F7EFFF; --muted:#B8A8D6; --line:rgba(200,170,255,.18);
  --accent:#BBA0FF; --accent-2:#FF8CC6; --accent-ink:#1A0F30; --accent-soft:rgba(184,156,255,.18);
  --danger:#FF8FAB; --ring:#F7EFFF;
  --a1:#4E2496; --a2:#8E2A6E; --a3:#27378F; --a4:#6A35B0;
  --shadow:0 2px 6px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.45);
  --page-shadow:0 2px 6px rgba(0,0,0,.45),0 18px 44px rgba(0,0,0,.5);
  --glow:0 6px 24px rgba(220,110,220,.35);
  color-scheme:dark;
}
:root{
  --holo:linear-gradient(115deg,#FFC2E2 0%,#D9C6FF 22%,#BDE6FF 42%,#FFF1C2 62%,#FFC2DD 80%,#CDBBFF 100%);
  --cta:linear-gradient(120deg,#8B5CF6 0%,#C35FD8 50%,#F2709F 100%);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --f-display:"Shrikhand",Georgia,serif;
  --f-serif:"Fraunces",Georgia,"Times New Roman",serif;
  --f-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-sans);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Fundo de aura ---------- */
.aura{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.aura i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.9;animation:drift 28s ease-in-out infinite alternate;will-change:transform}
.aura i:nth-child(1){width:62vmax;height:62vmax;left:-18vmax;top:-22vmax;background:var(--a1)}
.aura i:nth-child(2){width:50vmax;height:50vmax;right:-20vmax;top:8vh;background:var(--a2);animation-duration:34s;animation-delay:-8s}
.aura i:nth-child(3){width:56vmax;height:56vmax;left:4vw;bottom:-30vmax;background:var(--a3);animation-duration:31s;animation-delay:-15s}
.aura i:nth-child(4){width:38vmax;height:38vmax;right:2vw;bottom:-12vmax;background:var(--a4);animation-duration:26s;animation-delay:-4s}
.aura::after{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.22;mix-blend-mode:soft-light}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.14)}}
body.editing .aura i{animation-play-state:paused}

/* ---------- Brilhos holográficos ---------- */
.spark{position:absolute;width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 12px rgba(214,170,255,.7));animation:twinkle 3.6s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(20deg);opacity:.55}}
@keyframes shimmer{to{background-position:200% 50%}}
@media (prefers-reduced-motion:reduce){.aura i,.spark,.brand h1{animation:none!important}}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:15px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn.primary{background:var(--cta);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.icon{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;flex:none}
.icon:hover{background:var(--surface-2)}
.icon:disabled{opacity:.32;cursor:default}
.icon:disabled:hover{background:none}

/* ---------- Biblioteca ---------- */
#library{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 16px 56px}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;position:relative}
.brand img{width:52px;height:52px;border-radius:15px;box-shadow:var(--glow)}
.brand h1{margin:0;font:400 46px/1 var(--f-display);letter-spacing:.01em;padding:4px 6px 8px 0;
  background:linear-gradient(100deg,#8B5CF6 0%,#E2549C 30%,#F59A6B 50%,#B07CF2 70%,#8B5CF6 100%) 0 50%/200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 9s linear infinite}
.brand .spark{right:-20px;top:-6px}
.lib-actions{display:flex;gap:10px;flex-wrap:wrap}
.hello{font:italic 600 24px/1.2 var(--f-serif);margin:26px 0 4px;letter-spacing:-.01em}
.lib-sub{color:var(--muted);margin:0 0 28px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:30px 22px}
.card{min-width:0}

/* Capas */
.cover{display:block;width:100%;aspect-ratio:3/4;container-type:inline-size;border-radius:8px 18px 18px 8px;position:relative;overflow:hidden;isolation:isolate;
  --ct:#2A1B3D;--cf:var(--f-serif);
  box-shadow:inset 12px 0 0 rgba(40,10,60,.10),inset 13px 0 0 rgba(255,255,255,.35),var(--shadow);transition:transform .2s}
.cover:active{transform:scale(.97)}
.cover::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--noise),linear-gradient(140deg,rgba(255,255,255,.45),transparent 45%);opacity:.55;mix-blend-mode:soft-light}
.cover .spark{width:18px;height:18px}
.cover .s1{right:16%;top:12%}
.cover .s2{right:30%;top:24%;width:11px;height:11px;animation-delay:-1.4s}
.cover-title{position:absolute;left:24px;right:12px;bottom:18px;color:var(--ct);font:800 19px/1.06 var(--cf);font-size:clamp(14px,11.5cqi,24px);letter-spacing:-.015em;text-align:left;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;text-wrap:balance}
.cover-pdf{position:absolute;right:10px;top:10px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ct);
  background:rgba(255,255,255,.4);padding:3px 8px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cover[data-cover=aura]{background:radial-gradient(circle at 18% 22%,#F4C4FF 0,transparent 55%),radial-gradient(circle at 88% 32%,#FFC3DE 0,transparent 52%),radial-gradient(circle at 50% 100%,#FFDCC0 0,transparent 62%),#E2D2FF}
.cover[data-cover=holo]{background:linear-gradient(125deg,#FFC9E6,#D7C4FF 25%,#BFE9FF 45%,#FFF3C4 62%,#FFC4E0 80%,#CDB9FF)}
.cover[data-cover=peach]{background:radial-gradient(circle at 28% 72%,#FFB08A 0,transparent 55%),radial-gradient(circle at 78% 22%,#FF9EC8 0,transparent 55%),#FFE4CC}
.cover[data-cover=waves]{background:repeating-radial-gradient(circle at 50% 58%,#F9B8E3 0 9px,#D9C3FF 9px 18px,#FFD7C4 18px 27px,#C8DEFF 27px 36px)}
.cover[data-cover=strawberry]{--ct:#C8102E;--cf:var(--f-display);background:conic-gradient(#E2263F 25%,#FFD5DB 0 50%,#E2263F 0 75%,#FFD5DB 0) 0 0/16px 16px}
.cover[data-cover=strawberry]::before{content:"";position:absolute;inset:14px 12px 14px 22px;background:#FFD5DB;border-radius:4px;z-index:-1}
.cover[data-cover=strawberry] .cover-title{left:32px;right:22px;bottom:28px;font-weight:400}
.cover[data-cover=mystic]{background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.55) 0,transparent 32%),#CDAEF0}
.cover[data-cover=swirl]{--ct:#FFF6FF;background:radial-gradient(circle at 70% 75%,rgba(20,10,40,.55),transparent 55%),conic-gradient(from 210deg at 55% 48%,#2B1B4A,#E2589B,#F6A25B,#F7E3C7,#9A6BDA,#2B6E8A,#2B1B4A)}
.cover[data-cover=cosmos]{--ct:#FFF6FF;background:radial-gradient(circle at 28% 18%,#9256E6 0,transparent 50%),radial-gradient(circle at 82% 82%,#E05FA8 0,transparent 46%),#1E1238}
.card-meta{display:flex;align-items:flex-start;gap:4px;margin-top:12px}
.card-meta>div{flex:1;min-width:0}
.card-name{font:600 16px/1.25 var(--f-serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-date{color:var(--muted);font-size:13px}
.card-meta .icon{width:36px;height:36px;margin:-6px -6px 0 0}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty-art{position:relative;width:120px;height:120px;margin:0 auto 18px}
.empty-art img{width:96px;height:96px;border-radius:26px;margin:12px;box-shadow:var(--glow)}
.empty-art .spark:nth-of-type(1){left:-6px;top:0;width:26px;height:26px}
.empty-art .spark:nth-of-type(2){right:-4px;top:30px;width:16px;height:16px;animation-delay:-1.2s}
.empty-art .spark:nth-of-type(3){right:10px;bottom:-4px;width:22px;height:22px;animation-delay:-2.3s}
.empty h2{color:var(--ink);margin:0 0 8px;font:italic 700 28px/1.15 var(--f-serif)}
.empty p{margin:0 auto 22px;max-width:420px}

/* ---------- Editor ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative;z-index:5;
  margin:calc(env(safe-area-inset-top) + 8px) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
  padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.title{font:italic 700 18px/1 var(--f-serif);padding:0 10px;height:44px;max-width:22vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:14px}
.title:hover{background:var(--surface-2)}
.tools{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--holo);color:#2A1B3D;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 4px 14px rgba(170,120,230,.35)}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
.colors,.sizes{display:flex;align-items:center;gap:2px;flex:none}
.swatch{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none;position:relative}
.swatch span{width:24px;height:24px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 -3px 6px rgba(0,0,0,.08),inset 0 3px 5px rgba(255,255,255,.45)}
.swatch[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.swatch.custom span{background:conic-gradient(#FF9FD2,#FFD59E,#B8F0C8,#9FD8FF,#C9A8FF,#FF9FD2)}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.size{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;flex:none}
.size span{border-radius:50%;background:var(--muted)}
.size[aria-pressed="true"]{background:var(--accent-soft)}
.size[aria-pressed="true"] span{background:var(--accent)}
.bar-right{display:flex;align-items:center}
@media (max-width:760px){
  .tools{order:3;flex-basis:100%;justify-content:flex-start}
  .title{max-width:none;flex:1;text-align:left}
}
.desk{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pages{display:flex;flex-direction:column;align-items:center;position:relative;transform-origin:0 0;padding:20px 16px 140px;min-width:100%}
.page{position:relative;flex:none;background:#fff;box-shadow:var(--page-shadow);border-radius:3px}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3px}
.page canvas.live{pointer-events:none}
.add-page{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);color:var(--muted);
  border-radius:18px;height:84px;font-weight:600;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.add-page:hover{color:var(--accent);border-color:var(--accent)}
.page-ind{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:4;
  background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
.zoom-ind{right:auto;left:max(16px,env(safe-area-inset-left))}
.sel-bar{position:fixed;z-index:6;display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;
  background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(-50%);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sel-bar .btn{min-height:36px;padding:0 12px;border:0;background:none;font-size:14px;box-shadow:none}
.sel-bar .swatch{width:32px;height:32px}
.sel-bar .swatch span{width:20px;height:20px}

/* ---------- Janelas ---------- */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:calc(100vw - 32px);width:460px}
dialog::backdrop{background:rgba(40,16,70,.30);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{background:var(--glass-strong);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:22px;
  max-height:calc(100dvh - 48px);overflow:auto;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
.dlg h2{margin:0 0 14px;font:italic 700 24px/1.15 var(--f-serif);letter-spacing:-.01em}
.dlg p{margin:0 0 14px;color:var(--muted)}
.dlg label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.dlg input[type=text]{width:100%;min-height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 16px;font:inherit}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.cv-pick{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
.cv-pick .cover{border-radius:5px 10px 10px 5px;box-shadow:inset 7px 0 0 rgba(40,10,60,.10),0 2px 8px rgba(90,50,160,.18)}
.cv-pick .cover[data-cover=strawberry]::before{inset:7px 6px 7px 12px}
.cv-pick[aria-pressed="true"]{color:var(--accent)}
.cv-pick[aria-pressed="true"] .cover{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tpl canvas{width:100%;aspect-ratio:1000/1414;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.tpl[aria-pressed="true"]{color:var(--accent)}
.tpl[aria-pressed="true"] canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button i{width:14px;height:14px;border-radius:50%;background:var(--pp);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 3px rgba(60,20,100,.18)}
.menu{display:flex;flex-direction:column;margin:0 -8px}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;min-height:50px;padding:6px 12px;border-radius:16px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu .sub{display:block;font-size:13px;color:var(--muted)}
.menu .chk{margin-left:auto;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.menu .chk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.menu .chk.on{background:var(--cta)}
.menu .chk.on::after{transform:translateX(18px)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);z-index:50;
  background:rgba(42,27,61,.88);color:#FBF5FF;padding:12px 20px;border-radius:999px;font-size:15px;max-width:calc(100vw - 32px);
  box-shadow:var(--shadow);text-align:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="holoG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD1EC"/><stop offset=".35" stop-color="#CDB8FF"/><stop offset=".65" stop-color="#B5E8FF"/><stop offset="1" stop-color="#FFF2B8"/></linearGradient>

<script>
'use strict';
/* =====================================================================
   Sinapse: cadernos para escrever à mão.
   Tudo roda no aparelho: os cadernos ficam no IndexedDB do navegador.
   Coordenadas das páginas: largura fixa de 1000 unidades (A4 = 1000 x 1414).
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=v=>Math.round(v*10)/10;
const PAGE_W=1000, A4_H=1414;

/* ---------- Banco local ---------- */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{
    const r=indexedDB.open('sinapse',1);
    r.onupgradeneeded=()=>{const d=r.result;
      d.createObjectStore('notebooks',{keyPath:'id'});
      d.createObjectStore('pages',{keyPath:'id'}).createIndex('nb','nb');
      d.createObjectStore('blobs',{keyPath:'id'});};
    r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error);
  })},
  tx(store,mode,fn){return new Promise((res,rej)=>{
    const t=DB.db.transaction(store,mode),q=fn(t.objectStore(store));let out;
    if(q)q.onsuccess=()=>{out=q.result};
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  })},
  get:(s,id)=>DB.tx(s,'readonly',x=>x.get(id)),
  put:(s,v)=>DB.tx(s,'readwrite',x=>x.put(v)),
  del:(s,id)=>DB.tx(s,'readwrite',x=>x.delete(id)),
  all:s=>DB.tx(s,'readonly',x=>x.getAll()),
  pagesOf:id=>DB.tx('pages','readonly',x=>x.index('nb').getAll(id))
};

/* ---------- Preferências ---------- */
const COVERS=[['aura','Aura'],['holo','Holográfico'],['peach','Pêssego'],['waves','Ondas'],['strawberry','Morango'],['mystic','Místico'],['swirl','Universo'],['cosmos','Cósmico']];
const LEGACY_COVER={'#8B5CF6':'aura','#B35A3F':'peach','#3F7F6B':'holo','#2F5D8A':'cosmos','#C9963A':'peach','#8A3F6E':'swirl','#4A4A52':'cosmos','#D77A8F':'strawberry'};
const coverOf=nb=>COVERS.some(c=>c[0]===nb.cover)?nb.cover:(LEGACY_COVER[nb.color]||'aura');
const SPARKS='<svg class="spark s1" aria-hidden="true"><use href="#spark"/></svg><svg class="spark s2" aria-hidden="true"><use href="#spark"/></svg>';
const PEN_COLORS=['#2A1B3D','#6B3FD4','#E0457B','#2F6FD6','#14937F'];
const HL_COLORS=['#FFE27A','#FFB3D9','#D6B8FF','#B5E6FF','#FFC9A3'];
const SIZES={pen:[1.6,2.8,4.6],hl:[12,20,32],eraser:[14,30,64]};
const PAPER={white:'#FFFFFF',cream:'#FDF7EE',lilac:'#F8F2FF',rose:'#FFF3F6'};
const PAPER_NAMES=[['white','Branco'],['cream','Creme'],['lilac','Lilás'],['rose','Rosé']];
const TEMPLATES=[['blank','Liso'],['lined','Pautado'],['grid','Quadriculado'],['dots','Pontilhado'],['cornell','Cornell']];
const PREF_KEY='sinapse-prefs';
const P=Object.assign({tool:'pen',penColor:PEN_COLORS[0],hlColor:HL_COLORS[0],size:{pen:1,hl:1,eraser:1},penOnly:false,penSeen:false},
  (()=>{try{return JSON.parse(localStorage.getItem(PREF_KEY))||{}}catch(e){return{}}})());
const savePrefs=()=>{try{localStorage.setItem(PREF_KEY,JSON.stringify(P))}catch(e){}};

/* ---------- Estado do caderno aberto ---------- */
const S={nb:null,pages:[],zoom:1,undo:[],redo:[],sel:null,cur:0};
let act=null;          // traço, borracha, laço ou arrasto em andamento
let penDown=false;     // a caneta está encostada na tela (bloqueia rolagem pela palma)
let pinch=null;

/* ---------- Avisos ---------- */
let toastT;
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);if(ms)toastT=setTimeout(()=>t.hidden=true,ms)}
function hideToast(){clearTimeout(toastT);$('#toast').hidden=true}

/* =====================================================================
   Desenho
   ===================================================================== */
function drawTemplate(c,tpl,w,h,lw=1){
  c.save();
  if(tpl==='lined'||tpl==='cornell'){
    const x0=tpl==='cornell'?280:0,y0=tpl==='cornell'?150:118,y1=tpl==='cornell'?h-230:h-40;
    c.strokeStyle='#D2C7EA';c.lineWidth=lw;c.beginPath();
    for(let y=y0;y<=y1;y+=34){c.moveTo(x0,y);c.lineTo(w,y)}
    c.stroke();
    if(tpl==='lined'){c.strokeStyle='#F2A8C8';c.beginPath();c.moveTo(88,0);c.lineTo(88,h);c.stroke()}
    else{
      c.strokeStyle='#C2A6F0';c.lineWidth=lw*1.6;c.beginPath();
      c.moveTo(0,116);c.lineTo(w,116);c.moveTo(280,116);c.lineTo(280,h-200);c.moveTo(0,h-200);c.lineTo(w,h-200);c.stroke();
    }
  }else if(tpl==='grid'){
    c.strokeStyle='#E3DBF2';c.lineWidth=lw*.9;c.beginPath();
    for(let x=25;x<w;x+=25){c.moveTo(x,0);c.lineTo(x,h)}
    for(let y=25;y<h;y+=25){c.moveTo(0,y);c.lineTo(w,y)}
    c.stroke();
  }else if(tpl==='dots'){
    c.fillStyle='#B9ADD4';const r=Math.max(1.5,lw*1.3);c.beginPath();
    for(let x=25;x<w;x+=25)for(let y=25;y<h;y+=25){c.moveTo(x+r,y);c.arc(x,y,r,0,6.2832)}
    c.fill();
  }
  c.restore();
}
const widthAt=(st,pr)=>st.s*(0.35+1.3*pr);
function tracePath(c,p,n){
  c.moveTo(p[0],p[1]);
  for(let i=1;i<n-1;i++){const j=i*3;c.quadraticCurveTo(p[j],p[j+1],(p[j]+p[j+3])/2,(p[j+1]+p[j+4])/2)}
  if(n>1)c.lineTo(p[(n-1)*3],p[(n-1)*3+1]);else c.lineTo(p[0]+.01,p[1]);
}
function drawStroke(c,st,dx=0,dy=0){
  const p=st.p,n=p.length/3;if(!n)return;
  c.save();if(dx||dy)c.translate(dx,dy);
  c.lineCap='round';c.lineJoin='round';
  if(st.t==='hl'){
    c.globalAlpha=.4;c.globalCompositeOperation='multiply';
    c.strokeStyle=st.c;c.lineWidth=st.s;c.beginPath();tracePath(c,p,n);c.stroke();
  }else if(n<3){
    c.strokeStyle=c.fillStyle=st.c;
    if(n===1){c.beginPath();c.arc(p[0],p[1],widthAt(st,p[2])/2,0,6.2832);c.fill()}
    else{c.lineWidth=widthAt(st,(p[2]+p[5])/2);c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(p[3],p[4]);c.stroke()}
  }else{
    // cada trecho tem a espessura da pressão naquele ponto
    c.strokeStyle=st.c;let px=p[0],py=p[1];
    for(let i=1;i<n;i++){
      const j=i*3,x=p[j],y=p[j+1];let ex,ey;
      c.beginPath();c.moveTo(px,py);
      if(i<n-1){ex=(x+p[j+3])/2;ey=(y+p[j+4])/2;c.quadraticCurveTo(x,y,ex,ey)}else{ex=x;ey=y;c.lineTo(x,y)}
      c.lineWidth=widthAt(st,(p[j-1]+p[j+2])/2);c.stroke();px=ex;py=ey;
    }
  }
  c.restore();
}
function paint(c,d,bg,hide){
  c.fillStyle=PAPER[d.paper]||PAPER.white;c.fillRect(0,0,d.w,d.h);
  if(bg)c.drawImage(bg,0,0,d.w,d.h);else drawTemplate(c,d.tpl,d.w,d.h);
  for(const st of d.strokes)if(!hide||!hide.has(st))drawStroke(c,st);
}
async function loadBg(id){
  const rec=await DB.get('blobs',id);if(!rec)return null;
  if(window.createImageBitmap){try{return await createImageBitmap(rec.blob)}catch(e){}}
  return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(rec.blob);
    im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u});
}

/* ---------- Geometria ---------- */
const bboxCache=new WeakMap();
function bbox(st){
  let b=bboxCache.get(st);if(b)return b;
  const p=st.p,pad=st.t==='hl'?st.s/2:widthAt(st,1)/2;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let i=0;i<p.length;i+=3){if(p[i]<x0)x0=p[i];if(p[i]>x1)x1=p[i];if(p[i+1]<y0)y0=p[i+1];if(p[i+1]>y1)y1=p[i+1]}
  b={x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2};bboxCache.set(st,b);return b;
}
function segDist(px,py,ax,ay,bx,by){
  const vx=bx-ax,vy=by-ay,l=vx*vx+vy*vy;let t=l?((px-ax)*vx+(py-ay)*vy)/l:0;t=clamp(t,0,1);
  const dx=px-(ax+t*vx),dy=py-(ay+t*vy);return Math.sqrt(dx*dx+dy*dy);
}
function hitStroke(st,x,y,r){
  const b=bbox(st);if(x<b.x-r||x>b.x+b.w+r||y<b.y-r||y>b.y+b.h+r)return false;
  const p=st.p,n=p.length/3,lim=r+(st.t==='hl'?st.s/2:widthAt(st,.5)/2);
  if(n===1)return Math.hypot(p[0]-x,p[1]-y)<=lim;
  for(let i=0;i<n-1;i++){const j=i*3;if(segDist(x,y,p[j],p[j+1],p[j+3],p[j+4])<=lim)return true}
  return false;
}
function inPoly(x,y,poly){
  let ins=false;
  for(let i=0,j=poly.length-2;i<poly.length;j=i,i+=2){
    const xi=poly[i],yi=poly[i+1],xj=poly[j],yj=poly[j+1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;
  }
  return ins;
}
function translateStrokes(list,dx,dy){
  for(const st of list){const p=st.p;for(let i=0;i<p.length;i+=3){p[i]=r1(p[i]+dx);p[i+1]=r1(p[i+1]+dy)}bboxCache.delete(st)}
}
function unionBox(list){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const st of list){const b=bbox(st);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)}
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}

/* =====================================================================
   Biblioteca
   ===================================================================== */
const fmtDate=t=>{const d=new Date(t),now=new Date();
  if(d.toDateString()===now.toDateString())return 'hoje, '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:d.getFullYear()===now.getFullYear()?undefined:'numeric'})};

async function renderLibrary(){
  const list=(await DB.all('notebooks')).sort((a,b)=>b.updated-a.updated);
  const grid=$('#grid');grid.innerHTML='';
  $('#empty').hidden=list.length>0;
  for(const nb of list){
    const n=nb.order.length,card=document.createElement('div');card.className='card';
    card.innerHTML=`<button class="cover" data-cover="${coverOf(nb)}" aria-label="Abrir ${esc(nb.title)}">${SPARKS}<span class="cover-title">${esc(nb.title)}</span>${nb.pdf?'<span class="cover-pdf">PDF</span>':''}</button>
      <div class="card-meta"><div><div class="card-name">${esc(nb.title)}</div><div class="card-date">${n} ${n===1?'página':'páginas'} · ${fmtDate(nb.updated)}</div></div>
      <button class="icon more" aria-label="Opções de ${esc(nb.title)}"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button></div>`;
    $('.cover',card).onclick=()=>openNotebook(nb.id);
    $('.more',card).onclick=()=>notebookMenu(nb);
    grid.append(card);
  }
}

async function notebookMenu(nb){
  const a=await menu(nb.title,[
    {id:'open',label:'Abrir'},
    {id:'rename',label:'Renomear'},
    {id:'cover',label:'Mudar a capa'},
    {id:'pdf',label:'Exportar em PDF',sub:'Para compartilhar, imprimir ou guardar uma cópia'},
    {id:'del',label:'Apagar caderno',danger:true}
  ]);
  if(a==='open')openNotebook(nb.id);
  else if(a==='rename'){const t=await ask('Renomear caderno',nb.title);if(t){nb.title=t;await DB.put('notebooks',nb);renderLibrary()}}
  else if(a==='cover'){const c=await pickCover(coverOf(nb));if(c){nb.cover=c;await DB.put('notebooks',nb);renderLibrary()}}
  else if(a==='pdf'){const pages=await orderedPages(nb);exportPDF(nb.title,pages)}
  else if(a==='del'){
    if(await confirmDlg('Apagar “'+nb.title+'”?','O caderno e todas as páginas somem deste aparelho. Isso não pode ser desfeito.','Apagar')){
      for(const p of await DB.pagesOf(nb.id)){if(p.bg)await DB.del('blobs',p.bg);await DB.del('pages',p.id)}
      await DB.del('notebooks',nb.id);renderLibrary();toast('Caderno apagado');
    }
  }
}
async function orderedPages(nb){const m=new Map((await DB.pagesOf(nb.id)).map(p=>[p.id,p]));return nb.order.map(id=>m.get(id)).filter(Boolean)}
const newPage=(nbId,tpl,paper)=>({id:uid(),nb:nbId,tpl,paper,w:PAGE_W,h:A4_H,strokes:[],bg:null});

async function newNotebookDialog(){
  const r=await notebookForm();if(!r)return;
  const nb={id:uid(),title:r.title,cover:r.cover,tpl:r.tpl,paper:r.paper,created:Date.now(),updated:Date.now(),order:[]};
  const pg=newPage(nb.id,r.tpl,r.paper);nb.order.push(pg.id);
  await DB.put('pages',pg);await DB.put('notebooks',nb);
  openNotebook(nb.id);
}

/* =====================================================================
   Janelas (diálogos)
   ===================================================================== */
const dlg=$('#dlg');
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close('')});
function openDlg(html,setup){
  return new Promise(res=>{
    dlg.innerHTML='<div class="dlg">'+html+'</div>';dlg.returnValue='';
    const done=v=>{dlg._val=v;dlg.close('x')};dlg._val=undefined;
    setup&&setup(dlg,done);
    dlg.onclose=()=>{const v=dlg._val;dlg.onclose=null;res(v)};
    dlg.showModal();
  });
}
function menu(title,items){
  return openDlg(`<h2>${esc(title)}</h2><div class="menu">${items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'danger':''}"><span><span>${esc(it.label)}</span>${it.sub?`<span class="sub">${esc(it.sub)}</span>`:''}</span>${it.check!==undefined?`<span class="chk ${it.check?'on':''}" aria-hidden="true"></span>`:''}</button>`).join('')}</div>`,
    (d,done)=>d.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>done(items[+b.dataset.i].id)));
}
function ask(title,value,ok='Salvar'){
  return openDlg(`<h2>${esc(title)}</h2><form><input type="text" maxlength="80" value="${esc(value)}" aria-label="${esc(title)}"><div class="actions"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">${esc(ok)}</button></div></form>`,
    (d,done)=>{const i=$('input',d);setTimeout(()=>{i.focus();i.select()},50);
      $('[data-x]',d).onclick=()=>done(null);
      $('form',d).onsubmit=e=>{e.preventDefault();done(i.value.trim()||null)}});
}
function confirmDlg(title,msg,ok){
  return openDlg(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="actions"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok style="background:var(--danger)">${esc(ok)}</button></div>`,
    (d,done)=>{$('[data-x]',d).onclick=()=>done(false);$('[data-ok]',d).onclick=()=>done(true)});
}
function coverSwatches(sel){return `<div class="covers" role="radiogroup" aria-label="Capa">${COVERS.map(([id,name])=>`<button type="button" class="cv-pick" data-c="${id}" aria-pressed="${id===sel}"><span class="cover" data-cover="${id}"></span>${name}</button>`).join('')}</div>`}
function pickCover(sel){
  return openDlg(`<h2>Escolha a capa</h2>${coverSwatches(sel)}`,(d,done)=>d.querySelectorAll('.covers .cv-pick').forEach(b=>b.onclick=()=>done(b.dataset.c)));
}
function tplTiles(sel,paper){

const desk=$('#desk'),pagesEl=$('#pages');

const lctx=live.getContext('2d',{desynchronized:true});

async function openNotebook(id){
  const nb=await DB.get('notebooks',id);if(!nb){history.replaceState(null,'',location.pathname);return}
  const pages=await orderedPages(nb);
  S.nb=nb;S.pages=pages.map(d=>({d}));S.undo=[];S.redo=[];S.zoom=1;S.sel=null;S.cur=0;

async function closeNotebook(){
  clearSelection();await flushSaves();
  io.disconnect();S.pages.forEach(detach);pagesEl.innerHTML='';
  S.nb=null;S.pages=[];S.undo=[];S.redo=[];

/* ---------- Páginas na tela (só as visíveis têm canvas, para poupar memória) ---------- */
const io=new IntersectionObserver(es=>{for(const e of es){const rt=e.target._rt;if(!rt)continue;e.isIntersecting?attach(rt):detach(rt)}},{root:desk,rootMargin:'120% 60%'});
function buildPages(){
  io.disconnect();S.pages.forEach(detach);pagesEl.innerHTML='';
  for(const rt of S.pages){const el=document.createElement('div');el.className='page';el._rt=rt;rt.el=el;pagesEl.append(el)}
  const add=document.createElement('button');add.className='add-page';add.id='addPage';
  add.innerHTML='<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nova página';
  add.onclick=()=>addPage(S.pages.length-1);
  pagesEl.append(add);
  layout();
  for(const rt of S.pages)io.observe(rt.el);
}
function baseWidth(){return Math.min(desk.clientWidth-32,880)}
function layout(){
  const w=Math.round(baseWidth()*S.zoom),gap=Math.max(10,Math.round(22*S.zoom));
  pagesEl.style.width=Math.max(desk.clientWidth,w+32)+'px';pagesEl.style.gap=gap+'px';
  for(const rt of S.pages){rt.cw=w;rt.el.style.width=w+'px';rt.el.style.height=Math.round(w*rt.d.h/rt.d.w)+'px';
    rt.el.style.background=PAPER[rt.d.paper]||'#fff';if(rt.canvas){sizeCanvas(rt);renderPage(rt)}}
  const add=$('#addPage');if(add)add.style.width=Math.min(w,baseWidth())+'px';
  $('#zoomInd').textContent=Math.round(S.zoom*100)+'%';
}
function sizeCanvas(rt){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  let px=Math.round(rt.cw*dpr);px=Math.min(px,2600);   // limite de memória do iPad
  const ph=Math.round(px*rt.d.h/rt.d.w);
  if(rt.canvas.width!==px||rt.canvas.height!==ph){rt.canvas.width=px;rt.canvas.height=ph}
  rt.k=px/rt.d.w;
}
function attach(rt){
  if(rt.canvas)return;
  rt.canvas=document.createElement('canvas');rt.ctx=rt.canvas.getContext('2d');rt.el.prepend(rt.canvas);
  sizeCanvas(rt);renderPage(rt);
  if(rt.d.bg&&!rt.bgImg&&!rt.bgLoading){
    rt.bgLoading=true;loadBg(rt.d.bg).then(img=>{rt.bgLoading=false;if(!rt.canvas){img&&img.close&&img.close();return}rt.bgImg=img;renderPage(rt)});
  }
}
function detach(rt){
  if(!rt.canvas)return;
  if(act&&act.rt===rt)return;
  if(S.sel&&S.sel.rt===rt)clearSelection();
  if(live.parentNode===rt.el)live.remove();
  rt.canvas.width=rt.canvas.height=0;rt.canvas.remove();rt.canvas=rt.ctx=null;
  if(rt.bgImg){rt.bgImg.close&&rt.bgImg.close();rt.bgImg=null}
}
function renderPage(rt){
  if(!rt.canvas)return;
  const c=rt.ctx;c.setTransform(rt.k,0,0,rt.k,0,0);
  const hide=S.sel&&S.sel.rt===rt&&S.sel.dragging?S.sel.set:null;
  paint(c,rt.d,rt.bgImg,hide);
}
function ensureLive(rt){
  if(live.parentNode!==rt.el)rt.el.append(live);
  if(live.width!==rt.canvas.width||live.height!==rt.canvas.height){live.width=rt.canvas.width;live.height=rt.canvas.height}
  lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(rt.k,0,0,rt.k,0,0);
}
function clearLive(){lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height)}

/* ---------- Salvamento automático ---------- */
const saveTimers=new Map();let nbTimer;
function save(rt){
  clearTimeout(saveTimers.get(rt));
  saveTimers.set(rt,setTimeout(()=>{saveTimers.delete(rt);DB.put('pages',rt.d).catch(saveFail)},400));
  touchNb();
}
function touchNb(){if(!S.nb)return;S.nb.updated=Date.now();clearTimeout(nbTimer);const nb=S.nb;nbTimer=setTimeout(()=>DB.put('notebooks',nb).catch(saveFail),600)}
async function flushSaves(){
  const list=[...saveTimers.keys()];saveTimers.forEach(t=>clearTimeout(t));saveTimers.clear();
  for(const rt of list)await DB.put('pages',rt.d).catch(saveFail);
  clearTimeout(nbTimer);if(S.nb)await DB.put('notebooks',S.nb).catch(saveFail);
}
function saveFail(e){console.error(e);toast('Não consegui salvar. O aparelho pode estar sem espaço.',5000)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSaves()});
window.addEventListener('pagehide',()=>flushSaves());

/* ---------- Desfazer / refazer ---------- */
function pushUndo(a){S.undo.push(a);if(S.undo.length>200)S.undo.shift();S.redo=[];updateUndo()}
function applyAction(a,dir){
  const s=a.rt.d.strokes;
  if(a.t==='add'){
    if(dir<0)a.items.forEach(st=>{const i=s.indexOf(st);if(i>=0)s.splice(i,1)});else s.push(...a.items);
  }else if(a.t==='del'){
    if(dir<0)[...a.items].reverse().forEach(({st,i})=>s.splice(i,0,st));
    else a.items.forEach(({st})=>{const i=s.indexOf(st);if(i>=0)s.splice(i,1)});
  }else if(a.t==='move')translateStrokes(a.items,a.dx*dir,a.dy*dir);
  else if(a.t==='color')a.items.forEach((st,j)=>st.c=dir<0?a.from[j]:a.to);
  clearSelection();renderPage(a.rt);save(a.rt);
}
function undo(){const a=S.undo.pop();if(!a)return;applyAction(a,-1);S.redo.push(a);updateUndo();scrollToRt(a.rt)}
function redo(){const a=S.redo.pop();if(!a)return;applyAction(a,1);S.undo.push(a);updateUndo();scrollToRt(a.rt)}
function updateUndo(){$('#btnUndo').disabled=!S.undo.length;$('#btnRedo').disabled=!S.redo.length}
function scrollToRt(rt){const r=rt.el.getBoundingClientRect(),dr=desk.getBoundingClientRect();if(r.bottom<dr.top||r.top>dr.bottom)desk.scrollTop+=r.top-dr.top-20}

/* ---------- Barra de ferramentas ---------- */

    colors.querySelectorAll('button.swatch').forEach(b=>b.onclick=()=>setColor(b.dataset.c));

$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;

$('#btnMenu').onclick=editorMenu;

/* ---------- Entrada: caneta, dedo e mouse ---------- */
function pressureOf(e){return e.pointerType==='pen'?Math.max(.05,e.pressure||.5):.5}
function toPage(e,a){return {x:(e.clientX-a.rect.left)/a.rect.width*a.rt.d.w,y:(e.clientY-a.rect.top)/a.rect.height*a.rt.d.h,p:pressureOf(e)}}

pagesEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen'&&!P.penSeen){
    P.penSeen=true;P.penOnly=true;savePrefs();
    toast('Caneta detectada: agora só a caneta escreve e o dedo rola a página. Dá para mudar em “Mais opções”.',6000);
  }
  if(act||pinch)return;
  if(e.pointerType==='touch'&&P.penOnly)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const el=e.target.closest('.page');
  if(!el){if(S.sel)clearSelection();return}
  const rt=el._rt;if(!rt.canvas)return;
  e.preventDefault();
  if(e.pointerType==='pen')penDown=true;
  try{el.setPointerCapture(e.pointerId)}catch(x){}
  const a={rt,id:e.pointerId,type:e.pointerType,rect:el.getBoundingClientRect()};
  const pt=toPage(e,a),t=P.tool;
  if(t==='lasso'&&S.sel){
    const b=S.sel.box;
    if(S.sel.rt===rt&&pt.x>=b.x-12&&pt.x<=b.x+b.w+12&&pt.y>=b.y-12&&pt.y<=b.y+b.h+12){
      Object.assign(a,{kind:'drag',start:pt,dx:0,dy:0});act=a;S.sel.dragging=true;$('#selBar').hidden=true;
      renderPage(rt);ensureLive(rt);drawSelection();return;
    }
    clearSelection();
  }
  ensureLive(rt);
  if(t==='pen'||t==='hl'){
    a.kind='ink';a.st={t,c:t==='pen'?P.penColor:P.hlColor,s:SIZES[t][P.size[t]],p:[]};a.lp=pt.p;
    act=a;addPoint(pt);a.anchor=pt;armHold();schedule();
  }else if(t==='eraser'){
    Object.assign(a,{kind:'erase',removed:[],last:pt});act=a;eraseAt(pt);drawEraser(pt);
  }else{
    Object.assign(a,{kind:'lasso',poly:[pt.x,pt.y]});act=a;
  }
});
pagesEl.addEventListener('pointermove',e=>{
  if(!act||e.pointerId!==act.id)return;
  const list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];if(!list.length)list.push(e);
  if(act.kind==='ink'){
    for(const ev of list)addPoint(toPage(ev,act));
    const last=toPage(e,act);
    if(Math.hypot(last.x-act.anchor.x,last.y-act.anchor.y)>3){act.anchor=last;armHold()}
    schedule();
  }else if(act.kind==='erase'){
    for(const ev of list){const pt=toPage(ev,act);eraseLine(act.last,pt);act.last=pt}
    drawEraser(act.last);
  }else if(act.kind==='lasso'){
    for(const ev of list){const pt=toPage(ev,act);act.poly.push(r1(pt.x),r1(pt.y))}
    schedule();
  }else if(act.kind==='drag'){
    const pt=toPage(e,act);act.dx=pt.x-act.start.x;act.dy=pt.y-act.start.y;schedule();
  }
});
pagesEl.addEventListener('pointerup',e=>{if(act&&e.pointerId===act.id)finish()});
pagesEl.addEventListener('pointercancel',e=>{if(act&&e.pointerId===act.id)cancelAct()});
window.addEventListener('pointerup',e=>{if(e.pointerType==='pen')penDown=false});
window.addEventListener('pointercancel',e=>{if(e.pointerType==='pen')penDown=false});

function addPoint(pt){
  const a=act,p=a.st.p,n=p.length;
  const pr=a.lp=a.lp*.6+pt.p*.4;   // suaviza a pressão
  if(a.straight){p[n-3]=r1(pt.x);p[n-2]=r1(pt.y);return}
  if(n&&Math.hypot(pt.x-p[n-3],pt.y-p[n-2])<.5)return;
  p.push(r1(pt.x),r1(pt.y),Math.round(pr*100)/100);
}
/* Segurar a caneta parada no fim do traço transforma o rabisco em linha reta */
function armHold(){
  clearTimeout(act.hold);const a=act;
  a.hold=setTimeout(()=>{
    if(act!==a||a.kind!=='ink'||a.straight)return;
    const p=a.st.p,n=p.length/3;if(n<4)return;
    let len=0;for(let i=3;i<p.length;i+=3)len+=Math.hypot(p[i]-p[i-3],p[i+1]-p[i-2]);
    if(len<40)return;
    let avg=0;for(let i=2;i<p.length;i+=3)avg+=p[i];avg=Math.round(avg/n*100)/100;
    a.st.p=[p[0],p[1],avg,p[p.length-3],p[p.length-2],avg];a.straight=true;schedule();
  },550);
}
let raf=0;
function schedule(){if(!raf)raf=requestAnimationFrame(frame)}
function frame(){
  raf=0;if(!act)return;
  const k=act.rt.k;lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(k,0,0,k,0,0);
  if(act.kind==='ink')drawStroke(lctx,act.st);
  else if(act.kind==='lasso'){
    const p=act.poly;lctx.save();lctx.lineWidth=1.5;lctx.setLineDash([6,5]);lctx.strokeStyle='#8B5CF6';lctx.fillStyle='rgba(139,92,246,.06)';
    lctx.beginPath();lctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)lctx.lineTo(p[i],p[i+1]);lctx.closePath();lctx.fill();lctx.stroke();lctx.restore();
  }else if(act.kind==='drag')drawSelection();
}
function finish(){
  const a=act;act=null;clearTimeout(a.hold);cancelAnimationFrame(raf);raf=0;
  if(a.type==='pen')penDown=false;
  const rt=a.rt;
  if(a.kind==='ink'){
    clearLive();
    if(a.st.p.length){rt.d.strokes.push(a.st);rt.ctx.setTransform(rt.k,0,0,rt.k,0,0);drawStroke(rt.ctx,a.st);pushUndo({t:'add',rt,items:[a.st]});save(rt)}
  }else if(a.kind==='erase'){
    clearLive();if(a.removed.length){pushUndo({t:'del',rt,items:a.removed});save(rt)}
  }else if(a.kind==='lasso'){
    clearLive();selectInLasso(rt,a.poly);
  }else if(a.kind==='drag'){
    S.sel.dragging=false;
    if(Math.abs(a.dx)>.5||Math.abs(a.dy)>.5){
      translateStrokes(S.sel.items,a.dx,a.dy);pushUndo({t:'move',rt,items:[...S.sel.items],dx:a.dx,dy:a.dy});
      S.sel.box.x+=a.dx;S.sel.box.y+=a.dy;save(rt);
    }
    renderPage(rt);ensureLive(rt);drawSelection();showSelBar();
  }
  updateIndicator();
}
function cancelAct(){
  const a=act;if(!a)return;act=null;clearTimeout(a.hold);
  if(a.type==='pen')penDown=false;
  if(a.kind==='erase'&&a.removed.length){[...a.removed].reverse().forEach(({st,i})=>a.rt.d.strokes.splice(i,0,st));renderPage(a.rt)}
  if(a.kind==='drag'){S.sel.dragging=false;renderPage(a.rt);ensureLive(a.rt);drawSelection();showSelBar();return}
  clearLive();
}

/* ---------- Borracha (apaga o traço inteiro que ela toca) ---------- */
function eraseAt(pt){
  const a=act,s=a.rt.d.strokes,r=SIZES.eraser[P.size.eraser]/2;let hit=false;
  for(let i=s.length-1;i>=0;i--)if(hitStroke(s[i],pt.x,pt.y,r)){a.removed.push({st:s[i],i});s.splice(i,1);hit=true}
  if(hit)renderPage(a.rt);
}
function eraseLine(p0,p1){
  const r=SIZES.eraser[P.size.eraser]/2,d=Math.hypot(p1.x-p0.x,p1.y-p0.y),steps=Math.max(1,Math.ceil(d/(r*.6)));
  for(let i=1;i<=steps;i++)eraseAt({x:p0.x+(p1.x-p0.x)*i/steps,y:p0.y+(p1.y-p0.y)*i/steps});
}
function drawEraser(pt){
  const r=SIZES.eraser[P.size.eraser]/2,k=act.rt.k;
  lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(k,0,0,k,0,0);
  lctx.beginPath();lctx.arc(pt.x,pt.y,r,0,6.2832);lctx.fillStyle='rgba(120,110,130,.12)';lctx.fill();
  lctx.lineWidth=1.2;lctx.strokeStyle='rgba(80,70,90,.6)';lctx.stroke();
}

/* ---------- Laço: selecionar, mover, recolorir, duplicar, apagar ---------- */
function selectInLasso(rt,poly){
  if(poly.length<8){clearSelection();return}
  const items=rt.d.strokes.filter(st=>{const p=st.p,n=p.length/3;let inside=0;
    for(let i=0;i<p.length;i+=3)if(inPoly(p[i],p[i+1],poly))inside++;return inside/n>=.5});
  if(!items.length){clearSelection();return}
  S.sel={rt,items,set:new Set(items),box:unionBox(items),dragging:false};
  ensureLive(rt);drawSelection();showSelBar();
}
function drawSelection(){
  const s=S.sel;if(!s)return;const k=s.rt.k,dx=act&&act.kind==='drag'?act.dx:0,dy=act&&act.kind==='drag'?act.dy:0;
  lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(k,0,0,k,0,0);
  if(s.dragging)for(const st of s.items)drawStroke(lctx,st,dx,dy);
  const b=s.box;lctx.save();lctx.setLineDash([7,6]);lctx.lineWidth=1.6;lctx.strokeStyle='#8B5CF6';lctx.fillStyle='rgba(139,92,246,.05)';
  lctx.beginPath();lctx.rect(b.x-8+dx,b.y-8+dy,b.w+16,b.h+16);lctx.fill();lctx.stroke();lctx.restore();
}
function clearSelection(){if(!S.sel)return;const rt=S.sel.rt;S.sel=null;$('#selBar').hidden=true;if(live.parentNode===rt.el)clearLive();renderPage(rt)}
function showSelBar(){
  const s=S.sel,bar=$('#selBar');if(!s)return;
  bar.innerHTML=`<button class="btn" data-a="dup">Duplicar</button><button class="btn" data-a="del" style="color:var(--danger)">Apagar</button><span class="sep"></span>`+
    PEN_COLORS.map(c=>`<button class="swatch" data-c="${c}" style="--sw:${c}" aria-label="Pintar de ${c}"><span></span></button>`).join('');
  bar.querySelector('[data-a=del]').onclick=deleteSelection;
  bar.querySelector('[data-a=dup]').onclick=duplicateSelection;
  bar.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>recolorSelection(b.dataset.c));
  bar.hidden=false;placeSelBar();
}
function placeSelBar(){
  const s=S.sel,bar=$('#selBar');if(!s||bar.hidden)return;
  const r=s.rt.el.getBoundingClientRect(),sc=r.width/s.rt.d.w,bw=bar.offsetWidth,bh=bar.offsetHeight;
  let x=r.left+(s.box.x+s.box.w/2)*sc,y=r.top+(s.box.y-8)*sc-bh-10;
  const top=desk.getBoundingClientRect().top+8;
  if(y<top)y=r.top+(s.box.y+s.box.h+8)*sc+10;
  x=clamp(x,bw/2+8,innerWidth-bw/2-8);y=clamp(y,top,innerHeight-bh-8);
  bar.style.left=x+'px';bar.style.top=y+'px';
}
function deleteSelection(){
  const s=S.sel;if(!s)return;const arr=s.rt.d.strokes,removed=[];
  for(let i=arr.length-1;i>=0;i--)if(s.set.has(arr[i])){removed.push({st:arr[i],i});arr.splice(i,1)}
  const rt=s.rt;clearSelection();pushUndo({t:'del',rt,items:removed});renderPage(rt);save(rt);
}
function duplicateSelection(){
  const s=S.sel;if(!s)return;const rt=s.rt;
  const copies=s.items.map(st=>({...st,p:st.p.slice()}));translateStrokes(copies,24,24);
  rt.d.strokes.push(...copies);pushUndo({t:'add',rt,items:copies});save(rt);
  S.sel={rt,items:copies,set:new Set(copies),box:unionBox(copies),dragging:false};
  renderPage(rt);ensureLive(rt);drawSelection();showSelBar();
}
function recolorSelection(c){
  const s=S.sel;if(!s)return;const items=s.items.filter(st=>st.t==='pen');if(!items.length)return;
  pushUndo({t:'color',rt:s.rt,items,from:items.map(st=>st.c),to:c});items.forEach(st=>st.c=c);renderPage(s.rt);save(s.rt);
}

/* ---------- Rolagem, pinça e palma da mão ---------- */
const isStylus=e=>penDown||[...e.touches].some(t=>t.touchType==='stylus');
desk.addEventListener('touchstart',e=>{
  if(isStylus(e)){e.preventDefault();return}
  if(e.touches.length===2&&e.cancelable){
    e.preventDefault();if(act&&act.type==='touch')cancelAct();startPinch(e);return;
  }
  if(!P.penOnly&&e.touches.length===1&&e.target.closest('.page'))e.preventDefault();
},{passive:false});
desk.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length>=2){e.preventDefault();movePinch(e);return}
  if(isStylus(e)){e.preventDefault();return}
  if(!P.penOnly&&act&&act.type==='touch')e.preventDefault();
},{passive:false});
desk.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2)endPinch()});
desk.addEventListener('touchcancel',()=>{if(pinch)endPinch()});
document.addEventListener('gesturestart',e=>e.preventDefault());

function midOf(e){const a=e.touches[0],b=e.touches[1],r=desk.getBoundingClientRect();
  return {x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top,d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}}
function startPinch(e){
  const m=midOf(e);clearSelection();
  pinch={d0:Math.max(m.d,1),z0:S.zoom,sx:desk.scrollLeft,sy:desk.scrollTop,px:desk.scrollLeft+m.x,py:desk.scrollTop+m.y,m,r:1};
  $('#zoomInd').hidden=false;
}
function movePinch(e){
  const m=midOf(e),p=pinch;p.m=m;
  p.r=clamp(p.z0*m.d/p.d0,.5,4)/p.z0;
  const tx=m.x+p.sx-p.px*p.r,ty=m.y+p.sy-p.py*p.r;
  pagesEl.style.transform=`translate(${tx}px,${ty}px) scale(${p.r})`;
  $('#zoomInd').textContent=Math.round(p.z0*p.r*100)+'%';
}
function endPinch(){
  const p=pinch;pinch=null;pagesEl.style.transform='';
  setZoom(p.z0*p.r,p.px,p.py,p.m.x,p.m.y,p.z0);
  setTimeout(()=>{if(!pinch)$('#zoomInd').hidden=true},900);
}
function setZoom(z,px,py,mx,my,z0=S.zoom){
  z=clamp(z,.5,4);if(Math.abs(z-1)<.06)z=1;
  const r=z/z0;S.zoom=z;layout();
  desk.scrollLeft=px*r-mx;desk.scrollTop=py*r-my;updateIndicator();
}
desk.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();
  const r=desk.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  setZoom(S.zoom*Math.exp(-e.deltaY*.01),desk.scrollLeft+mx,desk.scrollTop+my,mx,my);
  $('#zoomInd').hidden=false;clearTimeout(desk._zt);desk._zt=setTimeout(()=>$('#zoomInd').hidden=true,900);
},{passive:false});

let indRaf=0;
desk.addEventListener('scroll',()=>{if(!indRaf)indRaf=requestAnimationFrame(()=>{indRaf=0;updateIndicator();placeSelBar()})},{passive:true});
function updateIndicator(){
  if(!S.pages.length)return;const mid=desk.scrollTop+desk.clientHeight/2;let cur=0;
  for(let i=0;i<S.pages.length;i++){const el=S.pages[i].el;if(!el)continue;if(el.offsetTop<=mid)cur=i;else break}
  S.cur=cur;$('#pageInd').textContent=(cur+1)+' / '+S.pages.length;
}
let resizeT;
window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(S.nb){layout();updateIndicator();placeSelBar()}},120)});

/* ---------- Páginas: criar, trocar modelo, apagar ---------- */
async function addPage(after){
  const ref=S.pages[after]?S.pages[after].d:null;
  const tpl=ref&&ref.tpl!=='pdf'?ref.tpl:(S.nb.tpl||'lined'),paper=ref&&ref.tpl!=='pdf'?ref.paper:(S.nb.paper||'white');
  const d=newPage(S.nb.id,tpl,paper);
  S.nb.order.splice(after+1,0,d.id);S.pages.splice(after+1,0,{d});
  await DB.put('pages',d);touchNb();
  const top=desk.scrollTop;buildPages();desk.scrollTop=top;
  const el=S.pages[after+1].el;desk.scrollTo({top:el.offsetTop-16,behavior:'smooth'});
  updateIndicator();
}
async function deletePage(i){
  const rt=S.pages[i];
  if(!(await confirmDlg('Apagar a página '+(i+1)+'?','O que está escrito nela some. Isso não pode ser desfeito.','Apagar')))return;
  clearSelection();detach(rt);
  S.undo=S.undo.filter(a=>a.rt!==rt);S.redo=S.redo.filter(a=>a.rt!==rt);updateUndo();
  clearTimeout(saveTimers.get(rt));saveTimers.delete(rt);
  S.pages.splice(i,1);S.nb.order.splice(i,1);
  await DB.del('pages',rt.d.id);if(rt.d.bg)await DB.del('blobs',rt.d.bg);
  if(!S.pages.length){const d=newPage(S.nb.id,S.nb.tpl||'lined',S.nb.paper||'white');S.nb.order.push(d.id);S.pages.push({d});await DB.put('pages',d)}
  touchNb();const top=desk.scrollTop;buildPages();desk.scrollTop=top;updateIndicator();toast('Página apagada');
}
async function editorMenu(){
  const i=S.cur,rt=S.pages[i],isPdf=rt.d.tpl==='pdf';
  const a=await menu('Página '+(i+1)+' de '+S.pages.length,[
    {id:'add',label:'Nova página depois desta'},
    ...(isPdf?[]:[{id:'tpl',label:'Mudar o modelo desta página',sub:'Liso, pautado, quadriculado, pontilhado ou Cornell'}]),
    {id:'pdfIn',label:'Inserir PDF no fim do caderno'},
    {id:'pdfOut',label:'Exportar caderno em PDF'},
    {id:'penOnly',label:'Só a caneta escreve',sub:P.penOnly?'O dedo rola a página e a palma da mão é ignorada':'O dedo também escreve. Role com dois dedos',check:P.penOnly},
    {id:'rename',label:'Renomear caderno'},
    {id:'del',label:'Apagar esta página',danger:true}
  ]);
  if(a==='add')addPage(i);
  else if(a==='tpl'){const r=await templateForm(rt.d);if(r){rt.d.tpl=r.tpl;rt.d.paper=r.paper;layout();renderPage(rt);save(rt)}}
  else if(a==='pdfIn'){pdfTarget=S.nb;$('#pdfInput').click()}
  else if(a==='pdfOut'){await flushSaves();exportPDF(S.nb.title,S.pages.map(r=>r.d))}
  else if(a==='penOnly'){P.penOnly=!P.penOnly;P.penSeen=true;savePrefs();toast(P.penOnly?'Só a caneta escreve. O dedo rola a página.':'O dedo também escreve. Para rolar, use dois dedos.')}
  else if(a==='rename')renameCurrent();
  else if(a==='del')deletePage(i);
}

/* ---------- Teclado ---------- */
document.addEventListener('keydown',e=>{
  if(!S.nb||dlg.open||e.target.closest('input'))return;
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(mod)return;
  if((k==='delete'||k==='backspace')&&S.sel){e.preventDefault();deleteSelection();return}
  if(k==='escape'){clearSelection();return}
  const map={p:'pen',h:'hl',e:'eraser',l:'lasso'};if(map[k])setTool(map[k]);
});

/* =====================================================================
   PDF: importar para anotar e exportar o caderno
   ===================================================================== */
let pdfTarget=null,pdfjs=null;
async function loadPdfJs(){
  if(pdfjs)return pdfjs;
  pdfjs=await import('../vendor/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc=new URL('../vendor/pdf.worker.min.mjs',location.href).href;
  return pdfjs;
}
const toBlob=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
$('#pdfInput').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const target=pdfTarget;pdfTarget=null;
  try{await importPDF(f,target)}catch(err){console.error(err);hideToast();toast('Não consegui abrir esse PDF. Ele pode estar protegido por senha ou danificado.',5000)}
};
async function importPDF(file,target){
  toast('Abrindo o PDF…',0);
  const lib=await loadPdfJs();
  const task=lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}),doc=await task.promise;
  let nb=target;
  if(!nb){nb={id:uid(),title:file.name.replace(/\.pdf$/i,'')||'PDF',cover:'holo',tpl:'blank',paper:'white',pdf:true,created:Date.now(),updated:Date.now(),order:[]}}
  const added=[];
  for(let i=1;i<=doc.numPages;i++){
    toast('Preparando a página '+i+' de '+doc.numPages+'…',0);
    const page=await doc.getPage(i),vp1=page.getViewport({scale:1}),scale=1600/vp1.width,vp=page.getViewport({scale});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvas:c,canvasContext:ctx,viewport:vp}).promise;
    const blob=await toBlob(c,'image/jpeg',.9);c.width=c.height=0;page.cleanup();
    const bid=uid();await DB.put('blobs',{id:bid,blob});
    const d={id:uid(),nb:nb.id,tpl:'pdf',paper:'white',w:PAGE_W,h:Math.round(PAGE_W*vp1.height/vp1.width),strokes:[],bg:bid};
    await DB.put('pages',d);nb.order.push(d.id);added.push(d);
  }
  try{await task.destroy()}catch(e){}
  if(target&&S.nb===target){
    S.pages.push(...added.map(d=>({d})));touchNb();await flushSaves();
    const top=desk.scrollTop;buildPages();desk.scrollTop=top;updateIndicator();
    toast(added.length+(added.length===1?' página adicionada':' páginas adicionadas')+' no fim do caderno');
  }else{
    nb.updated=Date.now();await DB.put('notebooks',nb);hideToast();openNotebook(nb.id);
  }
}

/* Monta um PDF simples: cada página vira uma imagem JPEG. Não precisa de biblioteca. */
async function exportPDF(title,pages){
  try{
    const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
    const w=s=>{const b=typeof s==='string'?enc.encode(s):s;chunks.push(b);len+=b.length};
    const n=pages.length,total=2+n*3;
    w('%PDF-1.4\n%âãÏÓ\n');
    offs[1]=len;w('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offs[2]=len;w(`2 0 obj\n<< /Type /Pages /Kids [${pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${n} >>\nendobj\n`);
    for(let i=0;i<n;i++){
      toast('Gerando o PDF: página '+(i+1)+' de '+n+'…',0);
      const d=pages[i],px=1240,c=document.createElement('canvas');c.width=px;c.height=Math.round(px*d.h/d.w);
      const x=c.getContext('2d'),k=px/d.w,bg=d.bg?await loadBg(d.bg):null;
      x.setTransform(k,0,0,k,0,0);paint(x,d,bg);bg&&bg.close&&bg.close();
      const jpg=new Uint8Array(await (await toBlob(c,'image/jpeg',.88)).arrayBuffer());
      const iw=c.width,ih=c.height;c.width=c.height=0;
      const W=595.28,H=+(W*d.h/d.w).toFixed(2),po=3+i*3,co=po+1,im=po+2,cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
      offs[po]=len;w(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
      offs[co]=len;w(`${co} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
      offs[im]=len;w(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);w(jpg);w('\nendstream\nendobj\n');
    }
    const xo=len;let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
    w(x+`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`);
    const name=(title.replace(/[\\/:*?"<>|]+/g,' ').trim()||'Caderno')+'.pdf';
    const file=new File(chunks,name,{type:'application/pdf'});
    hideToast();
    const canShare=navigator.canShare&&navigator.canShare({files:[file]});
    const a=await menu('PDF pronto',[
      ...(canShare?[{id:'share',label:'Compartilhar',sub:'Enviar, salvar em Arquivos ou imprimir'}]:[]),
      {id:'down',label:'Baixar o arquivo',sub:name}
    ]);
    if(a==='share'){try{await navigator.share({files:[file],title})}catch(e){if(e.name!=='AbortError')download(file)}}
    else if(a==='down')download(file);
  }catch(e){console.error(e);hideToast();toast('Não consegui gerar o PDF.',4000)}
}
function download(file){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
