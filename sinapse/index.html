function midOf(e){const a=e.touches[0],b=e.touches[1],r=desk.getBoundingClientRect();
  return {x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top,d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}}
function startPinch(e){
  const m=midOf(e);commitText();clearSelection();
  pinch={d0:Math.max(m.d,1),z0:S.zoom,sx:desk.scrollLeft,sy:desk.scrollTop,px:desk.scrollLeft+m.x,py:desk.scrollTop+m.y,m,r:1};
  $('#zoomInd').hidden=false;
}
function movePinch(e){
  const m=midOf(e),p=pinch;p.m=m;
  p.r=clamp(p.z0*m.d/p.d0,.5,4)/p.z0;
  const tx=m.x+p.sx-p.px*p.r,ty=m.y+p.sy-p.py*p.r;
  pagesEl.style.transform=`translate(${tx}px,${ty}px) scale(${p.r})`;
  $('#zoomInd').textContent=Math.round(p.z0*p.r*100)+'%';
}
function endPinch(){
  const p=pinch;pinch=null;pagesEl.style.transform='';
  setZoom(p.z0*p.r,p.px,p.py,p.m.x,p.m.y,p.z0);
  setTimeout(()=>{if(!pinch)$('#zoomInd').hidden=true},900);
}
function setZoom(z,px,py,mx,my,z0=S.zoom){
  z=clamp(z,.5,4);if(Math.abs(z-1)<.06)z=1;
  const r=z/z0;S.zoom=z;layout();
  desk.scrollLeft=px*r-mx;desk.scrollTop=py*r-my;updateIndicator();
}
desk.addEventListener('wheel',e=>{
  if(RL.on&&inRuler(e.clientX,e.clientY)&&!e.ctrlKey){e.preventDefault();RL.raw=(RL.raw??RL.a)+e.deltaY*.004;RL.a=snapAngle(RL.raw);placeRuler();clearTimeout(RL.wt);RL.wt=setTimeout(()=>RL.raw=undefined,400);return}
  if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();
  const r=desk.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  setZoom(S.zoom*Math.exp(-e.deltaY*.01),desk.scrollLeft+mx,desk.scrollTop+my,mx,my);
  $('#zoomInd').hidden=false;clearTimeout(desk._zt);desk._zt=setTimeout(()=>$('#zoomInd').hidden=true,900);
},{passive:false});

function updateIndicator(){
  if(!S.pages.length)return;const mid=desk.scrollTop+desk.clientHeight/2;let cur=0;

/* ---------- Busca ---------- */
const norm=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function pageSources(d){
  const out=[];
  if(d.sec)out.push({t:d.sec,box:null,kind:'Divisória'});
  for(const st of d.strokes)if(st.t==='text'&&st.txt)out.push({t:st.txt,box:bbox(st),kind:'Texto'});
  if(d.pt)out.push({t:d.pt.map(i=>i.s).join(' '),box:null,kind:'PDF',pt:true});
  return out;
}
function snippet(t,q){
  const n=norm(t),i=n.indexOf(q);if(i<0)return null;
  const a=Math.max(0,i-38),b=Math.min(t.length,i+q.length+60);
  return (a?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length,b))+(b<t.length?'…':'');
}
function searchPages(pages,q){
  const res=[];
  pages.forEach((d,i)=>{for(const src of pageSources(d)){const sn=snippet(src.t,q);if(sn){res.push({i,d,kind:src.kind,sn});break}}});
  return res;
}
function hitBoxes(d,q){
  const boxes=[];
  for(const st of d.strokes)if(st.t==='text'&&norm(st.txt).includes(q))boxes.push(bbox(st));
  if(d.pt){for(const it of d.pt)if(norm(it.s).includes(q))boxes.push({x:it.x,y:it.y,w:it.w,h:it.h})}
  return boxes;
}
function flashHits(rt,q){
  if(!rt.canvas)return;const boxes=hitBoxes(rt.d,q);if(!boxes.length)return;
  ensureLive(rt);let t0=performance.now();
  const step=now=>{const t=now-t0;if(live.parentNode!==rt.el||act)return;
    const k=rt.k;lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(k,0,0,k,0,0);
    const al=t<2200?1:Math.max(0,1-(t-2200)/600);if(!al){clearLive();return}
    lctx.save();lctx.globalAlpha=al*.28;lctx.fillStyle='#FF7BC0';for(const b of boxes){rrect(lctx,b.x-6,b.y-4,b.w+12,b.h+8,6);lctx.fill()}
    lctx.globalAlpha=al;lctx.strokeStyle='#E2549C';lctx.lineWidth=2;for(const b of boxes){rrect(lctx,b.x-6,b.y-4,b.w+12,b.h+8,6);lctx.stroke()}lctx.restore();
    requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function gotoHit(i,q){
  const rt=S.pages[i];if(!rt)return;
  const boxes=hitBoxes(rt.d,q),b=boxes[0],sc=rt.el.clientWidth/rt.d.w;
  desk.scrollTo({top:rt.el.offsetTop+(b?Math.max(0,b.y*sc-desk.clientHeight*.35):-24)});
  setTimeout(()=>{attach(rt);flashHits(rt,q)},250);
  if(innerWidth<900)togglePanel(false);
}

/* ---------- Painel: miniaturas, favoritas e divisórias ---------- */
const panel=$('#panel');let panelMode='all',thumbIO=null;
function decoratePage(rt){
  rt.el.querySelectorAll('.sec-tab,.fav-mark').forEach(x=>x.remove());
  if(rt.d.sec){const t=document.createElement('div');t.className='sec-tab';t.textContent=rt.d.sec;rt.el.append(t)}
  if(rt.d.fav){const f=document.createElement('div');f.className='fav-mark';f.innerHTML=STAR;rt.el.append(f)}
}
function togglePanel(force){
  const open=force!==undefined?force:panel.hidden;panel.hidden=!open;if(!open)$('#pageSearch').value='';$('#btnPages').setAttribute('aria-pressed',open);
  if(open)renderPanel();else if(thumbIO)thumbIO.disconnect();
}
function renderPanel(){
  if(panel.hidden||!S.nb)return;
  panel.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===panelMode));
  const box=$('#thumbs');box.innerHTML='';if(thumbIO)thumbIO.disconnect();
  const q=norm($('#pageSearch').value.trim());
  if(q.length>=2){
    const res=searchPages(S.pages.map(r=>r.d),q);
    if(!res.length)box.innerHTML='<p class="panel-empty">Nada encontrado neste caderno. A busca procura em textos digitados, divisórias e PDFs.</p>';
    for(const r of res){const el=document.createElement('button');el.className='res';el.innerHTML=`<div><small>Página ${r.i+1} · ${r.kind}</small><span>${r.sn}</span></div>`;el.onclick=()=>gotoHit(r.i,q);box.append(el)}
    return;
  }
  thumbIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){thumbIO.unobserve(e.target);drawThumb(e.target)}}),{root:box,rootMargin:'300px'});
  let any=false;
  S.pages.forEach((rt,i)=>{
    const d=rt.d;
    if(panelMode==='fav'&&!d.fav||panelMode==='sec'&&!d.sec)return;
    if(d.sec&&panelMode!=='fav'){const h=document.createElement('div');h.className='sec-h';h.textContent=d.sec;box.append(h)}
    const t=document.createElement('div');t.className='thumb'+(i===S.cur?' cur':'');t._i=i;
    t.innerHTML=`<button class="tgo" aria-label="Ir para a página ${i+1}"><canvas width="240" height="${Math.round(240*d.h/d.w)}"></canvas></button><span>${i+1}</span><button class="star ${d.fav?'on':''}" aria-label="${d.fav?'Tirar dos favoritos':'Favoritar'}">${STAR}</button>`;
    $('.tgo',t).onclick=()=>gotoPage(i);$('.star',t).onclick=()=>toggleFav(i);
    box.append(t);thumbIO.observe(t);any=true;
  });
  if(!any)box.innerHTML=`<p class="panel-empty">${panelMode==='fav'?'Nenhuma página favorita ainda. Toque na estrela de uma miniatura.':'Nenhuma divisória ainda. Crie em ⋯ › Criar divisória nesta página.'}</p>`;
}
async function drawThumb(t){
  const rt=S.pages[t._i];if(!rt)return;const cv=$('canvas',t),c=cv.getContext('2d'),d=rt.d,k=cv.width/d.w;
  let bg=rt.bgImg,own=false;if(d.bg&&!bg){bg=await loadBg(d.bg);own=true}
  c.setTransform(k,0,0,k,0,0);paint(c,d,bg);if(own&&bg&&bg.close)bg.close();
}
function gotoPage(i){const rt=S.pages[i];if(!rt)return;desk.scrollTo({top:rt.el.offsetTop-24});if(innerWidth<900)togglePanel(false)}
function toggleFav(i){const rt=S.pages[i];rt.d.fav=!rt.d.fav;save(rt);decoratePage(rt);renderPanel();updateIndicator();toast(rt.d.fav?'Página favoritada ★':'Página tirada dos favoritos')}

/* ---------- Páginas: criar, trocar modelo, apagar ---------- */
async function addPage(after){
  const ref=S.pages[after]?S.pages[after].d:null;
  const tpl=ref&&ref.tpl!=='pdf'?ref.tpl:(S.nb.tpl||'lined'),paper=ref&&ref.tpl!=='pdf'?ref.paper:(S.nb.paper||'white');
  const d=newPage(S.nb.id,tpl,paper);
  S.nb.order.splice(after+1,0,d.id);S.pages.splice(after+1,0,{d});
  await DB.put('pages',d);touchNb();
  const top=desk.scrollTop;buildPages();desk.scrollTop=top;
  const el=S.pages[after+1].el;desk.scrollTo({top:el.offsetTop-16,behavior:'smooth'});
  updateIndicator();
}
async function deletePage(i){
  const rt=S.pages[i];
  if(!(await confirmDlg('Apagar a página '+(i+1)+'?','O que está escrito nela some. Isso não pode ser desfeito.','Apagar')))return;
  clearSelection();detach(rt);
  S.undo=S.undo.filter(a=>a.rt!==rt);S.redo=S.redo.filter(a=>a.rt!==rt);updateUndo();
  clearTimeout(saveTimers.get(rt));saveTimers.delete(rt);
  S.pages.splice(i,1);S.nb.order.splice(i,1);
  await DB.del('pages',rt.d.id);for(const b of blobIdsOf(rt.d))await DB.del('blobs',b);
  if(!S.pages.length){const d=newPage(S.nb.id,S.nb.tpl||'lined',S.nb.paper||'white');S.nb.order.push(d.id);S.pages.push({d});await DB.put('pages',d)}
  touchNb();const top=desk.scrollTop;buildPages();desk.scrollTop=top;updateIndicator();toast('Página apagada');
}

  else if(a==='pdfIn'){pdfTarget=S.nb;$('#pdfInput').click()}
  else if(a==='pdfOut'){await flushSaves();exportPDF(S.nb.title,S.pages.map(r=>r.d))}
  else if(a==='penOnly'){P.penOnly=!P.penOnly;P.penSeen=true;savePrefs();toast(P.penOnly?'Só a caneta escreve. O dedo rola a página.':'O dedo também escreve. Para rolar, use dois dedos.')}
  else if(a==='rename')renameCurrent();
  else if(a==='del')deletePage(i);
}

/* =====================================================================
   Modo apresentação: uma página por vez, tela cheia, ponteiro laser
   ===================================================================== */
const PV={on:false,i:0,laser:true,trail:[],raf:0,hideT:0,down:null};
const pv=$('#present'),pvPage=$('.pv-page',pv),pvLaser=$('.pv-laser',pv),pvCtrl=$('.pv-ctrl',pv);
async function startPresent(i){
  commitText();clearSelection();await flushSaves();
  PV.on=true;PV.i=i||0;pv.hidden=false;
  try{const r=document.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen||(()=>{})).call(r)}catch(e){}
  await stickersReady;await ensureImgs(S.pages.map(r=>r.d));
  await Promise.all([...new Set(S.pages.flatMap(r=>r.d.strokes.filter(st=>st.t==='text').map(st=>st.f)))].map(loadFont));
  drawPresent();pokeCtrl();
}
function stopPresent(){
  PV.on=false;pv.hidden=true;PV.trail=[];cancelAnimationFrame(PV.raf);PV.raf=0;
  try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}
  const rt=S.pages[PV.i];if(rt)desk.scrollTo({top:rt.el.offsetTop-24});
}
async function drawPresent(){
  const rt=S.pages[PV.i];if(!rt)return;const d=rt.d,dpr=Math.min(devicePixelRatio||1,2.5);
  const W=innerWidth,H=innerHeight,pad=Math.min(28,W*.03),sc=Math.min((W-pad*2)/d.w,(H-pad*2-70)/d.h);
  const cw=Math.round(d.w*sc),ch=Math.round(d.h*sc);
  Object.assign(pvPage.style,{width:cw+'px',height:ch+'px',left:Math.round((W-cw)/2)+'px',top:Math.round((H-70-ch)/2+pad/2)+'px'});
  pvPage.width=Math.min(Math.round(cw*dpr),3000);pvPage.height=Math.round(pvPage.width*d.h/d.w);
  const c=pvPage.getContext('2d'),k=pvPage.width/d.w;let bg=rt.bgImg,own=false;if(d.bg&&!bg){bg=await loadBg(d.bg);own=true}
  if(!PV.on||S.pages[PV.i]!==rt){if(own&&bg&&bg.close)bg.close();return}
  c.setTransform(k,0,0,k,0,0);paint(c,d,bg);if(own&&bg&&bg.close)bg.close();
  pvLaser.width=Math.round(W*dpr);pvLaser.height=Math.round(H*dpr);
  $('.pv-n',pv).textContent=(PV.i+1)+' / '+S.pages.length;
}
function presentGo(n){const j=clamp(PV.i+n,0,S.pages.length-1);if(j===PV.i)return;PV.i=j;PV.trail=[];drawPresent();pokeCtrl()}
function pokeCtrl(){pvCtrl.classList.remove('hide');clearTimeout(PV.hideT);PV.hideT=setTimeout(()=>pvCtrl.classList.add('hide'),2600)}
function presentKey(e){
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();presentGo(1)}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();presentGo(-1)}
  else if(k==='Escape'){e.preventDefault();stopPresent()}
  else if(k.toLowerCase()==='l'){PV.laser=!PV.laser;$('[data-pv=laser]',pv).setAttribute('aria-pressed',PV.laser)}
}
pvCtrl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.pv;
  if(a==='prev')presentGo(-1);else if(a==='next')presentGo(1);else if(a==='exit')stopPresent();
  else if(a==='laser'){PV.laser=!PV.laser;b.setAttribute('aria-pressed',PV.laser)}pokeCtrl()});
function laserFrame(){
  PV.raf=0;const c=pvLaser.getContext('2d'),dpr=pvLaser.width/innerWidth,now=performance.now(),life=750;
  PV.trail=PV.trail.filter(q=>now-q.t<life);
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,pvLaser.width,pvLaser.height);c.setTransform(dpr,0,0,dpr,0,0);
  c.lineCap='round';c.lineJoin='round';
  for(let i=1;i<PV.trail.length;i++){const a=PV.trail[i-1],b=PV.trail[i];if(b.t-a.t>120||b.s!==a.s)continue;const f=1-(now-b.t)/life;
    c.strokeStyle=`rgba(255,79,163,${f})`;c.shadowColor='rgba(255,120,200,.9)';c.shadowBlur=18*f;c.lineWidth=7*f+1.5;
    c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
  const last=PV.trail[PV.trail.length-1];
  if(last&&PV.down){c.shadowBlur=24;c.fillStyle='#FFD0EA';c.beginPath();c.arc(last.x,last.y,6,0,6.2832);c.fill()}
  if(PV.trail.length||PV.down)PV.raf=requestAnimationFrame(laserFrame);
}
pv.addEventListener('pointerdown',e=>{
  if(e.target.closest('.pv-ctrl'))return;e.preventDefault();
  PV.down={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:false,type:e.pointerType,s:Math.random()};
  if(PV.laser&&e.pointerType!=='touch'){PV.trail.push({x:e.clientX,y:e.clientY,t:performance.now(),s:PV.down.s});if(!PV.raf)PV.raf=requestAnimationFrame(laserFrame)}
});
pv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&!PV.down)pokeCtrl();
  const d=PV.down;if(!d||d.id!==e.pointerId)return;
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>10)d.moved=true;
  if(PV.laser&&(e.pointerType!=='touch'||d.moved)){const list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];
    for(const ev of(list.length?list:[e]))PV.trail.push({x:ev.clientX,y:ev.clientY,t:performance.now(),s:d.s});if(!PV.raf)PV.raf=requestAnimationFrame(laserFrame)}
});
pv.addEventListener('pointerup',e=>{
  const d=PV.down;if(!d||d.id!==e.pointerId)return;PV.down=null;
  const dx=e.clientX-d.x,dt=performance.now()-d.t;
  if(d.type==='touch'&&Math.abs(dx)>60&&dt<600&&Math.abs(dx)>Math.abs(e.clientY-d.y)){presentGo(dx<0?1:-1);PV.trail=[];return}
  if(!d.moved&&dt<500){const x=e.clientX/innerWidth;if(x>.72)presentGo(1);else if(x<.28)presentGo(-1);else pokeCtrl()}
});
pv.addEventListener('pointercancel',()=>{PV.down=null});
window.addEventListener('resize',()=>{if(PV.on)drawPresent()});

/* ---------- Teclado ---------- */
document.addEventListener('keydown',e=>{
  if(PV.on){presentKey(e);return}
  if(!S.nb&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'&&!dlg.open){e.preventDefault();$('#libSearch').focus();return}
  if(!S.nb||dlg.open||e.target.closest('input,textarea'))return;
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&k==='f'){e.preventDefault();togglePanel(true);$('#pageSearch').focus();return}
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(mod)return;
  if((k==='delete'||k==='backspace')&&S.sel){e.preventDefault();deleteSelection();return}
  if(k==='escape'){clearSelection();return}
  if(k==='r'){toggleRuler();return}
  const map={p:'pen',h:'hl',e:'eraser',l:'lasso',t:'text',f:'shape'};if(map[k])setTool(map[k]);
});

/* =====================================================================
   PDF: importar para anotar e exportar o caderno
   ===================================================================== */
let pdfTarget=null,pdfjs=null;
async function loadPdfJs(){
  if(pdfjs)return pdfjs;
  pdfjs=await import('../vendor/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc=new URL('../vendor/pdf.worker.min.mjs',location.href).href;
  return pdfjs;
}
const toBlob=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
$('#pdfInput').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const target=pdfTarget;pdfTarget=null;
  try{await importPDF(f,target)}catch(err){console.error(err);hideToast();toast('Não consegui abrir esse PDF. Ele pode estar protegido por senha ou danificado.',5000)}
};
async function importPDF(file,target){
  toast('Abrindo o PDF…',0);
  const lib=await loadPdfJs();
  const task=lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}),doc=await task.promise;
  let nb=target;
  if(!nb){nb={id:uid(),title:file.name.replace(/\.pdf$/i,'')||'PDF',cover:'holo',tpl:'blank',paper:'white',pdf:true,folder:LIB.folder,created:Date.now(),updated:Date.now(),order:[]}}
  const added=[];
  for(let i=1;i<=doc.numPages;i++){
    toast('Preparando a página '+i+' de '+doc.numPages+'…',0);
    const page=await doc.getPage(i),vp1=page.getViewport({scale:1}),scale=1600/vp1.width,vp=page.getViewport({scale});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvas:c,canvasContext:ctx,viewport:vp}).promise;
    const blob=await toBlob(c,'image/jpeg',.9);c.width=c.height=0;page.cleanup();
    const bid=uid();await DB.put('blobs',{id:bid,blob});
    const d={id:uid(),nb:nb.id,tpl:'pdf',paper:'white',w:PAGE_W,h:Math.round(PAGE_W*vp1.height/vp1.width),strokes:[],bg:bid};
    try{const tc=await page.getTextContent(),k=PAGE_W/vp1.width;
      d.pt=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>{const [x,y]=vp1.convertToViewportPoint(it.transform[4],it.transform[5]),fh=Math.hypot(it.transform[2],it.transform[3])||10;
        return {s:it.str,x:r1(x*k),y:r1((y-fh)*k),w:r1((it.width||fh*it.str.length*.5)*k),h:r1(fh*1.2*k)}})}catch(e){}
    await DB.put('pages',d);nb.order.push(d.id);added.push(d);
  }
  try{await task.destroy()}catch(e){}
  if(target&&S.nb===target){
    S.pages.push(...added.map(d=>({d})));touchNb();await flushSaves();
    const top=desk.scrollTop;buildPages();desk.scrollTop=top;updateIndicator();
    toast(added.length+(added.length===1?' página adicionada':' páginas adicionadas')+' no fim do caderno');
  }else{
    nb.updated=Date.now();await DB.put('notebooks',nb);hideToast();openNotebook(nb.id);
  }
}

/* Monta um PDF simples: cada página vira uma imagem JPEG. Não precisa de biblioteca. */
async function exportPDF(title,pages){
  try{
    await stickersReady;await ensureImgs(pages);
    await Promise.all([...new Set(pages.flatMap(d=>d.strokes.filter(st=>st.t==='text').map(st=>st.f)))].map(loadFont));
    const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
    const w=s=>{const b=typeof s==='string'?enc.encode(s):s;chunks.push(b);len+=b.length};
    const n=pages.length,total=2+n*3;
    w('%PDF-1.4\n%âãÏÓ\n');
    offs[1]=len;w('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offs[2]=len;w(`2 0 obj\n<< /Type /Pages /Kids [${pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${n} >>\nendobj\n`);
    for(let i=0;i<n;i++){
      toast('Gerando o PDF: página '+(i+1)+' de '+n+'…',0);
      const d=pages[i],px=1240,c=document.createElement('canvas');c.width=px;c.height=Math.round(px*d.h/d.w);
      const x=c.getContext('2d'),k=px/d.w,bg=d.bg?await loadBg(d.bg):null;
      x.setTransform(k,0,0,k,0,0);paint(x,d,bg);bg&&bg.close&&bg.close();
      const jpg=new Uint8Array(await (await toBlob(c,'image/jpeg',.88)).arrayBuffer());
      const iw=c.width,ih=c.height;c.width=c.height=0;
      const W=595.28,H=+(W*d.h/d.w).toFixed(2),po=3+i*3,co=po+1,im=po+2,cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
      offs[po]=len;w(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
      offs[co]=len;w(`${co} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
      offs[im]=len;w(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);w(jpg);w('\nendstream\nendobj\n');
    }
    const xo=len;let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;
    for(let i=1;i<=total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
    w(x+`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`);
    const name=(title.replace(/[\\/:*?"<>|]+/g,' ').trim()||'Caderno')+'.pdf';
    const file=new File(chunks,name,{type:'application/pdf'});
    hideToast();await offerFile(file,title,'PDF pronto','Enviar, salvar em Arquivos ou imprimir');
  }catch(e){console.error(e);hideToast();toast('Não consegui gerar o PDF.',4000)}
}
async function offerFile(file,title,heading,shareSub){
  const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  const a=await menu(heading,[
    ...(canShare?[{id:'share',label:'Compartilhar',sub:shareSub}]:[]),
    {id:'down',label:'Baixar o arquivo',sub:file.name}
  ]);
  if(a==='share'){try{await navigator.share({files:[file],title});return true}catch(e){if(e.name!=='AbortError'){download(file);return true}return false}}
  if(a==='down'){download(file);return true}
  return false;
}

/* =====================================================================
   Backup: um arquivo com todos os cadernos, páginas e PDFs
   ===================================================================== */
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function makeBackup(){
  try{
    toast('Preparando o backup…',0);
    const notebooks=await DB.all('notebooks'),pages=await DB.all('pages'),folders=await DB.all('folders'),blobs=[];
    for(const b of await DB.all('blobs'))blobs.push({id:b.id,data:await blobToData(b.blob)});
    const date=new Date().toISOString().slice(0,10);
    const file=new File([JSON.stringify({app:'sinapse',versao:2,data:new Date().toISOString(),folders,notebooks,pages,blobs})],`Sinapse backup ${date}.json`,{type:'application/json'});
    hideToast();
    if(await offerFile(file,'Backup do Sinapse','Backup pronto','Guarde no iCloud Drive, Google Drive ou Arquivos')){P.lastBackup=Date.now();savePrefs();backupNote()}
  }catch(e){console.error(e);hideToast();toast('Não consegui criar o backup.',4000)}
}
async function restoreBackup(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){toast('Esse arquivo não é um backup do Sinapse.',4000);return}
  if(!data||data.app!=='sinapse'||!Array.isArray(data.notebooks)){toast('Esse arquivo não é um backup do Sinapse.',4000);return}
  const n=data.notebooks.length;
  if(!(await confirmDlg('Restaurar '+n+(n===1?' caderno?':' cadernos?'),'Os cadernos do backup voltam para este aparelho. Se um deles já existir aqui, a versão do backup substitui a atual. Os outros cadernos não mudam.','Restaurar')))return;
  try{
    toast('Restaurando…',0);
    for(const b of data.blobs||[])await DB.put('blobs',{id:b.id,blob:await (await fetch(b.data)).blob()});
    for(const pg of data.pages||[])await DB.put('pages',pg);
    for(const f of data.folders||[])await DB.put('folders',f);
    for(const nb of data.notebooks)await DB.put('notebooks',nb);
    hideToast();await renderLibrary();toast(n+(n===1?' caderno restaurado ✦':' cadernos restaurados ✦'));
  }catch(e){console.error(e);hideToast();toast('Não consegui restaurar tudo. Tente de novo.',5000)}
}
function backupNote(){
  const t=P.lastBackup,el=$('#libSub');if(!el)return;
  let msg='Seus cadernos ficam salvos neste aparelho. ';
  if(!t)msg+='Faça um backup de vez em quando para não perder nada.';
  else{const d=Math.floor((Date.now()-t)/864e5);msg+='Último backup: '+(d<1?'hoje':d===1?'ontem':'há '+d+' dias')+'.'}
  el.textContent=msg;
}
$('#btnBackup').onclick=async()=>{
  const a=await menu('Backup',[
    {id:'save',label:'Fazer backup agora',sub:'Um arquivo com todos os cadernos, para guardar na nuvem'},
    {id:'load',label:'Restaurar um backup',sub:'Traz de volta os cadernos de um arquivo de backup'}
  ]);
  if(a==='save')makeBackup();else if(a==='load')$('#backupInput').click();
};
$('#backupInput').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restoreBackup(f)};
function download(file){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
