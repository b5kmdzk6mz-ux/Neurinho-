<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Capa do vídeo</title>
<link rel="stylesheet" href="../fontes/fontes.css">
<style>
*{box-sizing:border-box}
body{margin:0}
.c{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Open Sans",Arial,sans-serif;color:#F3F4FA;
 background:linear-gradient(165deg,#1A2458 0%,#2B2F72 40%,#473C8F 78%,#534FA6 100%)}
.halo{position:absolute;left:90px;top:300px;width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(165,197,226,.32),rgba(165,197,226,0))}
.centro{position:absolute;left:0;right:0;text-align:center}
.tag{display:inline-block;font-family:"Montserrat",sans-serif;font-weight:800;font-size:30px;letter-spacing:3px;text-transform:uppercase;background:#A5C5E2;color:#1A2458;border-radius:99px;padding:12px 30px}
.avatar{width:560px;height:560px;border-radius:130px;box-shadow:0 40px 90px rgba(5,8,30,.55)}
h1{margin:0;font-family:"Montserrat",sans-serif;font-weight:800;font-size:104px;line-height:1}
h1 span{font-weight:500}
.hook{font-family:"Montserrat",sans-serif;font-weight:800;font-size:50px;line-height:1.15}
.hook em{font-style:normal;color:#A5C5E2}
.cred{font-size:32px;color:#DDE6F4;font-weight:600}
.cred b{color:#FBFBFD}
</style>
</head>
<body>
<div class="c" id="capa">
<div class="halo"></div>
<div class="centro" style="top:315px"><span class="tag">Tour completo · Novembro Azul</span></div>
<div class="centro" style="top:420px"><img class="avatar" src="../logo.png" alt=""></div>
<div class="centro" style="top:1030px"><h1>Provedor <span>do</span><br>Autocuidado</h1></div>
<div class="centro hook" style="top:1265px">O app que ajuda o homem<br><em>a cuidar da própria saúde</em></div>
<div class="centro cred" style="top:1430px">Criado por <b>Erika Lima</b><br>Enfermagem · Afya Parnaíba</div>
</div>
</body>
</html>
