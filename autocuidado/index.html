<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provedor do Autocuidado</title>
<meta name="description" content="Saúde integral do homem: sinais de alerta, exames, mente, hábitos e onde buscar atendimento. Funciona sem internet.">
<meta name="theme-color" content="#1A2458">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fontes/fontes.css">
<style>
:root{
  --navy:#1A2458; --azul:#473C8F; --azul2:#4F67B5; --azul-claro:#E9ECF8; --ambar:#A5C5E2; --ambar-claro:#E3EDF8;
  --creme:#EEF1FA; --bg:#F3F4FA; --card:#FFFFFF; --txt:#151B3D; --txt2:#4A5070; --linha:#D9DDEE;
  --verde:#1F8A5B; --verde-claro:#DDF3E8; --verm:#C62F2F; --verm-claro:#FBE3E3; --amar:#B7791F; --amar-claro:#FDF1D8;
  --r:18px; --fs:17px;
}
:root[data-tema="contraste"]{--bg:#000;--card:#111;--txt:#fff;--txt2:#e6e6e6;--linha:#666;--azul-claro:#1d1a45;--ambar-claro:#16264a;--verde-claro:#06301d;--verm-claro:#3d0b0b;--amar-claro:#3a2a05;--creme:#111}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
h1,h2,h3,.f-tit,.btn,.tile b,.frase,nav.baixo button,.chip,details summary{font-family:"Montserrat","Open Sans",system-ui,sans-serif}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem;color:var(--navy);font-weight:800}
:root[data-tema="contraste"] h1,:root[data-tema="contraste"] h2,:root[data-tema="contraste"] h3{color:#fff}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:.35rem 0 .7rem}
.topo{background:var(--card);color:var(--navy);border-bottom:1px solid var(--linha);padding:10px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
.topo img{width:44px;height:44px;border-radius:12px}
.topo .nome{font-family:"Montserrat",sans-serif;font-weight:800;font-size:1.02rem;line-height:1.1;color:var(--navy)}
.topo .nome i{font-style:normal;font-weight:500}
:root[data-tema="contraste"] .topo .nome{color:#fff}
.topo .sub{font-size:.76rem;color:var(--txt2)}
.topo .acoes{margin-left:auto;display:flex;gap:6px}
.topo button{background:var(--azul-claro);border:0;color:var(--navy);border-radius:12px;min-width:44px;height:44px;font-weight:700;cursor:pointer}
.voltar{display:none}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:16px;margin:0 0 14px}
.hero{background:linear-gradient(165deg,#E9ECF8 0%,#C9D6F0 55%,#8E97D6 100%);color:var(--navy);border:0;position:relative;overflow:hidden;padding:20px 18px 18px}
.hero h1{font-size:2rem;margin:0}
.hero .frase{font-size:1.15rem;font-weight:700;color:var(--navy);max-width:62%}
.hero .avatar{display:block;width:62%;max-width:260px;margin:-6px 0 -60px auto;border-radius:28px;box-shadow:0 10px 30px rgba(26,36,88,.25)}
.cta{position:relative;z-index:1;display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px 14px 14px 18px;margin-top:0;box-shadow:0 6px 18px rgba(26,36,88,.15);cursor:pointer;border:0;width:100%;text-align:left;color:var(--navy);font-weight:700}
.cta .seta{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center}
:root[data-tema="contraste"] .hero{background:#111;color:#fff}:root[data-tema="contraste"] .hero .frase,:root[data-tema="contraste"] .hero h1{color:#fff}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.ico{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
.icbox{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--linha);background:var(--card);display:grid;place-items:center;color:var(--azul);flex:none}
.icbox .ico{width:24px;height:24px}
.tile{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:112px}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--azul)}
.tile .ic .ico{width:24px;height:24px}
.tile b{font-size:1rem}
.tile span{font-size:.82rem;color:var(--txt2)}
.ic.a,.ic.b,.ic.c{background:var(--azul-claro)} .ic.d{background:var(--verm-claro);color:var(--verm)}
.sos{display:flex;gap:10px;flex-wrap:wrap}
.sos a{flex:1 1 140px;font-family:"Montserrat",sans-serif;text-decoration:none;background:var(--verm);color:#fff;border-radius:14px;padding:12px 14px;font-weight:800;display:flex;flex-direction:column}
.sos a small{font-weight:500;opacity:.9}
.sos a.cvv{background:var(--azul)}
.topo-pag{display:flex;align-items:center;gap:14px;background:var(--azul-claro);border-radius:var(--r);padding:16px;margin-bottom:16px;color:var(--navy);font-weight:600}
.topo-pag .icbox{width:56px;height:56px;border:0;background:transparent}.topo-pag .icbox .ico{width:40px;height:40px}
.ilus{text-align:center;padding:8px 0 4px}
.ilus .blob{width:170px;height:150px;margin:0 auto 10px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;background:var(--azul-claro);display:grid;place-items:center;color:var(--azul)}
.ilus .blob .ico{width:96px;height:96px;stroke-width:1.6}
.ilus h2{font-size:1.6rem}
.sec-tit{font-family:"Montserrat",sans-serif;font-weight:800;color:var(--navy);margin:6px 0 10px;font-size:1.05rem}
.sos a.ds{background:var(--navy)}
nav.baixo{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.baixo button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--txt2);padding:4px 6px;min-width:58px;cursor:pointer}
nav.baixo button .ico{width:24px;height:24px}
nav.baixo button[aria-current="page"]{color:var(--azul);font-weight:800}
nav.baixo button[aria-current="page"] .ico{stroke-width:2.4}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.chip.verm{background:var(--verm-claro);color:var(--verm)} .chip.amar{background:var(--amar-claro);color:var(--amar)} .chip.verde{background:var(--verde-claro);color:var(--verde)} .chip.azul{background:var(--azul-claro);color:var(--azul)}
:root[data-tema="contraste"] .chip{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;min-height:48px;font-weight:700;cursor:pointer;background:var(--azul);color:#fff;text-decoration:none}
.btn.sec{background:var(--azul-claro);color:var(--navy)}
.btn.amb{background:var(--ambar);color:#1A2458}
.btn.peq{min-height:38px;padding:6px 12px;font-size:.88rem}
:root[data-tema="contraste"] .btn.sec{color:#fff}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);margin:0 0 10px;overflow:hidden}
details summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:700;color:var(--navy)}
:root[data-tema="contraste"] details summary{color:#fff}
details summary .icbox{width:40px;height:40px;border-radius:12px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;font-size:1.3rem;color:var(--txt2)}
details[open] summary::after{content:"–"}
details .corpo{padding:0 16px 14px}
.nivel{border-left:6px solid var(--linha);padding:10px 12px;border-radius:10px;margin:8px 0;background:var(--bg)}
.nivel.verm{border-color:var(--verm);background:var(--verm-claro)}
.nivel.amar{border-color:var(--amar);background:var(--amar-claro)}
.nivel.verde{border-color:var(--verde);background:var(--verde-claro)}
ul{padding-left:1.2rem;margin:.3rem 0 .7rem} li{margin:.2rem 0}
.passos{counter-reset:p;list-style:none;padding:0}
.passos li{counter-increment:p;position:relative;padding:8px 0 8px 44px;border-bottom:1px dashed var(--linha)}
.passos li::before{content:counter(p);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:800}
.ouvir{background:none;border:1px solid var(--linha);border-radius:99px;padding:4px 10px;font-size:.8rem;cursor:pointer;color:var(--txt2)}
.aviso{font-size:.85rem;color:var(--txt2);background:var(--creme);border-radius:12px;padding:10px 12px}
.campo{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;flex:1 1 140px}
.campo label{font-size:.85rem;font-weight:700;color:var(--txt2)}
.campo input,.campo select,.campo textarea{border:1px solid var(--linha);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.barra{height:14px;background:var(--azul-claro);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--azul2),var(--azul));border-radius:99px;transition:width .4s}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.75rem;color:var(--txt2)}
.dias div b{display:block;height:64px;background:var(--azul-claro);border-radius:8px;position:relative;overflow:hidden;margin-bottom:3px}
.dias div b i{position:absolute;bottom:0;left:0;right:0;background:var(--azul)}
.humor{display:flex;justify-content:space-between;gap:6px}
.humor button{flex:1;border:2px solid var(--linha);background:var(--card);border-radius:14px;padding:8px 2px;font-size:1.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.humor button small{font-size:.68rem;color:var(--txt2)}
.humor button[aria-pressed="true"]{border-color:var(--azul);background:var(--azul-claro)}
.resp{display:grid;place-items:center;padding:12px 0 4px}
.bola{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#A5C5E2,var(--azul2) 60%,var(--azul));transform:scale(.6);transition:transform 4s ease-in-out;display:grid;place-items:center;color:#fff;font-weight:800}
.quiz-op{display:flex;gap:10px}
.quiz-op button{flex:1}
.res{margin-top:10px;padding:12px;border-radius:12px}
.res.ok{background:var(--verde-claro)} .res.nao{background:var(--verm-claro)}
.local{border-bottom:1px solid var(--linha);padding:12px 0}
.local:last-child{border-bottom:0}
.local .tipo{font-size:.78rem;color:var(--txt2);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linha)}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.hbar{height:10px;background:var(--azul);border-radius:99px;margin-top:4px}
.mapa{position:relative;border-radius:14px;overflow:hidden;background:#fff;margin:6px 0 8px}
.mapa img{display:block;width:100%;height:auto}
.mapa button{position:absolute;transform:translate(-50%,-50%);border:0;cursor:pointer;padding:0;background:none}
.mapa .pt{width:21px;height:21px;border-radius:50%;background:var(--azul);color:#fff;font:800 11px/21px "Montserrat",sans-serif;box-shadow:0 0 0 3px #fff,0 2px 8px rgba(26,36,88,.4);animation:pulsa 2.2s infinite}
.mapa .rot{transform:none;border-radius:6px;background:rgba(71,60,143,.0);outline:2px solid transparent}
.mapa .rot:hover,.mapa .rot:focus-visible{background:rgba(71,60,143,.12);outline-color:rgba(71,60,143,.45)}
@keyframes pulsa{0%{box-shadow:0 0 0 3px #fff,0 0 0 3px rgba(71,60,143,.55)}70%{box-shadow:0 0 0 3px #fff,0 0 0 13px rgba(71,60,143,0)}100%{box-shadow:0 0 0 3px #fff,0 0 0 3px rgba(71,60,143,0)}}
.chips-org{display:flex;flex-wrap:wrap;gap:8px}
.chips-org button{border:1.5px solid var(--linha);background:var(--card);color:var(--navy);border-radius:99px;padding:7px 12px;font:700 .85rem "Montserrat",sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
.chips-org button b{width:20px;height:20px;border-radius:50%;background:var(--azul);color:#fff;font-size:.7rem;display:grid;place-items:center}
.pop{position:fixed;inset:0;background:rgba(15,20,50,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.pop .cx{background:var(--card);color:var(--txt);border-radius:22px;padding:20px;max-width:520px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:sobe .25s ease-out}
.pop .cx h3{display:flex;align-items:center;gap:10px;font-size:1.25rem}
.pop .cx h3 b{width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:.85rem;flex:none}
@keyframes sobe{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){.pop{align-items:center}.mapa .pt{width:28px;height:28px;font-size:13px;line-height:28px}}
.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha)}
.ck:last-child{border-bottom:0}
.ck .t{flex:1}
.ck .t small{display:block;color:var(--txt2)}
.qr{background:#fff;border-radius:16px;padding:14px;display:inline-block}
.qr img{width:240px;height:240px;display:block}
.centro{text-align:center}
.oculto{display:none!important}
.mini{font-size:.85rem;color:var(--txt2)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (min-width:640px){.grade{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topo">
  <button class="voltar" id="voltar" aria-label="Voltar">←</button>
  <img src="logo.png" alt="">
  <div><div class="nome">Provedor <i>do</i><br>Autocuidado</div></div>
  <div class="acoes">
    <button id="fonte" aria-label="Aumentar letra" title="Tamanho da letra">A+</button>
    <button id="tema" aria-label="Alto contraste" title="Alto contraste"><svg class="ico" aria-hidden="true"><use href="#i-contrast"/></svg></button>
  </div>
</header>

<main id="app"></main>

<nav class="baixo" aria-label="Menu principal">
  <button data-ir="inicio"><svg class="ico"><use href="#i-home"/></svg>Início</button>
  <button data-ir="sinais"><svg class="ico"><use href="#i-search"/></svg>Cuidados</button>
  <button data-ir="cuidar"><svg class="ico"><use href="#i-clip"/></svg>Exames</button>
  <button data-ir="mente"><svg class="ico"><use href="#i-brain"/></svg>Mental</button>
  <button data-ir="onde"><svg class="ico"><use href="#i-pin"/></svg>Rede</button>

<script>
/* ============================================================

/* ---------- Locais de atendimento: EDITE AQUI ----------
   Confirme endereço e telefone antes de divulgar.
   Campo "conf": false mostra o aviso "confirmar antes de ir". */
const LOCAIS = [

  {tipo:"Informação", nome:"Disque Saúde (Ministério da Saúde)", fone:"136", desc:"Tira dúvidas sobre saúde, vacinas e serviços do SUS. Também orienta quem quer parar de fumar.", conf:true},
  {tipo:"Atenção Básica", nome:"Unidade Básica de Saúde (UBS) do seu bairro", desc:"Porta de entrada do SUS: consulta, pressão, glicemia, vacinas, testes rápidos de HIV, sífilis e hepatites, tratamento para parar de fumar, encaminhamentos. Leve RG, Cartão do SUS e comprovante de endereço.", conf:true},
  {tipo:"Clínica-escola", nome:"Afya Clínica Acadêmica, Parnaíba", desc:"Atendimento pelos cursos da saúde da Afya. Pergunte na recepção quais serviços e horários estão disponíveis.", conf:false},
  {tipo:"Hospital", nome:"Hospital Estadual Dirceu Arcoverde (HEDA)", end:"Rua Rodrigo Coimbra, 1650, Rodoviária, Parnaíba", fone:"8633231711", foneTxt:"(86) 3323-1711", desc:"Hospital de referência da região.", conf:false},
  {tipo:"Pronto-socorro", nome:"Pronto Socorro Municipal de Parnaíba", end:"Rua Teresina, 996, Nova Parnaíba", desc:"Urgência e emergência.", conf:false},
  {tipo:"Saúde mental", nome:"CAPS: Centro de Atenção Psicossocial", desc:"Atendimento gratuito para sofrimento mental, depressão, ansiedade e uso de álcool e outras drogas (CAPS AD). Pode procurar direto, sem encaminhamento. Pergunte na UBS o endereço do CAPS mais perto.", conf:true},
  {tipo:"ISTs", nome:"CTA: Centro de Testagem e Aconselhamento", desc:"Testes de HIV, sífilis e hepatites, PEP (até 72 h depois de uma exposição de risco) e PrEP. Sigilo garantido. A UBS também faz os testes rápidos.", conf:true},

/* ---------- utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const app = $("#app");
const LS = {
  get(k,d){try{const v=localStorage.getItem("pa_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("pa_"+k,JSON.stringify(v))}catch(e){}}
};
const hoje = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtData = s=>{if(!s)return"";const [a,m,d]=s.split("-");return d+"/"+m+"/"+a};
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2600)}
function ouvirBtn(){return '<button class="ouvir" data-ouvir><svg class="ico" aria-hidden="true"><use href="#i-sound"/></svg> Ouvir</button>'}
function falar(txt){
  if(!("speechSynthesis" in window)){toast("Seu celular não tem leitura em voz alta.");return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang="pt-BR";u.rate=.95;speechSynthesis.speak(u);
}
const ic = n=>'<svg class="ico" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const EMO = {"❤️":"heart","🧠":"brain","🫂":"chat","🩸":"pulse","🍬":"flask","🚽":"drop","🥚":"dot","🛡️":"shield","🩻":"body","🫁":"lungs","👄":"smile","⚡":"bolt","🌧️":"cloud","🧼":"spark","💪":"user","🔬":"search","💉":"syringe","👶":"baby","🗣️":"chat","🍽️":"food","🍺":"glass","🚬":"nosmoke","😴":"moon","🧔":"user","🧰":"tool","🧾":"doc"};
const icoSum = html=>html.replace(/<summary([^>]*)>(\S+) /g,(m,at,e)=>EMO[e]?'<summary'+at+'><span class="icbox">'+ic(EMO[e])+'</span>':m);
const tel = (n,txt)=>'<a href="tel:'+n+'">'+(txt||n)+'</a>';

/* ---------- conteúdo: sinais de alerta ---------- */
const SINAIS = [
 {id:"peito",ic:"❤️",t:"Dor ou aperto no peito",lvl:"verm",
  o:"Pode ser <b>infarto</b>. O coração está recebendo pouco sangue.",
  s:["Dor, aperto ou queimação no peito por mais de 20 minutos","A dor vai para o braço esquerdo, pescoço, mandíbula ou costas","Suor frio, falta de ar, enjoo ou tontura"],
  f:"<b>Ligue 192 (SAMU) agora.</b> Não dirija. Pare o que está fazendo e fique sentado. Cada minuto conta."},
 {id:"avc",ic:"🧠",t:"Boca torta, braço fraco, fala enrolada",lvl:"verm",
  o:"Pode ser <b>AVC (derrame)</b>. Lembre da palavra <b>SAMU</b>:",
  s:["<b>S</b>orriso: um lado do rosto fica caído","<b>A</b>braço: um braço fica fraco ou dormente","<b>M</b>úsica: a fala fica enrolada ou estranha","<b>U</b>rgente: ligue 192 na hora"],
  f:"<b>Ligue 192.</b> Anote o horário em que começou. O tratamento funciona melhor nas primeiras horas."},
 {id:"suic",ic:"🫂",t:"Pensamentos de se machucar ou de sumir",lvl:"verm",

  f:"<b>Ligue 188 (CVV)</b>, de graça, 24 h. Em risco imediato, <b>ligue 192</b>. Procure o CAPS ou a UBS. Conte para alguém de confiança hoje."},
 {id:"pressao",ic:"🩸",t:"Dor de cabeça forte, nuca pesada, visão embaçada",lvl:"amar",

  s:["Dor de cabeça na nuca","Tontura, zumbido no ouvido","Visão embaçada","Sangramento no nariz"],
  f:"Meça a pressão na UBS ou na farmácia. Se der <b>14 por 9 (140/90) ou mais</b>, marque consulta. Se vier com dor no peito, fala enrolada ou fraqueza, <b>ligue 192</b>."},

  s:["Muita sede e boca seca","Urinar muitas vezes, até de madrugada","Fome demais e perda de peso sem motivo","Visão embaçada, formigamento nos pés","Ferida que demora a cicatrizar"],

 {id:"urina",ic:"🚽",t:"Dificuldade para urinar, jato fraco",lvl:"amar",
  o:"Pode ser <b>aumento benigno da próstata</b> (muito comum depois dos 50), infecção ou, menos vezes, <b>câncer de próstata</b>.",
  s:["Jato de urina fraco ou que para e volta","Levantar várias vezes à noite para urinar","Sensação de que a bexiga não esvaziou","Sangue na urina ou no sêmen","Dor ou ardência ao urinar"],
  f:"Marque consulta na UBS. Esses sinais precisam de avaliação, mas <b>não significam câncer</b> automaticamente. Se não conseguir urinar nada e a barriga doer, vá ao pronto-socorro."},

  o:"Pode ser <b>câncer de testículo</b>, mais comum entre <b>15 e 35 anos</b>, ou outras alterações benignas.",
  s:["Caroço duro, geralmente sem dor","Um testículo aumentou ou ficou mais duro","Sensação de peso no saco escrotal"],

 {id:"intest",ic:"🩻",t:"Sangue nas fezes, intestino mudou",lvl:"amar",

 {id:"tosse",ic:"🫁",t:"Tosse há mais de 3 semanas",lvl:"amar",

/* ---------- conteúdo: corpo / anatomia ---------- */

const ORGAOS = [
 {id:"bexiga",t:"Bexiga",r:[40,76,92,96],p:[244,90],x:"É a bolsa que guarda a urina que vem dos rins. Quando enche, dá vontade de urinar. Segurar a urina por muito tempo e beber pouca água favorecem infecção urinária e pedra."},

 {id:"prostata",t:"Próstata",r:[524,150,586,170],p:[300,158],x:"Glândula do tamanho de uma noz, logo abaixo da bexiga, abraçando a uretra. Produz parte do líquido do sêmen. Com a idade costuma crescer e apertar a uretra, deixando o jato de urina fraco (aumento benigno). Também é onde surge o câncer mais comum no homem. Fica bem na frente do reto: por isso o profissional consegue senti-la no toque retal, um exame que dura segundos."},

function abrirOrgao(i){
  const o=ORGAOS[i];fecharPop();
  const d=document.createElement("div");d.className="pop";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");d.setAttribute("aria-label",o.t);
  d.innerHTML=`<div class="cx"><h3><b>${i+1}</b>${o.t}</h3><p>${o.x}</p>
    <div class="linha" style="margin-top:12px"><button class="btn" data-fechar>Entendi</button><button class="btn sec" data-ant>${ic("arrow").replace('class="ico"','class="ico" style="transform:rotate(180deg)"')}</button><button class="btn sec" data-prox>${ic("arrow")}</button><button class="ouvir" data-falar>${ic("sound")} Ouvir</button></div></div>`;
  d.addEventListener("click",e=>{
    if(e.target===d||e.target.closest("[data-fechar]"))fecharPop();
    else if(e.target.closest("[data-prox]"))abrirOrgao((i+1)%ORGAOS.length);
    else if(e.target.closest("[data-ant]"))abrirOrgao((i+ORGAOS.length-1)%ORGAOS.length);
    else if(e.target.closest("[data-falar]"))falar(o.t+". "+o.x);
  });
  document.body.appendChild(d);d.querySelector("[data-fechar]").focus();
}
function fecharPop(){document.querySelectorAll(".pop").forEach(x=>x.remove());if("speechSynthesis" in window)speechSynthesis.cancel()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharPop()});
window.addEventListener("hashchange",fecharPop);

function baixarIcs(a){

  const url=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  const l=document.createElement("a");l.href=url;l.download="compromisso-saude.ics";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);

    <div class="linha" style="justify-content:center"><button class="btn" id="shBtn">Enviar link</button><a class="btn sec" href="https://wa.me/?text=${encodeURIComponent("Provedor do Autocuidado: app de saúde do homem. Funciona sem internet. "+location.href.split("#")[0])}" target="_blank" rel="noopener">WhatsApp</a></div>
  </section>
  <section class="card" id="instalar">
    <h3>${ic("down")} Instale no celular (funciona sem internet)</h3>

  </section>`;
DEPOIS.compartilhar=()=>{
  $("#shBtn").onclick=async()=>{const u=location.href.split("#")[0];
    if(navigator.share){try{await navigator.share({title:"Provedor do Autocuidado",text:"App de saúde do homem",url:u})}catch(e){}}
    else{try{await navigator.clipboard.writeText(u);toast("Link copiado")}catch(e){toast(u)}}};
  if(window._instalar){const b=$("#instBtn");b.classList.remove("oculto");b.onclick=()=>{window._instalar.prompt();window._instalar=null;b.classList.add("oculto")}}
};

PAGINAS.sobre = ()=>`
  <h2>Sobre o app</h2>
  <section class="card">
    <p><b>Provedor do Autocuidado</b> nasceu de uma ação de educação em saúde do Novembro Azul, feita por estudantes de Enfermagem da Afya Faculdade de Parnaíba na Afya Clínica Acadêmica.</p>
    <p>O nome inverte uma ideia que muitos homens carregam: o homem que "provê" para a família também precisa prover cuidado para si mesmo.</p>
    <p><b>Princípios:</b> linguagem simples, sem julgamento, respeito à privacidade e incentivo à procura da Atenção Básica.</p>
  </section>
  <section class="card">
    <h3>Privacidade</h3>
    <p>Tudo o que você anota (nome, humor, caminhadas, consultas) fica <b>somente neste celular</b>. Nada é enviado para a internet.</p>
    <button class="btn sec" id="apagar">Apagar todos os meus dados</button>
  </section>
  <section class="card">
    <h3>Fontes</h3>
    <ul class="mini">
      <li>Ministério da Saúde. Política Nacional de Atenção Integral à Saúde do Homem (PNAISH).</li>
      <li>INCA. Estimativa 2026–2028: incidência de câncer no Brasil.</li>
      <li>INCA / Ministério da Saúde. Detecção precoce do câncer de próstata (decisão compartilhada).</li>
      <li>Ministério da Saúde. Guia Alimentar para a População Brasileira.</li>
      <li>Ministério da Saúde. Guia de Atividade Física para a População Brasileira.</li>
      <li>Ministério da Saúde. Calendário Nacional de Vacinação; Guia do Pré-Natal do Parceiro.</li>
      <li>Secretaria de Estado da Saúde do Piauí. Campanha de prevenção à saúde do homem, nov. 2026.</li>
    </ul>
    <p class="aviso">Conteúdo educativo. Não substitui avaliação de profissional de saúde.</p>
  </section>`;
DEPOIS.sobre=()=>{$("#apagar").onclick=()=>{if(confirm("Apagar tudo o que você salvou neste app?")){Object.keys(localStorage).filter(k=>k.indexOf("pa_")===0).forEach(k=>localStorage.removeItem(k));toast("Dados apagados");ir("inicio")}}};

const FS=[17,19,21,15];
function aplicaPref(){document.documentElement.style.setProperty("--fs",FS[LS.get("fs",0)]+"px");document.documentElement.dataset.tema=LS.get("tema","")}
$("#fonte").onclick=()=>{LS.set("fs",(LS.get("fs",0)+1)%FS.length);aplicaPref()};
$("#tema").onclick=()=>{LS.set("tema",LS.get("tema","")?"":"contraste");aplicaPref()};
aplicaPref();

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window._instalar=e});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

rota();
