<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sinapse</title>
<meta name="description" content="Sinapse: cadernos para escrever à mão, com caneta, marca-texto e PDFs.">
<meta name="theme-color" content="#F3E7FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120B22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sinapse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Shrikhand&family=Quicksand:wght@400..700&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Bebas+Neue&family=Caveat:wght@400..700&family=Patrick+Hand&family=Dancing+Script:wght@400..700&family=Pacifico&family=Courier+Prime&display=swap">
<style>
@font-face{font-family:"OpenDyslexic";src:url(../OpenDyslexic-Regular.otf) format("opentype");font-display:swap}
/* =====================================================================
   Estética "Aura": manchas de luz lilás, rosa e pêssego, grão de papel,
   brilhos holográficos e vidro fosco.
   ===================================================================== */
:root{
  --bg:#F6EEFF; --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.84); --surface-2:rgba(124,77,255,.08);
  --ink:#2A1B3D; --muted:#74658A; --line:rgba(120,90,180,.20);
  --accent:#7A4FE0; --accent-2:#E2549C; --accent-ink:#FFFFFF; --accent-soft:rgba(139,92,246,.14);
  --danger:#C9365A; --ring:#2A1B3D;
  --a1:#E3C2FF; --a2:#FFC2DD; --a3:#FFD9BD; --a4:#C7D6FF;
  --shadow:0 2px 6px rgba(80,40,140,.08),0 14px 40px rgba(110,60,180,.16);
  --page-shadow:0 2px 6px rgba(70,30,120,.10),0 18px 44px rgba(90,50,160,.16);
  --glow:0 6px 22px rgba(196,88,196,.38);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120B22; --glass:rgba(34,22,60,.60); --glass-strong:rgba(36,24,64,.90); --surface-2:rgba(200,170,255,.10);
    --ink:#F7EFFF; --muted:#B8A8D6; --line:rgba(200,170,255,.18);
    --accent:#BBA0FF; --accent-2:#FF8CC6; --accent-ink:#1A0F30; --accent-soft:rgba(184,156,255,.18);
    --danger:#FF8FAB; --ring:#F7EFFF;
    --a1:#4E2496; --a2:#8E2A6E; --a3:#27378F; --a4:#6A35B0;
    --shadow:0 2px 6px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.45);
    --page-shadow:0 2px 6px rgba(0,0,0,.45),0 18px 44px rgba(0,0,0,.5);
    --glow:0 6px 24px rgba(220,110,220,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120B22; --glass:rgba(34,22,60,.60); --glass-strong:rgba(36,24,64,.90); --surface-2:rgba(200,170,255,.10);
  --ink:#F7EFFF; --muted:#B8A8D6; --line:rgba(200,170,255,.18);
  --accent:#BBA0FF; --accent-2:#FF8CC6; --accent-ink:#1A0F30; --accent-soft:rgba(184,156,255,.18);
  --danger:#FF8FAB; --ring:#F7EFFF;
  --a1:#4E2496; --a2:#8E2A6E; --a3:#27378F; --a4:#6A35B0;
  --shadow:0 2px 6px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.45);
  --page-shadow:0 2px 6px rgba(0,0,0,.45),0 18px 44px rgba(0,0,0,.5);
  --glow:0 6px 24px rgba(220,110,220,.35);
  color-scheme:dark;
}
:root{
  --holo:linear-gradient(115deg,#FFC2E2 0%,#D9C6FF 22%,#BDE6FF 42%,#FFF1C2 62%,#FFC2DD 80%,#CDBBFF 100%);
  --cta:linear-gradient(120deg,#8B5CF6 0%,#C35FD8 50%,#F2709F 100%);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --f-display:"Shrikhand",Georgia,serif;
  --f-serif:"Fraunces",Georgia,"Times New Roman",serif;
  --f-sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-sans);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Fundo de aura ---------- */
.aura{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.aura i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.9;animation:drift 28s ease-in-out infinite alternate;will-change:transform}
.aura i:nth-child(1){width:62vmax;height:62vmax;left:-18vmax;top:-22vmax;background:var(--a1)}
.aura i:nth-child(2){width:50vmax;height:50vmax;right:-20vmax;top:8vh;background:var(--a2);animation-duration:34s;animation-delay:-8s}
.aura i:nth-child(3){width:56vmax;height:56vmax;left:4vw;bottom:-30vmax;background:var(--a3);animation-duration:31s;animation-delay:-15s}
.aura i:nth-child(4){width:38vmax;height:38vmax;right:2vw;bottom:-12vmax;background:var(--a4);animation-duration:26s;animation-delay:-4s}
.aura::after{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.22;mix-blend-mode:soft-light}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.14)}}
body.editing .aura i{animation-play-state:paused}

/* ---------- Brilhos holográficos ---------- */
.spark{position:absolute;width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 12px rgba(214,170,255,.7));animation:twinkle 3.6s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(20deg);opacity:.55}}
@keyframes shimmer{to{background-position:200% 50%}}
@media (prefers-reduced-motion:reduce){.aura i,.spark,.brand h1{animation:none!important}}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:15px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn.primary{background:var(--cta);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.icon{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;flex:none}
.icon:hover{background:var(--surface-2)}
.icon:disabled{opacity:.32;cursor:default}
.icon:disabled:hover{background:none}

/* ---------- Biblioteca ---------- */
#library{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 16px 56px}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;position:relative}
.brand img{width:52px;height:52px;border-radius:15px;box-shadow:var(--glow)}
.brand h1{margin:0;font:400 46px/1 var(--f-display);letter-spacing:.01em;padding:4px 6px 8px 0;
  background:linear-gradient(100deg,#8B5CF6 0%,#E2549C 30%,#F59A6B 50%,#B07CF2 70%,#8B5CF6 100%) 0 50%/200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 9s linear infinite}
.brand .spark{right:-20px;top:-6px}
.lib-actions{display:flex;gap:10px;flex-wrap:wrap}
.hello{font:italic 600 24px/1.2 var(--f-serif);margin:26px 0 4px;letter-spacing:-.01em}
.lib-sub{color:var(--muted);margin:0 0 28px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:30px 22px}
.card{min-width:0}

/* Capas */
.cover{display:block;width:100%;aspect-ratio:3/4;container-type:inline-size;border-radius:8px 18px 18px 8px;position:relative;overflow:hidden;isolation:isolate;
  --ct:#2A1B3D;--cf:var(--f-serif);
  box-shadow:inset 12px 0 0 rgba(40,10,60,.10),inset 13px 0 0 rgba(255,255,255,.35),var(--shadow);transition:transform .2s}
.cover:active{transform:scale(.97)}
.cover::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--noise),linear-gradient(140deg,rgba(255,255,255,.45),transparent 45%);opacity:.55;mix-blend-mode:soft-light}
.cover .spark{width:18px;height:18px}
.cover .s1{right:16%;top:12%}
.cover .s2{right:30%;top:24%;width:11px;height:11px;animation-delay:-1.4s}
.cover-title{position:absolute;left:24px;right:12px;bottom:18px;color:var(--ct);font:800 19px/1.06 var(--cf);font-size:clamp(14px,11.5cqi,24px);letter-spacing:-.015em;text-align:left;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto;text-wrap:balance}
.cover-pdf{position:absolute;right:10px;top:10px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--ct);
  background:rgba(255,255,255,.4);padding:3px 8px;border-radius:999px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cover[data-cover=aura]{background:radial-gradient(circle at 18% 22%,#F4C4FF 0,transparent 55%),radial-gradient(circle at 88% 32%,#FFC3DE 0,transparent 52%),radial-gradient(circle at 50% 100%,#FFDCC0 0,transparent 62%),#E2D2FF}
.cover[data-cover=holo]{background:linear-gradient(125deg,#FFC9E6,#D7C4FF 25%,#BFE9FF 45%,#FFF3C4 62%,#FFC4E0 80%,#CDB9FF)}
.cover[data-cover=peach]{background:radial-gradient(circle at 28% 72%,#FFB08A 0,transparent 55%),radial-gradient(circle at 78% 22%,#FF9EC8 0,transparent 55%),#FFE4CC}
.cover[data-cover=waves]{background:repeating-radial-gradient(circle at 50% 58%,#F9B8E3 0 9px,#D9C3FF 9px 18px,#FFD7C4 18px 27px,#C8DEFF 27px 36px)}
.cover[data-cover=strawberry]{--ct:#C8102E;--cf:var(--f-display);background:conic-gradient(#E2263F 25%,#FFD5DB 0 50%,#E2263F 0 75%,#FFD5DB 0) 0 0/16px 16px}
.cover[data-cover=strawberry]::before{content:"";position:absolute;inset:14px 12px 14px 22px;background:#FFD5DB;border-radius:4px;z-index:-1}
.cover[data-cover=strawberry] .cover-title{left:32px;right:22px;bottom:28px;font-weight:400}
.cover[data-cover=mystic]{background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.55) 0,transparent 32%),#CDAEF0}
.cover[data-cover=swirl]{--ct:#FFF6FF;background:radial-gradient(circle at 70% 75%,rgba(20,10,40,.55),transparent 55%),conic-gradient(from 210deg at 55% 48%,#2B1B4A,#E2589B,#F6A25B,#F7E3C7,#9A6BDA,#2B6E8A,#2B1B4A)}
.cover[data-cover=aura]{background-image:url(arte/capa-aura.jpg)}
.cover[data-cover=holo]{background-image:url(arte/capa-holo.jpg)}
.cover[data-cover=peach]{background-image:url(arte/capa-peach.jpg)}
.cover[data-cover=waves]{background-image:url(arte/capa-waves.jpg)}
.cover[data-cover=mystic]{background-image:url(arte/capa-mystic.jpg)}
.cover[data-cover=aura],.cover[data-cover=holo],.cover[data-cover=peach],.cover[data-cover=waves],.cover[data-cover=mystic]{background-size:cover;background-position:center}
.cover[data-cover=aura] .spark,.cover[data-cover=holo] .spark,.cover[data-cover=peach] .spark,.cover[data-cover=waves] .spark,.cover[data-cover=mystic] .spark{display:none}
.cover .cover-title{text-shadow:0 0 14px rgba(255,255,255,.75),0 0 3px rgba(255,255,255,.6)}
.cover[data-cover=swirl] .cover-title,.cover[data-cover=cosmos] .cover-title{text-shadow:0 1px 12px rgba(20,8,40,.6)}
.cover[data-cover=waves] .cover-title{background:rgba(255,255,255,.55);border-radius:10px;padding:6px 8px;left:18px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tbox{position:absolute;z-index:3;margin:0;padding:0;border:0;resize:none;overflow:hidden;background:rgba(139,92,246,.06);
  outline:2px dashed rgba(139,92,246,.65);outline-offset:6px;border-radius:2px;line-height:1.3;white-space:pre-wrap;
  -webkit-user-select:text;user-select:text;touch-action:auto;caret-color:#8B5CF6}
.tbox::placeholder{color:rgba(139,92,246,.55)}
.font-btn{height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:17px;white-space:nowrap;flex:none;margin-left:4px}
.fonts{display:flex;flex-direction:column;gap:6px;margin:0 -6px}
.fonts button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 14px;border-radius:16px}
.fonts button:hover{background:var(--surface-2)}
.fonts button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.fonts small{font:600 11px/1 var(--f-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fonts span{font-size:24px;line-height:1.2}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.crumbs button{min-height:38px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:14px}
.crumbs .here{font:italic 700 24px/1.1 var(--f-serif)}
.crumbs .sepc{color:var(--muted)}
.folder{display:block;width:100%;aspect-ratio:3/4;position:relative;transition:transform .2s}
.folder:active{transform:scale(.97)}
.f-back{position:absolute;left:0;right:0;top:16%;bottom:4%;border-radius:16px;background:#CDB4F4;box-shadow:var(--shadow)}
.f-back::before{content:"";position:absolute;left:0;top:-9%;width:46%;height:14%;border-radius:12px 12px 0 0;background:#CDB4F4}
.f-front{position:absolute;left:0;right:0;top:27%;bottom:4%;border-radius:16px;background:var(--holo);box-shadow:0 -2px 0 rgba(255,255,255,.6) inset,0 8px 20px rgba(110,60,180,.2);overflow:hidden}
.f-front::after{content:"";position:absolute;inset:0;background:var(--noise);opacity:.4;mix-blend-mode:soft-light}
.f-front .spark{right:14%;top:14%}
.f-count{position:absolute;left:14px;bottom:12px;font-size:12px;font-weight:700;color:#4A3570;background:rgba(255,255,255,.55);padding:3px 9px;border-radius:999px}
.folder-empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 16px}
.panel{position:fixed;z-index:7;top:calc(env(safe-area-inset-top) + 76px);left:max(10px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom) + 14px);
  width:min(320px,calc(100vw - 20px));display:flex;flex-direction:column;border-radius:24px;background:var(--glass-strong);border:1px solid var(--line);
  box-shadow:var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.panel-head{display:flex;align-items:center;gap:6px;padding:12px 10px 6px 16px}
.panel-head h3{margin:0;flex:1;font:italic 700 20px/1 var(--f-serif)}
.panel .seg{margin:4px 12px 10px;align-self:flex-start}
.panel .seg button{min-height:34px;padding:0 12px;font-size:13px}
.thumbs{flex:1;overflow:auto;padding:4px 14px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;align-content:start}
.sec-h{grid-column:1/-1;font:italic 700 16px/1.2 var(--f-serif);color:var(--accent);margin-top:4px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.thumb{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.thumb .tgo{width:100%;display:block}
.thumb canvas{width:100%;height:auto;display:block;border-radius:4px;background:#fff;box-shadow:0 1px 5px rgba(60,20,100,.2)}
.thumb.cur canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.thumb.cur{color:var(--accent)}
.thumb .star{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);color:#B9A9D6;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.thumb .star svg{width:17px;height:17px}
.thumb .star.on{color:#F0A500}
.thumb .star.on svg{fill:currentColor}
.panel-empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
.sec-tab,.fav-mark{position:absolute;top:-13px;z-index:2;pointer-events:none;box-shadow:0 3px 10px rgba(120,70,200,.3)}
.sec-tab{right:28px;max-width:60%;padding:5px 14px;border-radius:999px;background:var(--holo);color:#2A1B3D;font:italic 700 14px/1.2 var(--f-serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-mark{left:22px;width:28px;height:28px;border-radius:50%;background:#FFF6D6;color:#F0A500;display:grid;place-items:center}
.fav-mark svg{width:16px;height:16px;fill:currentColor}
.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shapes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;background:var(--surface-2);font-size:13px;font-weight:600}
.shapes button svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shapes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.shapes button.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px}
.icon[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kinds button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;padding:12px;border-radius:16px;background:var(--surface-2);font-weight:600;font-size:14px}
.kinds canvas{width:100%;height:56px;background:#fff;border-radius:10px}
.kinds button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.stk-photo{width:100%;margin-bottom:12px}
.ruler{position:fixed;left:0;top:0;z-index:4;height:76px;border-radius:12px;pointer-events:none;transform-origin:50% 50%;
  background:
    linear-gradient(90deg,rgba(74,53,112,.55) 1px,transparent 1px) 0 0/10px 11px repeat-x,
    linear-gradient(90deg,rgba(74,53,112,.75) 1.5px,transparent 1.5px) 0 0/50px 20px repeat-x,
    linear-gradient(90deg,rgba(74,53,112,.55) 1px,transparent 1px) 0 100%/10px 11px repeat-x,
    linear-gradient(90deg,rgba(74,53,112,.75) 1.5px,transparent 1.5px) 0 100%/50px 20px repeat-x,
    linear-gradient(115deg,rgba(255,206,232,.62),rgba(214,198,255,.62) 40%,rgba(190,230,255,.62) 70%,rgba(255,242,196,.62));
  box-shadow:0 0 0 1.5px rgba(255,255,255,.8) inset,0 10px 28px rgba(90,50,160,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.rl-angle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 15px/1 var(--f-sans);color:#4A3570;background:rgba(255,255,255,.8);padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  margin:0 0 22px;max-width:560px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;outline:none;min-height:44px}
.search input::-webkit-search-cancel-button{opacity:.5}
.results{display:flex;flex-direction:column;gap:10px;max-width:760px}
.res{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.res:hover{border-color:var(--accent)}
.res .cover{width:42px;flex:none;border-radius:4px 8px 8px 4px}
.res .cover .spark,.res .cover .cover-title,.res .cover .cover-pdf{display:none}

  display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none;cursor:default}

.cover[data-cover=cosmos]{--ct:#FFF6FF;background:radial-gradient(circle at 28% 18%,#9256E6 0,transparent 50%),radial-gradient(circle at 82% 82%,#E05FA8 0,transparent 46%),#1E1238}
.card-meta{display:flex;align-items:flex-start;gap:4px;margin-top:12px}
.card-meta>div{flex:1;min-width:0}

.empty-art .spark:nth-of-type(1){left:-6px;top:0;width:26px;height:26px}
.empty-art .spark:nth-of-type(2){right:-4px;top:30px;width:16px;height:16px;animation-delay:-1.2s}
.empty-art .spark:nth-of-type(3){right:10px;bottom:-4px;width:22px;height:22px;animation-delay:-2.3s}
.empty h2{color:var(--ink);margin:0 0 8px;font:italic 700 28px/1.15 var(--f-serif)}
.empty p{margin:0 auto 22px;max-width:420px}

/* ---------- Editor ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative;z-index:5;
  margin:calc(env(safe-area-inset-top) + 8px) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
  padding:6px;border-radius:24px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.title{font:italic 700 18px/1 var(--f-serif);padding:0 10px;height:44px;max-width:22vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:14px}
.title:hover{background:var(--surface-2)}
.tools{flex:1;display:flex;align-items:center;justify-content:flex-start;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tools>:first-child{margin-left:auto}
.tools>:last-child{margin-right:auto}
.tools::-webkit-scrollbar{display:none}
.tool{color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--holo);color:#2A1B3D;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 4px 14px rgba(170,120,230,.35)}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
.colors,.sizes{display:flex;align-items:center;gap:2px;flex:none}
.swatch{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none;position:relative}
.swatch span{width:24px;height:24px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 -3px 6px rgba(0,0,0,.08),inset 0 3px 5px rgba(255,255,255,.45)}
.swatch[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.swatch.custom span{background:conic-gradient(#FF9FD2,#FFD59E,#B8F0C8,#9FD8FF,#C9A8FF,#FF9FD2)}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.size{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;flex:none}
.size span{border-radius:50%;background:var(--muted)}
.size[aria-pressed="true"]{background:var(--accent-soft)}
.size[aria-pressed="true"] span{background:var(--accent)}
.bar-right{display:flex;align-items:center}
@media (max-width:1280px){
  .bar .icon{width:40px;height:40px}
  .bar .swatch,.bar .size{width:32px;height:32px}
  .bar .swatch span{width:22px;height:22px}
  .bar .sep{margin:0 3px}
  .font-btn{padding:0 10px}
  .font-btn .fb-name{display:none}
}
@media (max-width:1024px){
  .tools{order:3;flex-basis:100%}
  .panel{top:calc(env(safe-area-inset-top) + 124px)}
  .title{max-width:none;flex:1;text-align:left}
}
.desk{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pages{display:flex;flex-direction:column;align-items:center;position:relative;transform-origin:0 0;padding:20px 16px 140px;min-width:100%}
.page{position:relative;flex:none;background:#fff;box-shadow:var(--page-shadow);border-radius:3px}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3px}
.page canvas.live{pointer-events:none}
.add-page{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);color:var(--muted);
  border-radius:18px;height:84px;font-weight:600;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.add-page:hover{color:var(--accent);border-color:var(--accent)}
.page-ind{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:4;
  background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
.zoom-ind{right:auto;left:max(16px,env(safe-area-inset-left))}
.sel-bar{position:fixed;z-index:6;display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;
  background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(-50%);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sel-bar .btn{min-height:36px;padding:0 12px;border:0;background:none;font-size:14px;box-shadow:none}
.sel-bar .swatch{width:32px;height:32px}
.sel-bar .swatch span{width:20px;height:20px}

/* ---------- Janelas ---------- */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:calc(100vw - 32px);width:460px}
dialog::backdrop{background:rgba(40,16,70,.30);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{background:var(--glass-strong);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:22px;
  max-height:calc(100dvh - 48px);overflow:auto;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
.dlg h2{margin:0 0 14px;font:italic 700 24px/1.15 var(--f-serif);letter-spacing:-.01em}
.dlg p{margin:0 0 14px;color:var(--muted)}
.dlg label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.dlg input[type=text]{width:100%;min-height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 16px;font:inherit}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.cv-pick{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
.cv-pick .cover{border-radius:5px 10px 10px 5px;box-shadow:inset 7px 0 0 rgba(40,10,60,.10),0 2px 8px rgba(90,50,160,.18)}
.cv-pick .cover[data-cover=strawberry]::before{inset:7px 6px 7px 12px}
.cv-pick[aria-pressed="true"]{color:var(--accent)}
.cv-pick[aria-pressed="true"] .cover{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tpl canvas{width:100%;aspect-ratio:1000/1414;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.tpl[aria-pressed="true"]{color:var(--accent)}
.tpl[aria-pressed="true"] canvas{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button i{width:14px;height:14px;border-radius:50%;background:var(--pp);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 3px rgba(60,20,100,.18)}
.menu{display:flex;flex-direction:column;margin:0 -8px}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;min-height:50px;padding:6px 12px;border-radius:16px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu .sub{display:block;font-size:13px;color:var(--muted)}
.menu .chk{margin-left:auto;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.menu .chk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.menu .chk.on{background:var(--cta)}
.menu .chk.on::after{transform:translateX(18px)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 72px);transform:translateX(-50%);z-index:50;
  background:rgba(42,27,61,.88);color:#FBF5FF;padding:12px 20px;border-radius:999px;font-size:15px;max-width:calc(100vw - 32px);
  box-shadow:var(--shadow);text-align:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:none}
</style>
</head>

<script>

/* =====================================================================

/* ---------- Banco local ---------- */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{
    const r=indexedDB.open('sinapse',2);
    r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);
      if(!has('notebooks'))d.createObjectStore('notebooks',{keyPath:'id'});
      if(!has('pages'))d.createObjectStore('pages',{keyPath:'id'}).createIndex('nb','nb');
      if(!has('blobs'))d.createObjectStore('blobs',{keyPath:'id'});
      if(!has('folders'))d.createObjectStore('folders',{keyPath:'id'});};
    r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error);
  })},
  tx(store,mode,fn){return new Promise((res,rej)=>{
    const t=DB.db.transaction(store,mode),q=fn(t.objectStore(store));let out;
    if(q)q.onsuccess=()=>{out=q.result};
    t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  })},
  get:(s,id)=>DB.tx(s,'readonly',x=>x.get(id)),
  put:(s,v)=>DB.tx(s,'readwrite',x=>x.put(v)),
  del:(s,id)=>DB.tx(s,'readwrite',x=>x.delete(id)),
  all:s=>DB.tx(s,'readonly',x=>x.getAll()),
  pagesOf:id=>DB.tx('pages','readonly',x=>x.index('nb').getAll(id))
};

function drawTemplate(c,tpl,w,h,lw=1){
  if(['daily','weekly','monthly','journal','todo'].includes(tpl)){c.save();drawPlanner(c,tpl,w,h,lw);c.restore();return}
  c.save();
  if(tpl==='lined'||tpl==='cornell'){
    const x0=tpl==='cornell'?280:0,y0=tpl==='cornell'?150:118,y1=tpl==='cornell'?h-230:h-40;
    c.strokeStyle='#D2C7EA';c.lineWidth=lw;c.beginPath();
    for(let y=y0;y<=y1;y+=34){c.moveTo(x0,y);c.lineTo(w,y)}
    c.stroke();
    if(tpl==='lined'){c.strokeStyle='#F2A8C8';c.beginPath();c.moveTo(88,0);c.lineTo(88,h);c.stroke()}
    else{
      c.strokeStyle='#C2A6F0';c.lineWidth=lw*1.6;c.beginPath();
      c.moveTo(0,116);c.lineTo(w,116);c.moveTo(280,116);c.lineTo(280,h-200);c.moveTo(0,h-200);c.lineTo(w,h-200);c.stroke();
    }
  }else if(tpl==='grid'){
    c.strokeStyle='#E3DBF2';c.lineWidth=lw*.9;c.beginPath();
    for(let x=25;x<w;x+=25){c.moveTo(x,0);c.lineTo(x,h)}
    for(let y=25;y<h;y+=25){c.moveTo(0,y);c.lineTo(w,y)}
    c.stroke();
  }else if(tpl==='dots'){
    c.fillStyle='#B9ADD4';const r=Math.max(1.5,lw*1.3);c.beginPath();
    for(let x=25;x<w;x+=25)for(let y=25;y<h;y+=25){c.moveTo(x+r,y);c.arc(x,y,r,0,6.2832)}
    c.fill();
  }
  c.restore();
}
const widthAt=(st,pr)=>st.s*(0.35+1.3*pr);
function tracePath(c,p,n){
  c.moveTo(p[0],p[1]);
  for(let i=1;i<n-1;i++){const j=i*3;c.quadraticCurveTo(p[j],p[j+1],(p[j]+p[j+3])/2,(p[j+1]+p[j+4])/2)}
  if(n>1)c.lineTo(p[(n-1)*3],p[(n-1)*3+1]);else c.lineTo(p[0]+.01,p[1]);
}
function drawStroke(c,st,dx=0,dy=0){
  if(st.t==='text'){drawText(c,st,dx,dy);return}
  if(st.t==='img'){const im=st.bid?imgOf(st.bid):STK[st.src];if(im&&(im.naturalWidth||im.width)){if(st.r){c.save();c.translate(st.x+dx+st.w/2,st.y+dy+st.h/2);c.rotate(st.r);c.drawImage(im,-st.w/2,-st.h/2,st.w,st.h);c.restore()}else c.drawImage(im,st.x+dx,st.y+dy,st.w,st.h)}return}
  const p=st.p,n=p.length/3;if(!n)return;
  c.save();if(dx||dy)c.translate(dx,dy);
  c.lineCap='round';c.lineJoin='round';
  if(st.t==='hl'){
    c.globalAlpha=.4;c.globalCompositeOperation='multiply';
    c.strokeStyle=st.c;c.lineWidth=st.s;c.beginPath();tracePath(c,p,n);c.stroke();
  }else if(st.g&&n>1){
    c.strokeStyle=st.c;c.lineWidth=st.s;c.beginPath();c.moveTo(p[0],p[1]);
    for(let i=3;i<p.length;i+=3)c.lineTo(p[i],p[i+1]);c.stroke();
  }else if(n<3){
    c.strokeStyle=c.fillStyle=st.c;
    if(n===1){c.beginPath();c.arc(p[0],p[1],widthAt(st,p[2])/2,0,6.2832);c.fill()}
    else{c.lineWidth=widthAt(st,(p[2]+p[5])/2);c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(p[3],p[4]);c.stroke()}
  }else{
    // cada trecho tem a espessura da pressão naquele ponto (e do tipo de caneta)
    const kd=st.k;c.strokeStyle=kd==='pencil'?pencilPattern(c,st.c):st.c;let px=p[0],py=p[1];
    for(let i=1;i<n;i++){
      const j=i*3,x=p[j],y=p[j+1];let ex,ey;
      c.beginPath();c.moveTo(px,py);
      if(i<n-1){ex=(x+p[j+3])/2;ey=(y+p[j+4])/2;c.quadraticCurveTo(x,y,ex,ey)}else{ex=x;ey=y;c.lineTo(x,y)}
      const pr=(p[j-1]+p[j+2])/2;let lw2;
      if(kd==='fountain'){const ang=Math.atan2(y-p[j-2],x-p[j-3]);lw2=st.s*(.6+.8*pr)*(.28+1.2*Math.abs(Math.sin(ang-Math.PI/4)))}
      else if(kd==='brush'){const tp=Math.min(1,(i+1)/5,(n-i)/5);lw2=st.s*(.2+2.6*Math.pow(pr,1.25))*(.3+.7*tp)}
      else if(kd==='pencil'){lw2=st.s*(.55+.7*pr);c.globalAlpha=.5+.5*pr}
      else lw2=widthAt(st,pr);
      c.lineWidth=lw2;c.stroke();px=ex;py=ey;
    }
  }
  c.restore();
}
const measureCtx=document.createElement('canvas').getContext('2d');
const textCache=new WeakMap();
function textLayout(st){
  const sig=st.txt+'|'+st.f+'|'+st.s+'|'+st.w+'|'+fontEpoch;let L=textCache.get(st);if(L&&L.sig===sig)return L;
  const c=measureCtx;c.font=fontCss(st.f,st.s);const lines=[];
  for(const para of String(st.txt).split('\n')){
    let line='';
    for(const word of para.split(/(\s+)/)){
      const test=line+word;
      if(c.measureText(test).width>st.w&&line.trim()){lines.push(line.replace(/\s+$/,''));line=word.replace(/^\s+/,'')}else line=test;
    }
    lines.push(line);
  }
  L={sig,lines,h:Math.max(1,lines.length)*st.s*1.3};textCache.set(st,L);return L;
}
function drawText(c,st,dx,dy){
  if(!fontsOk.has(st.f))loadFont(st.f);
  const L=textLayout(st);c.save();c.font=fontCss(st.f,st.s);c.fillStyle=st.c;c.textBaseline='top';
  const lh=st.s*1.3,off=(lh-st.s)/2;let ox=st.x+dx,oy=st.y+dy;
  if(st.r){c.translate(ox+st.w/2,oy+L.h/2);c.rotate(st.r);ox=-st.w/2;oy=-L.h/2}
  L.lines.forEach((ln,i)=>c.fillText(ln,ox,oy+i*lh+off));c.restore();
}
const pencilCache=new WeakMap();
function pencilPattern(c,color){
  let m=pencilCache.get(c);if(!m){m=new Map();pencilCache.set(c,m)}
  let pat=m.get(color);
  if(!pat){
    const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');x.fillStyle=color;
    x.globalAlpha=.5;x.fillRect(0,0,64,64);
    for(let i=0;i<2200;i++){x.globalAlpha=.3+Math.random()*.7;x.fillRect(Math.random()*64,Math.random()*64,1.3,1.3)}
    pat=c.createPattern(cv,'repeat');m.set(color,pat);
  }
  try{const a=c.getTransform().a||1;pat.setTransform(new DOMMatrix([1/a,0,0,1/a,0,0]))}catch(e){}
  return pat;
}
function paint(c,d,bg,hide){
  c.fillStyle=PAPER[d.paper]||PAPER.white;c.fillRect(0,0,d.w,d.h);
  if(bg)c.drawImage(bg,0,0,d.w,d.h);else drawTemplate(c,d.tpl,d.w,d.h);
  for(const st of d.strokes)if(!hide||!hide.has(st))drawStroke(c,st);
}
async function loadBg(id){
  const rec=await DB.get('blobs',id);if(!rec)return null;
  if(window.createImageBitmap){try{return await createImageBitmap(rec.blob)}catch(e){}}
  return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(rec.blob);
    im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u});
}

/* ---------- Geometria ---------- */
const bboxCache=new WeakMap();
function bbox(st){
  if(st.t==='img'||st.t==='text'){const h=st.t==='img'?st.h:textLayout(st).h;
    if(!st.r)return {x:st.x,y:st.y,w:st.w,h};
    const cx=st.x+st.w/2,cy=st.y+h/2,co=Math.abs(Math.cos(st.r)),si=Math.abs(Math.sin(st.r)),W=st.w*co+h*si,H=st.w*si+h*co;
    return {x:cx-W/2,y:cy-H/2,w:W,h:H}}
  let b=bboxCache.get(st);if(b)return b;
  const p=st.p,pad=st.t==='hl'?st.s/2:st.k?st.s*1.5:widthAt(st,1)/2;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let i=0;i<p.length;i+=3){if(p[i]<x0)x0=p[i];if(p[i]>x1)x1=p[i];if(p[i+1]<y0)y0=p[i+1];if(p[i+1]>y1)y1=p[i+1]}
  b={x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2};bboxCache.set(st,b);return b;
}
function segDist(px,py,ax,ay,bx,by){
  const vx=bx-ax,vy=by-ay,l=vx*vx+vy*vy;let t=l?((px-ax)*vx+(py-ay)*vy)/l:0;t=clamp(t,0,1);
  const dx=px-(ax+t*vx),dy=py-(ay+t*vy);return Math.sqrt(dx*dx+dy*dy);
}
function hitStroke(st,x,y,r){
  const b=bbox(st);if(x<b.x-r||x>b.x+b.w+r||y<b.y-r||y>b.y+b.h+r)return false;
  if(st.t==='img'||st.t==='text')return true;
  const p=st.p,n=p.length/3,lim=r+(st.t==='hl'?st.s/2:widthAt(st,.5)/2);
  if(n===1)return Math.hypot(p[0]-x,p[1]-y)<=lim;
  for(let i=0;i<n-1;i++){const j=i*3;if(segDist(x,y,p[j],p[j+1],p[j+3],p[j+4])<=lim)return true}
  return false;
}
function inPoly(x,y,poly){
  let ins=false;
  for(let i=0,j=poly.length-2;i<poly.length;j=i,i+=2){
    const xi=poly[i],yi=poly[i+1],xj=poly[j],yj=poly[j+1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;
  }
  return ins;
}
function translateStrokes(list,dx,dy){
  for(const st of list){
    if(st.t==='img'||st.t==='text'){st.x=r1(st.x+dx);st.y=r1(st.y+dy);continue}
    const p=st.p;for(let i=0;i<p.length;i+=3){p[i]=r1(p[i]+dx);p[i+1]=r1(p[i+1]+dy)}bboxCache.delete(st)}
}
function rotateStrokes(list,ang,cx,cy){
  const co=Math.cos(ang),si=Math.sin(ang),rot=(x,y)=>[cx+(x-cx)*co-(y-cy)*si,cy+(x-cx)*si+(y-cy)*co];
  for(const st of list){
    if(st.t==='img'||st.t==='text'){const h=st.t==='img'?st.h:textLayout(st).h,[nx,ny]=rot(st.x+st.w/2,st.y+h/2);
      st.x=r1(nx-st.w/2);st.y=r1(ny-h/2);let r=(st.r||0)+ang;r=Math.atan2(Math.sin(r),Math.cos(r));st.r=Math.abs(r)<1e-4?0:Math.round(r*1e4)/1e4;if(!st.r)delete st.r;continue}
    const p=st.p;for(let i=0;i<p.length;i+=3){const [x,y]=rot(p[i],p[i+1]);p[i]=r1(x);p[i+1]=r1(y)}bboxCache.delete(st);
  }
}
function scaleStrokes(list,f,cx,cy){
  for(const st of list){
    if(st.t==='text'){st.x=r1(cx+(st.x-cx)*f);st.y=r1(cy+(st.y-cy)*f);st.w=r1(st.w*f);st.s=Math.round(st.s*f*10)/10;continue}
    if(st.t==='img'){st.x=r1(cx+(st.x-cx)*f);st.y=r1(cy+(st.y-cy)*f);st.w=r1(st.w*f);st.h=r1(st.h*f);continue}
    const p=st.p;for(let i=0;i<p.length;i+=3){p[i]=r1(cx+(p[i]-cx)*f);p[i+1]=r1(cy+(p[i+1]-cy)*f)}
    st.s=Math.round(st.s*f*100)/100;bboxCache.delete(st)}
}
/* ---------- Formas: gerar e reconhecer ---------- */
const toFlat=L=>L.flatMap(([x,y])=>[r1(x),r1(y),.5]);
function ellipsePts(cx,cy,rx,ry){const L=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;L.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return L}
function arrowPts(ax,ay,bx,by,s){
  const len=Math.hypot(bx-ax,by-ay)||1,h=clamp(len*.28,12,42)+s*2,ang=Math.atan2(by-ay,bx-ax),t=.5;
  const l=[bx-h*Math.cos(ang-t),by-h*Math.sin(ang-t)],r=[bx-h*Math.cos(ang+t),by-h*Math.sin(ang+t)];
  return [[ax,ay],[bx,by],l,[bx,by],r];
}
function shapePts(kind,a,b,s){
  const x0=Math.min(a.x,b.x),y0=Math.min(a.y,b.y),x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y);
  if(kind==='line')return toFlat([[a.x,a.y],[b.x,b.y]]);
  if(kind==='arrow')return toFlat(arrowPts(a.x,a.y,b.x,b.y,s));
  if(kind==='rect')return toFlat([[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]]);
  if(kind==='ellipse')return toFlat(ellipsePts((x0+x1)/2,(y0+y1)/2,(x1-x0)/2,(y1-y0)/2));
  return toFlat([[(x0+x1)/2,y0],[x1,y1],[x0,y1],[(x0+x1)/2,y0]]);
}
function rdp(pts,eps){
  if(pts.length<3)return pts.slice();const a=pts[0],b=pts[pts.length-1];let md=0,ix=0;
  for(let i=1;i<pts.length-1;i++){const d=segDist(pts[i][0],pts[i][1],a[0],a[1],b[0],b[1]);if(d>md){md=d;ix=i}}
  if(md>eps){const l=rdp(pts.slice(0,ix+1),eps),r=rdp(pts.slice(ix),eps);return l.slice(0,-1).concat(r)}
  return [a,b];
}
function closedCorners(pts,eps){
  let far=0,fd=0;pts.forEach((q,i)=>{const d=Math.hypot(q[0]-pts[0][0],q[1]-pts[0][1]);if(d>fd){fd=d;far=i}});
  let v=rdp(pts.slice(0,far+1),eps).slice(0,-1).concat(rdp(pts.slice(far).concat([pts[0]]),eps).slice(0,-1));
  let changed=true;
  while(changed&&v.length>3){changed=false;
    for(let i=0;i<v.length;i++){const a=v[(i+v.length-1)%v.length],c=v[i],b=v[(i+1)%v.length];
      const u=[a[0]-c[0],a[1]-c[1]],w=[b[0]-c[0],b[1]-c[1]],lu=Math.hypot(...u),lw=Math.hypot(...w);
      const ang=Math.acos(clamp((u[0]*w[0]+u[1]*w[1])/((lu*lw)||1),-1,1))*180/Math.PI;
      if(ang>148||lu<eps*.9){v.splice(i,1);changed=true;break}}}
  return v;
}
function recognize(p){
  const n=p.length/3;if(n<5)return null;
  const pts=[];for(let i=0;i<p.length;i+=3)pts.push([p[i],p[i+1]]);
  let len=0;for(let i=1;i<n;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const w=x1-x0,h=y1-y0,diag=Math.hypot(w,h);if(diag<24)return null;
  const s=pts[0],e=pts[n-1],gap=Math.hypot(e[0]-s[0],e[1]-s[1]);
  let maxd=0;for(const q of pts)maxd=Math.max(maxd,segDist(q[0],q[1],s[0],s[1],e[0],e[1]));
  if(gap>.6*len&&maxd<Math.max(6,.07*len))return {kind:'line',p:toFlat([s,e])};
  if(gap>Math.max(34,.28*diag))return null;
  const cx=x0+w/2,cy=y0+h/2,rx=Math.max(w/2,1),ry=Math.max(h/2,1);
  let err=0;for(const q of pts)err+=Math.abs(Math.hypot((q[0]-cx)/rx,(q[1]-cy)/ry)-1);err/=n;
  const v=closedCorners(pts,.075*diag);
  if(err<.075&&v.length>=5)return ellipseShape(cx,cy,rx,ry);
  if(v.length===3)return {kind:'tri',p:toFlat(v.concat([v[0]]))};
  if(v.length===4){
    const axis=v.every((q,i)=>{const r=v[(i+1)%4],a=Math.abs(Math.atan2(r[1]-q[1],r[0]-q[0])*180/Math.PI)%90;return a<16||a>74});
    if(axis)return {kind:'rect',p:toFlat([[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]])};
    return {kind:'quad',p:toFlat(v.concat([v[0]]))};
  }
  if(err<.16)return ellipseShape(cx,cy,rx,ry);
  return null;
}
function ellipseShape(cx,cy,rx,ry){if(Math.abs(rx-ry)/Math.max(rx,ry)<.14){const r=(rx+ry)/2;rx=ry=r}return {kind:'ellipse',p:toFlat(ellipsePts(cx,cy,rx,ry))}}
function unionBox(list){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const st of list){const b=bbox(st);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h)}
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}

const fmtDate=t=>{const d=new Date(t),now=new Date();
  if(d.toDateString()===now.toDateString())return 'hoje, '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:d.getFullYear()===now.getFullYear()?undefined:'numeric'})};

const LIB={folder:null};
async function renderLibrary(){
  const [all,folders]=await Promise.all([DB.all('notebooks'),DB.all('folders')]);
  if(LIB.folder&&!folders.some(f=>f.id===LIB.folder))LIB.folder=null;
  const here=LIB.folder,byId=new Map(folders.map(f=>[f.id,f]));
  const fl=folders.filter(f=>(f.parent||null)===here).sort((a,b)=>a.name.localeCompare(b.name,'pt'));
  const list=all.filter(nb=>(nb.folder||null)===here).sort((a,b)=>b.updated-a.updated);
  const crumbs=$('#crumbs');crumbs.hidden=!here;
  if(here){
    const chain=[];for(let f=byId.get(here);f;f=byId.get(f.parent))chain.unshift(f);
    crumbs.innerHTML=`<button data-f="">← Início</button>`+chain.slice(0,-1).map(f=>`<span class="sepc">›</span><button data-f="${f.id}">${esc(f.name)}</button>`).join('')+`<span class="sepc">›</span><span class="here">${esc(chain[chain.length-1].name)}</span>`;
    crumbs.querySelectorAll('button').forEach(b=>b.onclick=()=>{LIB.folder=b.dataset.f||null;renderLibrary()});
  }
  const grid=$('#grid');grid.innerHTML='';
  $('#empty').hidden=!!here||all.length+folders.length>0;
  if(here&&!fl.length&&!list.length)grid.innerHTML='<p class="folder-empty">Pasta vazia. Crie um caderno aqui ou traga um pelo menu ⋯ › Mover para pasta.</p>';
  for(const f of fl){
    const n=all.filter(nb=>nb.folder===f.id).length+folders.filter(x=>x.parent===f.id).length,card=document.createElement('div');card.className='card';
    card.innerHTML=`<button class="folder" aria-label="Abrir a pasta ${esc(f.name)}"><span class="f-back"></span><span class="f-front">${SPARKS}<span class="f-count">${n} ${n===1?'item':'itens'}</span></span></button>
      <div class="card-meta"><div><div class="card-name">${esc(f.name)}</div><div class="card-date">Pasta</div></div>
      <button class="icon more" aria-label="Opções da pasta ${esc(f.name)}"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button></div>`;
    $('.folder',card).onclick=()=>{LIB.folder=f.id;renderLibrary();scrollTo(0,0)};
    $('.more',card).onclick=()=>folderMenu(f);
    grid.append(card);
  }
  for(const nb of list){
    const n=nb.order.length,card=document.createElement('div');card.className='card';
    card.innerHTML=`<button class="cover" data-cover="${coverOf(nb)}" aria-label="Abrir ${esc(nb.title)}">${SPARKS}<span class="cover-title">${esc(nb.title)}</span>${nb.pdf?'<span class="cover-pdf">PDF</span>':''}</button>
      <div class="card-meta"><div><div class="card-name">${esc(nb.title)}</div><div class="card-date">${n} ${n===1?'página':'páginas'} · ${fmtDate(nb.updated)}</div></div>
      <button class="icon more" aria-label="Opções de ${esc(nb.title)}"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button></div>`;
    $('.cover',card).onclick=()=>openNotebook(nb.id);
    $('.more',card).onclick=()=>notebookMenu(nb);
    grid.append(card);
  }
}

async function notebookMenu(nb){
  const a=await menu(nb.title,[
    {id:'open',label:'Abrir'},
    {id:'rename',label:'Renomear'},
    {id:'cover',label:'Mudar a capa'},
    {id:'move',label:'Mover para pasta'},
    {id:'dup',label:'Duplicar'},
    {id:'pdf',label:'Exportar em PDF',sub:'Para compartilhar, imprimir ou guardar uma cópia'},
    {id:'del',label:'Apagar caderno',danger:true}
  ]);
  if(a==='open')openNotebook(nb.id);
  else if(a==='rename'){const t=await ask('Renomear caderno',nb.title);if(t){nb.title=t;await DB.put('notebooks',nb);renderLibrary()}}
  else if(a==='cover'){const c=await pickCover(coverOf(nb));if(c){nb.cover=c;await DB.put('notebooks',nb);renderLibrary()}}
  else if(a==='move'){const t=await pickFolder('Mover “'+nb.title+'” para');if(t!==undefined){nb.folder=t;await DB.put('notebooks',nb);renderLibrary();toast('Caderno movido ✦')}}
  else if(a==='dup')duplicateNotebook(nb);
  else if(a==='pdf'){const pages=await orderedPages(nb);exportPDF(nb.title,pages)}
  else if(a==='del'){
    if(await confirmDlg('Apagar “'+nb.title+'”?','O caderno e todas as páginas somem deste aparelho. Isso não pode ser desfeito.','Apagar')){
      for(const p of await DB.pagesOf(nb.id)){for(const b of blobIdsOf(p))await DB.del('blobs',b);await DB.del('pages',p.id)}
      await DB.del('notebooks',nb.id);renderLibrary();toast('Caderno apagado');
    }
  }
}
async function folderMenu(f){
  const a=await menu(f.name,[{id:'open',label:'Abrir'},{id:'rename',label:'Renomear'},{id:'move',label:'Mover para outra pasta'},{id:'del',label:'Apagar pasta',sub:'Os cadernos de dentro voltam para a pasta de cima',danger:true}]);
  if(a==='open'){LIB.folder=f.id;renderLibrary()}
  else if(a==='rename'){const t=await ask('Renomear pasta',f.name);if(t){f.name=t;await DB.put('folders',f);renderLibrary()}}
  else if(a==='move'){const t=await pickFolder('Mover a pasta “'+f.name+'” para',f.id);if(t!==undefined){f.parent=t;await DB.put('folders',f);renderLibrary()}}
  else if(a==='del'){
    if(!(await confirmDlg('Apagar a pasta “'+f.name+'”?','Nenhum caderno é apagado: o que estiver dentro vai para a pasta de cima.','Apagar pasta')))return;
    const up=f.parent||null;
    for(const nb of await DB.all('notebooks'))if(nb.folder===f.id){nb.folder=up;await DB.put('notebooks',nb)}
    for(const x of await DB.all('folders'))if(x.parent===f.id){x.parent=up;await DB.put('folders',x)}
    await DB.del('folders',f.id);renderLibrary();toast('Pasta apagada');
  }
}
async function newFolder(){
  const name=await ask('Nova pasta','','Criar');if(!name)return;
  await DB.put('folders',{id:uid(),name,parent:LIB.folder,created:Date.now()});renderLibrary();
}
async function pickFolder(title,exclude){
  const folders=await DB.all('folders'),kids=id=>folders.filter(f=>(f.parent||null)===id).sort((a,b)=>a.name.localeCompare(b.name,'pt'));
  const banned=new Set();if(exclude){const walk=id=>{banned.add(id);kids(id).forEach(k=>walk(k.id))};walk(exclude)}
  const rows=[{id:null,label:'Início',depth:0}];
  const add=(id,dp)=>kids(id).forEach(f=>{if(banned.has(f.id))return;rows.push({id:f.id,label:f.name,depth:dp});add(f.id,dp+1)});add(null,1);
  if(rows.length===1){toast('Crie uma pasta primeiro, no botão “Nova pasta”.',4000);return undefined}
  return openDlg(`<h2>${esc(title)}</h2><div class="menu">${rows.map((r,i)=>`<button data-i="${i}" style="padding-left:${12+r.depth*20}px">${r.depth?FOLDER_ICON:'<svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V19h12V9.5"/></svg>'}<span>${esc(r.label)}</span></button>`).join('')}</div>`,
    (d,done)=>d.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>done(rows[+b.dataset.i].id)));
}
async function duplicateNotebook(nb){
  try{
    toast('Duplicando…',0);
    const pages=await orderedPages(nb),copy={...structuredClone(nb),id:uid(),title:nb.title+' (cópia)',created:Date.now(),updated:Date.now(),order:[]};
    for(const pg of pages){
      const np=structuredClone(pg);np.id=uid();np.nb=copy.id;
      if(pg.bg){const b=await DB.get('blobs',pg.bg);if(b){np.bg=uid();await DB.put('blobs',{id:np.bg,blob:b.blob})}}
      for(const st of np.strokes)if(st.bid){const b=await DB.get('blobs',st.bid);if(b){st.bid=uid();await DB.put('blobs',{id:st.bid,blob:b.blob})}}
      await DB.put('pages',np);copy.order.push(np.id);
    }
    await DB.put('notebooks',copy);hideToast();renderLibrary();toast('Caderno duplicado ✦');
  }catch(e){console.error(e);hideToast();toast('Não consegui duplicar.',4000)}
}
async function orderedPages(nb){const m=new Map((await DB.pagesOf(nb.id)).map(p=>[p.id,p]));return nb.order.map(id=>m.get(id)).filter(Boolean)}
const newPage=(nbId,tpl,paper)=>({id:uid(),nb:nbId,tpl,paper,w:PAGE_W,h:A4_H,strokes:[],bg:null});

async function newNotebookDialog(){
  const r=await notebookForm();if(!r)return;
  const nb={id:uid(),title:r.title,cover:r.cover,tpl:r.tpl,paper:r.paper,folder:LIB.folder,created:Date.now(),updated:Date.now(),order:[]};
  const pg=newPage(nb.id,r.tpl,r.paper);nb.order.push(pg.id);
  await DB.put('pages',pg);await DB.put('notebooks',nb);
  openNotebook(nb.id);
}

const dlg=$('#dlg');
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close('')});
function openDlg(html,setup){
  return new Promise(res=>{
    dlg.innerHTML='<div class="dlg">'+html+'</div>';dlg.returnValue='';
    const done=v=>{dlg._val=v;dlg.close('x')};dlg._val=undefined;
    setup&&setup(dlg,done);
    dlg.onclose=()=>{const v=dlg._val;dlg.onclose=null;res(v)};
    dlg.showModal();
  });
}
function menu(title,items){
  return openDlg(`<h2>${esc(title)}</h2><div class="menu">${items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'danger':''}"><span><span>${esc(it.label)}</span>${it.sub?`<span class="sub">${esc(it.sub)}</span>`:''}</span>${it.check!==undefined?`<span class="chk ${it.check?'on':''}" aria-hidden="true"></span>`:''}</button>`).join('')}</div>`,
    (d,done)=>d.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>done(items[+b.dataset.i].id)));
}
function ask(title,value,ok='Salvar'){
  return openDlg(`<h2>${esc(title)}</h2><form><input type="text" maxlength="80" value="${esc(value)}" aria-label="${esc(title)}"><div class="actions"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">${esc(ok)}</button></div></form>`,
    (d,done)=>{const i=$('input',d);setTimeout(()=>{i.focus();i.select()},50);
      $('[data-x]',d).onclick=()=>done(null);
      $('form',d).onsubmit=e=>{e.preventDefault();done(i.value.trim()||null)}});
}
function confirmDlg(title,msg,ok){
  return openDlg(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="actions"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok style="background:var(--danger)">${esc(ok)}</button></div>`,

const io=new IntersectionObserver(es=>{for(const e of es){const rt=e.target._rt;if(!rt)continue;e.isIntersecting?attach(rt):detach(rt)}},{root:desk,rootMargin:'120% 60%'});
function buildPages(){

function baseWidth(){return Math.min(desk.clientWidth-32,880)}
function layout(){
  const w=Math.round(baseWidth()*S.zoom),gap=Math.max(10,Math.round(22*S.zoom));
  pagesEl.style.width=Math.max(desk.clientWidth,w+32)+'px';pagesEl.style.gap=gap+'px';
  for(const rt of S.pages){rt.cw=w;rt.el.style.width=w+'px';rt.el.style.height=Math.round(w*rt.d.h/rt.d.w)+'px';
    rt.el.style.background=PAPER[rt.d.paper]||'#fff';if(rt.canvas){sizeCanvas(rt);renderPage(rt)}}

function sizeCanvas(rt){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  let px=Math.round(rt.cw*dpr);px=Math.min(px,2600);   // limite de memória do iPad
  const ph=Math.round(px*rt.d.h/rt.d.w);
  if(rt.canvas.width!==px||rt.canvas.height!==ph){rt.canvas.width=px;rt.canvas.height=ph}
  rt.k=px/rt.d.w;
}
function attach(rt){
  if(rt.canvas)return;
  rt.canvas=document.createElement('canvas');rt.ctx=rt.canvas.getContext('2d');rt.el.prepend(rt.canvas);
  sizeCanvas(rt);renderPage(rt);
  if(rt.d.bg&&!rt.bgImg&&!rt.bgLoading){
    rt.bgLoading=true;loadBg(rt.d.bg).then(img=>{rt.bgLoading=false;if(!rt.canvas){img&&img.close&&img.close();return}rt.bgImg=img;renderPage(rt)});
  }
}
function detach(rt){
  if(!rt.canvas)return;

  if(live.parentNode===rt.el)live.remove();
  rt.canvas.width=rt.canvas.height=0;rt.canvas.remove();rt.canvas=rt.ctx=null;
  if(rt.bgImg){rt.bgImg.close&&rt.bgImg.close();rt.bgImg=null}
}
function renderPage(rt){

  lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(rt.k,0,0,rt.k,0,0);
}

/* ---------- Salvamento automático ---------- */
const saveTimers=new Map();let nbTimer;
function save(rt){
  clearTimeout(saveTimers.get(rt));

  const list=[...saveTimers.keys()];saveTimers.forEach(t=>clearTimeout(t));saveTimers.clear();
  for(const rt of list)await DB.put('pages',rt.d).catch(saveFail);
  clearTimeout(nbTimer);if(S.nb)await DB.put('notebooks',S.nb).catch(saveFail);
}

/* ---------- Desfazer / refazer ---------- */
function pushUndo(a){S.undo.push(a);if(S.undo.length>200)S.undo.shift();S.redo=[];updateUndo()}
function applyAction(a,dir){
  const s=a.rt.d.strokes;
  if(a.t==='add'){
    if(dir<0)a.items.forEach(st=>{const i=s.indexOf(st);if(i>=0)s.splice(i,1)});else s.push(...a.items);
  }else if(a.t==='del'){
    if(dir<0)[...a.items].reverse().forEach(({st,i})=>s.splice(i,0,st));
    else a.items.forEach(({st})=>{const i=s.indexOf(st);if(i>=0)s.splice(i,1)});
  }else if(a.t==='move')translateStrokes(a.items,a.dx*dir,a.dy*dir);
  else if(a.t==='color')a.items.forEach((st,j)=>st.c=dir<0?a.from[j]:a.to);
  else if(a.t==='rot')rotateStrokes(a.items,a.ang*dir,a.cx,a.cy);
  else if(a.t==='ops')dir<0?undoOps(s,a.ops):redoOps(s,a.ops);
  else if(a.t==='props')Object.assign(a.st,dir<0?a.from:a.to);
  else if(a.t==='scale')scaleStrokes(a.items,dir<0?1/a.f:a.f,a.cx,a.cy);
  clearSelection();renderPage(a.rt);save(a.rt);
}
function undo(){commitText();const a=S.undo.pop();if(!a)return;applyAction(a,-1);S.redo.push(a);updateUndo();scrollToRt(a.rt)}

/* ---------- Entrada: caneta, dedo e mouse ---------- */
function pressureOf(e){return e.pointerType==='pen'?Math.max(.05,e.pressure||.5):.5}
/* ---------- Régua ---------- */
const RL={on:false,cx:0,cy:0,a:0,len:2000,h:76,g:null};
const rulerEl=$('#ruler');
function placeRuler(){
  rulerEl.style.width=RL.len+'px';
  rulerEl.style.transform=`translate(${RL.cx-RL.len/2}px,${RL.cy-RL.h/2}px) rotate(${RL.a}rad)`;
  let deg=Math.round(RL.a*180/Math.PI);deg=((deg%180)+180)%180;if(deg>90)deg=180-deg;$('.rl-angle',rulerEl).textContent=deg+'°';
}
function toggleRuler(force){
  RL.on=force!==undefined?force:!RL.on;rulerEl.hidden=!RL.on;$('#btnRuler').setAttribute('aria-pressed',RL.on);
  if(RL.on){const r=desk.getBoundingClientRect();if(!RL.placed){RL.cx=r.left+r.width/2;RL.cy=r.top+r.height*.45;RL.placed=true}
    RL.len=Math.hypot(innerWidth,innerHeight)*1.3;placeRuler();
    if(!P.rulerTip){P.rulerTip=true;savePrefs();toast('Arraste a régua com um dedo e gire com dois (no computador, com a rodinha). Escreva junto da borda para sair reto.',7000)}}
}
function rulerLocal(x,y){const dx=x-RL.cx,dy=y-RL.cy,co=Math.cos(RL.a),si=Math.sin(RL.a);return {u:dx*co+dy*si,v:-dx*si+dy*co}}
function inRuler(x,y){if(!RL.on)return false;const l=rulerLocal(x,y);return Math.abs(l.u)<RL.len/2&&Math.abs(l.v)<RL.h/2}
function rulerEdge(x,y){if(!RL.on)return 0;const l=rulerLocal(x,y);if(Math.abs(l.u)>RL.len/2)return 0;const av=Math.abs(l.v);return av<RL.h/2+38?(l.v<0?-1:1):0}
function snapRuler(x,y,sign){const l=rulerLocal(x,y),v=sign*RL.h/2,co=Math.cos(RL.a),si=Math.sin(RL.a);return [RL.cx+l.u*co-v*si,RL.cy+l.u*si+v*co]}
function snapAngle(a){const st=Math.PI/12,n=Math.round(a/st)*st;return Math.abs(a-n)<.03?n:a}
$('#btnRuler').onclick=()=>toggleRuler();
document.getElementById('editor').addEventListener('pointerdown',e=>{
  if(!RL.on||e.pointerType==='pen'||!inRuler(e.clientX,e.clientY)||e.target.closest('.bar,.panel,.sel-bar,.tbox'))return;
  e.stopPropagation();e.preventDefault();
  const g=RL.g||(RL.g={pts:new Map()});g.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});g.start=null;
},true);
window.addEventListener('pointermove',e=>{
  const g=RL.g;if(!g||!g.pts.has(e.pointerId))return;
  const prev=[...g.pts.values()].map(q=>({...q}));g.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const now=[...g.pts.values()];
  if(now.length===1){RL.cx+=now[0].x-prev[0].x;RL.cy+=now[0].y-prev[0].y}
  else{const a0=Math.atan2(prev[1].y-prev[0].y,prev[1].x-prev[0].x),a1=Math.atan2(now[1].y-now[0].y,now[1].x-now[0].x);
    RL.raw=(RL.raw??RL.a)+(a1-a0);RL.a=snapAngle(RL.raw);
    RL.cx+=(now[0].x+now[1].x-prev[0].x-prev[1].x)/2;RL.cy+=(now[0].y+now[1].y-prev[0].y-prev[1].y)/2}
  placeRuler();
});
const rulerUp=e=>{const g=RL.g;if(!g||!g.pts.has(e.pointerId))return;g.pts.delete(e.pointerId);if(!g.pts.size){RL.g=null;RL.raw=undefined}};
window.addEventListener('pointerup',rulerUp);window.addEventListener('pointercancel',rulerUp);
function toPage(e,a){
  if(a.ruler){const [x,y]=snapRuler(e.clientX,e.clientY,a.ruler);return {x:(x-a.rect.left)/a.rect.width*a.rt.d.w,y:(y-a.rect.top)/a.rect.height*a.rt.d.h,p:pressureOf(e)}}
  return {x:(e.clientX-a.rect.left)/a.rect.width*a.rt.d.w,y:(e.clientY-a.rect.top)/a.rect.height*a.rt.d.h,p:pressureOf(e)}}

pagesEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen'&&!P.penSeen){
    P.penSeen=true;P.penOnly=true;savePrefs();
    toast('Caneta detectada: agora só a caneta escreve e o dedo rola a página. Dá para mudar em “Mais opções”.',6000);
  }
  if(e.target.closest('.tbox'))return;
  if(act||pinch)return;
  if(e.pointerType==='touch'&&P.penOnly)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const el=e.target.closest('.page');
  if(!el){if(S.sel)clearSelection();return}
  const rt=el._rt;if(!rt.canvas)return;
  if(P.tool==='text'){textDown(e,rt);return}
  e.preventDefault();
  if(e.pointerType==='pen')penDown=true;
  try{el.setPointerCapture(e.pointerId)}catch(x){}
  const a={rt,id:e.pointerId,type:e.pointerType,rect:el.getBoundingClientRect()};
  if(RL.on&&(P.tool==='pen'||P.tool==='hl'))a.ruler=rulerEdge(e.clientX,e.clientY)||0;
  const pt=toPage(e,a),t=P.tool;
  if(t==='lasso'&&S.sel&&S.sel.rt===rt){
    const h=handlePos(S.sel);
    if(Math.hypot(pt.x-h.x,pt.y-h.y)<h.r*1.9){
      const b=S.sel.box,cx=b.x+b.w/2,cy=b.y+b.h/2;
      Object.assign(a,{kind:'rotate',cx,cy,a0:Math.atan2(pt.y-cy,pt.x-cx),ang:0});act=a;S.sel.dragging=true;$('#selBar').hidden=true;
      renderPage(rt);ensureLive(rt);drawSelection();return;
    }
  }
  if(t==='lasso'&&S.sel){
    const b=S.sel.box;
    if(S.sel.rt===rt&&pt.x>=b.x-12&&pt.x<=b.x+b.w+12&&pt.y>=b.y-12&&pt.y<=b.y+b.h+12){
      Object.assign(a,{kind:'drag',start:pt,dx:0,dy:0});act=a;S.sel.dragging=true;$('#selBar').hidden=true;
      renderPage(rt);ensureLive(rt);drawSelection();return;
    }
    clearSelection();
  }
  ensureLive(rt);
  if(t==='pen'||t==='hl'){
    a.kind='ink';a.st={t,c:t==='pen'?P.penColor:P.hlColor,s:SIZES[t][P.size[t]],p:[]};a.lp=pt.p;
    if(t==='pen'&&P.penKind&&P.penKind!=='ball')a.st.k=P.penKind;
    act=a;addPoint(pt);a.anchor=pt;armHold();schedule();
  }else if(t==='shape'){
    a.st={t:'pen',c:P.penColor,s:SIZES.shape[P.size.shape],p:[]};act=a;
    if(P.shape==='auto'){a.kind='ink';a.auto=true;a.lp=pt.p;addPoint(pt);a.anchor=pt;schedule()}
    else{a.kind='shape';a.st.g=1;a.start=pt}
  }else if(t==='eraser'){
    Object.assign(a,{kind:'erase',removed:[],ops:[],part:P.eraserMode==='part',last:pt});act=a;eraseAt(pt);drawEraser(pt);
  }else{
    Object.assign(a,{kind:'lasso',poly:[pt.x,pt.y]});act=a;
  }
});
pagesEl.addEventListener('pointermove',e=>{
  if(!act||e.pointerId!==act.id)return;
  const list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];if(!list.length)list.push(e);
  if(act.kind==='ink'){
    for(const ev of list)addPoint(toPage(ev,act));
    const last=toPage(e,act);
    if(Math.hypot(last.x-act.anchor.x,last.y-act.anchor.y)>3){act.anchor=last;armHold()}
    schedule();
  }else if(act.kind==='erase'){
    for(const ev of list){const pt=toPage(ev,act);eraseLine(act.last,pt);act.last=pt}
    drawEraser(act.last);
  }else if(act.kind==='lasso'){
    for(const ev of list){const pt=toPage(ev,act);act.poly.push(r1(pt.x),r1(pt.y))}
    schedule();
  }else if(act.kind==='drag'){
    const pt=toPage(e,act);act.dx=pt.x-act.start.x;act.dy=pt.y-act.start.y;schedule();
  }else if(act.kind==='shape'){
    act.st.p=shapePts(P.shape,act.start,toPage(e,act),act.st.s);schedule();
  }else if(act.kind==='rotate'){
    const pt=toPage(e,act);let ang=Math.atan2(pt.y-act.cy,pt.x-act.cx)-act.a0;ang=Math.atan2(Math.sin(ang),Math.cos(ang));
    const st15=Math.PI/12,near=Math.round(ang/st15)*st15;if(Math.abs(ang-near)<.06)ang=near;act.ang=ang;schedule();
  }
});
pagesEl.addEventListener('pointerup',e=>{if(act&&e.pointerId===act.id)finish()});
pagesEl.addEventListener('pointercancel',e=>{if(act&&e.pointerId===act.id)cancelAct()});
window.addEventListener('pointerup',e=>{if(e.pointerType==='pen')penDown=false});
window.addEventListener('pointercancel',e=>{if(e.pointerType==='pen')penDown=false});

function addPoint(pt){
  const a=act,p=a.st.p,n=p.length;
  const pr=a.lp=a.lp*.6+pt.p*.4;   // suaviza a pressão
  if(a.shaped)return;
  if(a.straight){p[n-3]=r1(pt.x);p[n-2]=r1(pt.y);return}
  if(n&&Math.hypot(pt.x-p[n-3],pt.y-p[n-2])<.5)return;
  p.push(r1(pt.x),r1(pt.y),Math.round(pr*100)/100);
}
/* Segurar a caneta parada no fim do traço: vira linha reta, círculo, retângulo ou triângulo */
function armHold(){
  clearTimeout(act.hold);const a=act;if(a.ruler)return;
  a.hold=setTimeout(()=>{
    if(act!==a||a.kind!=='ink'||a.straight)return;
    const p=a.st.p,n=p.length/3;if(n<4)return;
    let len=0;for(let i=3;i<p.length;i+=3)len+=Math.hypot(p[i]-p[i-3],p[i+1]-p[i-2]);
    if(len<40)return;
    const shp=recognize(p);
    if(shp&&shp.kind!=='line'){a.st.p=shp.p;a.st.g=1;a.shaped=true;schedule();return}
    let avg=0;for(let i=2;i<p.length;i+=3)avg+=p[i];avg=Math.round(avg/n*100)/100;
    a.st.p=[p[0],p[1],avg,p[p.length-3],p[p.length-2],avg];a.straight=true;schedule();
  },550);
}
let raf=0;
function schedule(){if(!raf)raf=requestAnimationFrame(frame)}
function frame(){
  raf=0;if(!act)return;
  const k=act.rt.k;lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(k,0,0,k,0,0);
  if(act.kind==='ink'||act.kind==='shape')drawStroke(lctx,act.st);
  else if(act.kind==='lasso'){
    const p=act.poly;lctx.save();lctx.lineWidth=1.5;lctx.setLineDash([6,5]);lctx.strokeStyle='#8B5CF6';lctx.fillStyle='rgba(139,92,246,.06)';
    lctx.beginPath();lctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)lctx.lineTo(p[i],p[i+1]);lctx.closePath();lctx.fill();lctx.stroke();lctx.restore();
  }else if(act.kind==='drag'||act.kind==='rotate')drawSelection();
}
function finish(){
  const a=act;act=null;clearTimeout(a.hold);cancelAnimationFrame(raf);raf=0;
  if(a.type==='pen')penDown=false;
  const rt=a.rt;
  if(a.kind==='shape'){const b=bbox(a.st);if(a.st.p.length&&Math.max(b.w,b.h)>a.st.s*3)a.kind='ink';else{clearLive();updateIndicator();return}}
  if(a.kind==='ink'&&a.auto&&!a.shaped){const shp=recognize(a.st.p);if(shp){a.st.p=shp.p;a.st.g=1}}
  if(a.kind==='ink'){
    clearLive();
    if(a.st.p.length){rt.d.strokes.push(a.st);rt.ctx.setTransform(rt.k,0,0,rt.k,0,0);drawStroke(rt.ctx,a.st);pushUndo({t:'add',rt,items:[a.st]});save(rt)}
  }else if(a.kind==='erase'){
    clearLive();if(a.removed.length){pushUndo({t:'del',rt,items:a.removed});save(rt)}
    if(a.ops.length){pushUndo({t:'ops',rt,ops:a.ops});save(rt)}
  }else if(a.kind==='lasso'){
    clearLive();selectInLasso(rt,a.poly);
  }else if(a.kind==='rotate'){
    S.sel.dragging=false;
    if(Math.abs(a.ang)>.002){rotateStrokes(S.sel.items,a.ang,a.cx,a.cy);pushUndo({t:'rot',rt,items:[...S.sel.items],ang:a.ang,cx:a.cx,cy:a.cy});S.sel.box=unionBox(S.sel.items);save(rt)}
    renderPage(rt);ensureLive(rt);drawSelection();showSelBar();
  }else if(a.kind==='drag'){
    S.sel.dragging=false;
    if(Math.abs(a.dx)>.5||Math.abs(a.dy)>.5){
      translateStrokes(S.sel.items,a.dx,a.dy);pushUndo({t:'move',rt,items:[...S.sel.items],dx:a.dx,dy:a.dy});
      S.sel.box.x+=a.dx;S.sel.box.y+=a.dy;save(rt);
    }
    renderPage(rt);ensureLive(rt);drawSelection();showSelBar();
  }
  updateIndicator();
}
function cancelAct(){
  const a=act;if(!a)return;act=null;clearTimeout(a.hold);
  if(a.type==='pen')penDown=false;
  if(a.kind==='erase'&&a.ops&&a.ops.length){undoOps(a.rt.d.strokes,a.ops);renderPage(a.rt)}
  if(a.kind==='erase'&&a.removed.length){[...a.removed].reverse().forEach(({st,i})=>a.rt.d.strokes.splice(i,0,st));renderPage(a.rt)}
  if(a.kind==='drag'||a.kind==='rotate'){S.sel.dragging=false;renderPage(a.rt);ensureLive(a.rt);drawSelection();showSelBar();return}
  clearLive();
}

/* ---------- Borracha (apaga o traço inteiro que ela toca) ---------- */
function eraseAt(pt){
  if(act.part){eraseParts(pt);return}
  const a=act,s=a.rt.d.strokes,r=SIZES.eraser[P.size.eraser]/2;let hit=false;
  for(let i=s.length-1;i>=0;i--)if(hitStroke(s[i],pt.x,pt.y,r)){a.removed.push({st:s[i],i});s.splice(i,1);hit=true}
  if(hit)renderPage(a.rt);
}
function splitStroke(st,x,y,r){
  const p=st.p,lim=r+(st.t==='hl'?st.s/2:st.s*.6),step=Math.max(.8,r/3),dense=[];
  for(let i=0;i<p.length;i+=3){
    if(i){const ax=p[i-3],ay=p[i-2],d=Math.hypot(p[i]-ax,p[i+1]-ay),k=Math.floor(d/step);
      for(let j=1;j<k;j++){const t=j/k;dense.push(ax+(p[i]-ax)*t,ay+(p[i+1]-ay)*t,p[i-1]+(p[i+2]-p[i-1])*t)}}
    dense.push(p[i],p[i+1],p[i+2]);
  }
  const out=[];let run=[];
  const flush=()=>{if(run.length>=6){const q={...st,p:run.map((v,k)=>k%3===2?Math.round(v*100)/100:r1(v))};out.push(q)}run=[]};
  for(let i=0;i<dense.length;i+=3){if(Math.hypot(dense[i]-x,dense[i+1]-y)<=lim)flush();else run.push(dense[i],dense[i+1],dense[i+2])}
  flush();return out;
}
function eraseParts(pt){
  const a=act,s=a.rt.d.strokes,r=SIZES.eraser[P.size.eraser]/2;let hit=false;
  for(let i=s.length-1;i>=0;i--){const st=s[i];if(st.t!=='pen'&&st.t!=='hl')continue;if(!hitStroke(st,pt.x,pt.y,r))continue;
    const pieces=splitStroke(st,pt.x,pt.y,r);s.splice(i,1);a.ops.push({type:'rm',st,i});
    for(const pc of pieces){s.push(pc);a.ops.push({type:'push',st:pc})}hit=true}
  if(hit)renderPage(a.rt);
}
function undoOps(s,ops){[...ops].reverse().forEach(o=>{if(o.type==='push'){const i=s.indexOf(o.st);if(i>=0)s.splice(i,1)}else s.splice(o.i,0,o.st)})}
function redoOps(s,ops){ops.forEach(o=>{if(o.type==='push')s.push(o.st);else{const i=s.indexOf(o.st);if(i>=0)s.splice(i,1)}})}
function eraseLine(p0,p1){
  const r=SIZES.eraser[P.size.eraser]/2,d=Math.hypot(p1.x-p0.x,p1.y-p0.y),steps=Math.max(1,Math.ceil(d/(r*.6)));
  for(let i=1;i<=steps;i++)eraseAt({x:p0.x+(p1.x-p0.x)*i/steps,y:p0.y+(p1.y-p0.y)*i/steps});
}
function drawEraser(pt){
  const r=SIZES.eraser[P.size.eraser]/2,k=act.rt.k;
  lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(k,0,0,k,0,0);
  lctx.beginPath();lctx.arc(pt.x,pt.y,r,0,6.2832);lctx.fillStyle='rgba(120,110,130,.12)';lctx.fill();
  lctx.lineWidth=1.2;lctx.strokeStyle='rgba(80,70,90,.6)';lctx.stroke();
}

/* ---------- Laço: selecionar, mover, recolorir, duplicar, apagar ---------- */
function selectInLasso(rt,poly){
  if(poly.length<8){clearSelection();return}
  const items=rt.d.strokes.filter(st=>{if(st.t==='img'||st.t==='text'){const b=bbox(st);return inPoly(b.x+b.w/2,b.y+b.h/2,poly)}const p=st.p,n=p.length/3;let inside=0;
    for(let i=0;i<p.length;i+=3)if(inPoly(p[i],p[i+1],poly))inside++;return inside/n>=.5});
  if(!items.length){clearSelection();return}
  S.sel={rt,items,set:new Set(items),box:unionBox(items),dragging:false};
  ensureLive(rt);drawSelection();showSelBar();
}
function handlePos(s){const sc=s.rt.el.clientWidth/s.rt.d.w,b=s.box;return {x:b.x+b.w/2,y:b.y-8-34/sc,r:13/sc,sc}}
function drawSelection(){
  const s=S.sel;if(!s)return;const k=s.rt.k,dx=act&&act.kind==='drag'?act.dx:0,dy=act&&act.kind==='drag'?act.dy:0;
  const rot=act&&act.kind==='rotate'?act.ang:0,b=s.box,cx=b.x+b.w/2,cy=b.y+b.h/2;
  lctx.setTransform(1,0,0,1,0,0);lctx.clearRect(0,0,live.width,live.height);lctx.setTransform(k,0,0,k,0,0);
  lctx.save();if(rot){lctx.translate(cx,cy);lctx.rotate(rot);lctx.translate(-cx,-cy)}
  if(s.dragging)for(const st of s.items)drawStroke(lctx,st,dx,dy);
  lctx.setLineDash([7,6]);lctx.lineWidth=1.6;lctx.strokeStyle='#8B5CF6';lctx.fillStyle='rgba(139,92,246,.05)';
  lctx.beginPath();lctx.rect(b.x-8+dx,b.y-8+dy,b.w+16,b.h+16);lctx.fill();lctx.stroke();
  if(!(act&&act.kind==='drag')){const h=handlePos(s);lctx.setLineDash([]);lctx.beginPath();lctx.moveTo(h.x,b.y-8);lctx.lineTo(h.x,h.y+h.r);lctx.stroke();
    lctx.beginPath();lctx.arc(h.x,h.y,h.r,0,6.2832);lctx.fillStyle='#fff';lctx.fill();lctx.lineWidth=2/h.sc*1.2;lctx.stroke();
    lctx.beginPath();lctx.arc(h.x,h.y,h.r*.5,-2.4,1.6);lctx.stroke()}
  lctx.restore();
  if(rot){lctx.save();lctx.fillStyle='#4A3570';lctx.font=`700 ${16/handlePos(s).sc}px "DM Sans", sans-serif`;lctx.textAlign='center';
    lctx.fillText(Math.round(rot*180/Math.PI)+'°',cx,cy);lctx.restore()}
}
function clearSelection(){if(!S.sel)return;const rt=S.sel.rt;S.sel=null;$('#selBar').hidden=true;if(live.parentNode===rt.el)clearLive();renderPage(rt)}
function showSelBar(){
  const s=S.sel,bar=$('#selBar');if(!s)return;
  bar.innerHTML=`<button class="btn" data-a="minus" aria-label="Diminuir" title="Diminuir">−</button><button class="btn" data-a="plus" aria-label="Aumentar" title="Aumentar">+</button><button class="btn" data-a="rot" aria-label="Girar 90 graus" title="Girar 90°">↻ 90°</button><span class="sep"></span><button class="btn" data-a="dup">Duplicar</button><button class="btn" data-a="del" style="color:var(--danger)">Apagar</button><span class="sep"></span>`+
    PEN_COLORS.map(c=>`<button class="swatch" data-c="${c}" style="--sw:${c}" aria-label="Pintar de ${c}"><span></span></button>`).join('');
  bar.querySelector('[data-a=del]').onclick=deleteSelection;
  bar.querySelector('[data-a=dup]').onclick=duplicateSelection;
  bar.querySelector('[data-a=minus]').onclick=()=>scaleSelection(1/1.2);
  bar.querySelector('[data-a=plus]').onclick=()=>scaleSelection(1.2);
  bar.querySelector('[data-a=rot]').onclick=()=>{const s=S.sel;if(!s)return;const b=s.box,cx=b.x+b.w/2,cy=b.y+b.h/2,ang=Math.PI/2;
    rotateStrokes(s.items,ang,cx,cy);pushUndo({t:'rot',rt:s.rt,items:[...s.items],ang,cx,cy});s.box=unionBox(s.items);renderPage(s.rt);ensureLive(s.rt);drawSelection();placeSelBar();save(s.rt)};
  bar.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>recolorSelection(b.dataset.c));
  bar.hidden=false;placeSelBar();
}
function placeSelBar(){
  const s=S.sel,bar=$('#selBar');if(!s||bar.hidden)return;
  const r=s.rt.el.getBoundingClientRect(),sc=r.width/s.rt.d.w,bw=bar.offsetWidth,bh=bar.offsetHeight;
  let x=r.left+(s.box.x+s.box.w/2)*sc,y=r.top+(s.box.y-8)*sc-bh-58;
  const top=desk.getBoundingClientRect().top+8;
  if(y<top)y=r.top+(s.box.y+s.box.h+8)*sc+10;
  x=clamp(x,bw/2+8,innerWidth-bw/2-8);y=clamp(y,top,innerHeight-bh-8);
  bar.style.left=x+'px';bar.style.top=y+'px';
}
function deleteSelection(){
  const s=S.sel;if(!s)return;const arr=s.rt.d.strokes,removed=[];
  for(let i=arr.length-1;i>=0;i--)if(s.set.has(arr[i])){removed.push({st:arr[i],i});arr.splice(i,1)}
  const rt=s.rt;clearSelection();pushUndo({t:'del',rt,items:removed});renderPage(rt);save(rt);
}
function duplicateSelection(){
  const s=S.sel;if(!s)return;const rt=s.rt;
  const copies=s.items.map(st=>st.p?{...st,p:st.p.slice()}:{...st});translateStrokes(copies,24,24);
  rt.d.strokes.push(...copies);pushUndo({t:'add',rt,items:copies});save(rt);
  S.sel={rt,items:copies,set:new Set(copies),box:unionBox(copies),dragging:false};
  renderPage(rt);ensureLive(rt);drawSelection();showSelBar();
}
function scaleSelection(f){
  const s=S.sel;if(!s)return;const b=s.box,cx=b.x+b.w/2,cy=b.y+b.h/2;
  scaleStrokes(s.items,f,cx,cy);pushUndo({t:'scale',rt:s.rt,items:[...s.items],f,cx,cy});
  s.box=unionBox(s.items);renderPage(s.rt);ensureLive(s.rt);drawSelection();placeSelBar();save(s.rt);
}
/* ---------- Adesivos ---------- */
async function stickerPicker(){
  const id=await openDlg(`<h2>Adesivos</h2><button class="btn stk-photo" data-photo>Inserir imagem ou foto do aparelho</button><div class="stk-grid">${STICKERS.map(([id,n])=>`<button data-s="${id}" aria-label="${n}" title="${n}"><img src="arte/adesivos/${id}.webp" alt=""></button>`).join('')}</div>`,
    (d,done)=>{d.querySelectorAll('.stk-grid button').forEach(b=>b.onclick=()=>done(b.dataset.s));$('[data-photo]',d).onclick=()=>{done(null);$('#imgInput').click()}});
  if(id)placeSticker(id);
}
function placeItem(st){
  const rt=S.pages[S.cur];if(!rt)return;const d=rt.d,r=rt.el.getBoundingClientRect(),dr=desk.getBoundingClientRect();
  const cx=clamp(((dr.left+dr.width/2)-r.left)/r.width*d.w,st.w/2,d.w-st.w/2),cy=clamp(((dr.top+dr.height/2)-r.top)/r.height*d.h,st.h/2,d.h-st.h/2);
  st.x=r1(cx-st.w/2);st.y=r1(cy-st.h/2);
  d.strokes.push(st);pushUndo({t:'add',rt,items:[st]});save(rt);
  P.tool='lasso';savePrefs();updateToolbar();
  if(!rt.canvas)return;renderPage(rt);
  S.sel={rt,items:[st],set:new Set([st]),box:unionBox([st]),dragging:false};
  ensureLive(rt);drawSelection();showSelBar();
}
async function insertImage(file){
  try{
    toast('Abrindo a imagem…',0);
    const im=await new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('imagem'))};i.src=u});
    const W=im.naturalWidth,H=im.naturalHeight,sc=Math.min(1,1600/Math.max(W,H)),cv=document.createElement('canvas');
    cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    const png=/png|gif|webp/.test(file.type)&&cv.width*cv.height<1.5e6;
    const blob=await toBlob(cv,png?'image/png':'image/jpeg',.88),bid=uid();
    await DB.put('blobs',{id:bid,blob});IMG.set(bid,cv);
    const w=Math.min(560,cv.width/1.4),h=w*cv.height/cv.width;
    hideToast();placeItem({t:'img',bid,x:0,y:0,w:r1(w),h:r1(h)});

/* =====================================================================
   Texto: caixa onde se digita ou se escreve com a Apple Pencil
   (o Rabiscar do iPad transforma a letra em texto, na fonte escolhida)

let TE=null,textPending=null;
function textDown(e,rt){
  const r=rt.el.getBoundingClientRect();
  const pt={x:(e.clientX-r.left)/r.width*rt.d.w,y:(e.clientY-r.top)/r.height*rt.d.h};
  if(TE){
    const b=bbox(TE.st),m=70;
    if(TE.rt===rt&&pt.x>b.x-m&&pt.x<b.x+b.w+m&&pt.y>b.y-m&&pt.y<b.y+Math.max(b.h,TE.st.s*3.9)+m)return; // perto da caixa: deixa o Rabiscar agir
    commitText();return;
  }
  textPending={rt,pt,id:e.pointerId,x:e.clientX,y:e.clientY};
}
pagesEl.addEventListener('pointerup',e=>{
  const t=textPending;if(!t||t.id!==e.pointerId)return;textPending=null;
  if(Math.hypot(e.clientX-t.x,e.clientY-t.y)>12)return;
  const s=t.rt.d.strokes;
  for(let i=s.length-1;i>=0;i--){const st=s[i];if(st.t!=='text')continue;const b=bbox(st);
    if(t.pt.x>=b.x-6&&t.pt.x<=b.x+b.w+6&&t.pt.y>=b.y-6&&t.pt.y<=b.y+b.h+6){openText(t.rt,st);return}}
  openText(t.rt,null,t.pt);
});
function openText(rt,st,pt){
  clearSelection();const d=rt.d,isNew=!st;
  if(isNew){const size=SIZES.text[P.size.text],x=clamp(pt.x-8,16,d.w-240);
    st={t:'text',x:r1(x),y:r1(clamp(pt.y-size*.75,10,d.h-size*2)),w:r1(Math.min(640,d.w-x-24)),txt:'',f:P.textFont,s:size,c:P.textColor}}
  loadFont(st.f);
  const ta=document.createElement('textarea');ta.className='tbox';ta.value=st.txt;
  ta.setAttribute('autocapitalize','sentences');ta.setAttribute('aria-label','Texto');ta.spellcheck=true;
  if(isNew)ta.placeholder='Escreva aqui ✦';
  TE={rt,st,isNew,ta,before:{txt:st.txt,f:st.f,s:st.s,c:st.c}};
  ta.oninput=()=>{st.txt=ta.value;styleTbox()};
  ta.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();commitText()}};
  rt.el.append(ta);styleTbox();renderPage(rt);
  try{ta.focus({preventScroll:true})}catch(x){ta.focus()}
  if(!P.textTip){P.textTip=true;savePrefs();toast('Com a Apple Pencil, escreva dentro da caixa: o iPad transforma sua letra na fonte. Se não funcionar, ative “Rabiscar” em Ajustes › Apple Pencil.',8000)}
}
function styleTbox(){
  if(!TE)return;const {rt,st,ta}=TE,k=rt.el.clientWidth/rt.d.w,f=fontOf(st.f);
  Object.assign(ta.style,{transform:st.r?`rotate(${st.r}rad)`:'',transformOrigin:'50% 50%',left:st.x*k+'px',top:st.y*k+'px',width:st.w*k+'px',font:`${f[3]} ${st.s*k}px/1.3 "${f[1]}", sans-serif`,color:st.c});
  ta.style.height='0px';ta.style.height=Math.max(ta.scrollHeight,st.s*k*1.3*3)+'px';
}
function commitText(){
  if(!TE)return;const {rt,st,isNew,ta,before}=TE;TE=null;ta.remove();
  st.txt=st.txt.replace(/\s+$/,'');
  const s=rt.d.strokes,empty=!st.txt.trim();
  if(isNew){if(!empty){s.push(st);pushUndo({t:'add',rt,items:[st]});save(rt)}}
  else if(empty){const i=s.indexOf(st);if(i>=0){s.splice(i,1);pushUndo({t:'del',rt,items:[{st,i}]});save(rt)}}
  else{const to={txt:st.txt,f:st.f,s:st.s,c:st.c};if(Object.keys(to).some(k=>to[k]!==before[k])){pushUndo({t:'props',rt,st,from:before,to});save(rt)}}
  renderPage(rt);
}

/* ---------- Rolagem, pinça e palma da mão ---------- */
const isStylus=e=>penDown||[...e.touches].some(t=>t.touchType==='stylus');
desk.addEventListener('touchstart',e=>{
  if(e.target.closest&&e.target.closest('.tbox'))return;
  if(RL.on&&![...e.touches].some(t=>t.touchType==='stylus')&&[...e.touches].some(t=>inRuler(t.clientX,t.clientY))){e.preventDefault();return}
  if(isStylus(e)){e.preventDefault();return}
  if(e.touches.length===2&&e.cancelable){
    e.preventDefault();if(act&&act.type==='touch')cancelAct();startPinch(e);return;
  }
  if(!P.penOnly&&e.touches.length===1&&e.target.closest('.page'))e.preventDefault();
},{passive:false});
desk.addEventListener('touchmove',e=>{
  if(pinch&&e.touches.length>=2){e.preventDefault();movePinch(e);return}
  if(e.target.closest&&e.target.closest('.tbox'))return;
  if(RL.g){e.preventDefault();return}
  if(isStylus(e)){e.preventDefault();return}
  if(!P.penOnly&&act&&act.type==='touch')e.preventDefault();
},{passive:false});
desk.addEventListener('touchend',e=>{if(pinch&&e.touches.length<2)endPinch()});
desk.addEventListener('touchcancel',()=>{if(pinch)endPinch()});
