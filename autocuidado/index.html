<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provedor do Autocuidado</title>
<meta name="description" content="Saúde integral do homem: sinais de alerta, exames, mente, hábitos e onde buscar atendimento. Funciona sem internet.">
<meta name="theme-color" content="#1A2458">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#1A2458; --azul:#473C8F; --azul2:#4F67B5; --azul-claro:#E9ECF8; --ambar:#A5C5E2; --ambar-claro:#E3EDF8;
  --creme:#EEF1FA; --bg:#F3F4FA; --card:#FFFFFF; --txt:#151B3D; --txt2:#4A5070; --linha:#D9DDEE;
  --verde:#1F8A5B; --verde-claro:#DDF3E8; --verm:#C62F2F; --verm-claro:#FBE3E3; --amar:#B7791F; --amar-claro:#FDF1D8;
  --r:18px; --fs:17px;
}
:root[data-tema="contraste"]{--bg:#000;--card:#111;--txt:#fff;--txt2:#e6e6e6;--linha:#666;--azul-claro:#1d1a45;--ambar-claro:#16264a;--verde-claro:#06301d;--verm-claro:#3d0b0b;--amar-claro:#3a2a05;--creme:#111}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:.35rem 0 .7rem}
.topo{background:var(--navy);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
.topo img{width:40px;height:40px;border-radius:11px}
.topo .nome{font-weight:800;font-size:1.05rem;letter-spacing:.2px}
.topo .sub{font-size:.78rem;opacity:.8}
.topo .acoes{margin-left:auto;display:flex;gap:6px}
.topo button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:12px;min-width:44px;height:44px;font-weight:700;cursor:pointer}
.voltar{display:none}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:16px;margin:0 0 14px}
.hero{background:linear-gradient(135deg,var(--navy),#473C8F 70%,#534FA6);color:#fff;border:0}
.hero p{opacity:.92}
.hero .frase{font-size:1.3rem;font-weight:800;margin:.1rem 0 .4rem}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:112px}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem}
.tile b{font-size:1rem}
.tile span{font-size:.82rem;color:var(--txt2)}
.ic.a{background:var(--azul-claro)} .ic.b{background:var(--ambar-claro)} .ic.c{background:var(--verde-claro)} .ic.d{background:var(--verm-claro)}
.sos{display:flex;gap:10px;flex-wrap:wrap}
.sos a{flex:1 1 140px;text-decoration:none;background:var(--verm);color:#fff;border-radius:14px;padding:12px 14px;font-weight:800;display:flex;flex-direction:column}
.sos a small{font-weight:500;opacity:.9}
.sos a.cvv{background:var(--azul)}
.sos a.ds{background:var(--navy)}
nav.baixo{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.baixo button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--txt2);padding:4px 6px;min-width:58px;cursor:pointer}
nav.baixo button .e{font-size:1.35rem;line-height:1}
nav.baixo button[aria-current="page"]{color:var(--azul);font-weight:800}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.chip.verm{background:var(--verm-claro);color:var(--verm)} .chip.amar{background:var(--amar-claro);color:var(--amar)} .chip.verde{background:var(--verde-claro);color:var(--verde)} .chip.azul{background:var(--azul-claro);color:var(--azul)}
:root[data-tema="contraste"] .chip{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;min-height:48px;font-weight:700;cursor:pointer;background:var(--azul);color:#fff;text-decoration:none}
.btn.sec{background:var(--azul-claro);color:var(--navy)}
.btn.amb{background:var(--ambar);color:#1A2458}
.btn.peq{min-height:38px;padding:6px 12px;font-size:.88rem}
:root[data-tema="contraste"] .btn.sec{color:#fff}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);margin:0 0 10px;overflow:hidden}
details summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:center;font-weight:700}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;font-size:1.3rem;color:var(--txt2)}
details[open] summary::after{content:"–"}
details .corpo{padding:0 16px 14px}
.nivel{border-left:6px solid var(--linha);padding:10px 12px;border-radius:10px;margin:8px 0;background:var(--bg)}
.nivel.verm{border-color:var(--verm);background:var(--verm-claro)}
.nivel.amar{border-color:var(--amar);background:var(--amar-claro)}
.nivel.verde{border-color:var(--verde);background:var(--verde-claro)}
ul{padding-left:1.2rem;margin:.3rem 0 .7rem} li{margin:.2rem 0}
.passos{counter-reset:p;list-style:none;padding:0}
.passos li{counter-increment:p;position:relative;padding:8px 0 8px 44px;border-bottom:1px dashed var(--linha)}
.passos li::before{content:counter(p);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:800}
.ouvir{background:none;border:1px solid var(--linha);border-radius:99px;padding:4px 10px;font-size:.8rem;cursor:pointer;color:var(--txt2)}
.aviso{font-size:.85rem;color:var(--txt2);background:var(--creme);border-radius:12px;padding:10px 12px}
.campo{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;flex:1 1 140px}
.campo label{font-size:.85rem;font-weight:700;color:var(--txt2)}
.campo input,.campo select,.campo textarea{border:1px solid var(--linha);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.barra{height:14px;background:var(--azul-claro);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--azul2),var(--azul));border-radius:99px;transition:width .4s}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.75rem;color:var(--txt2)}
.dias div b{display:block;height:64px;background:var(--azul-claro);border-radius:8px;position:relative;overflow:hidden;margin-bottom:3px}
.dias div b i{position:absolute;bottom:0;left:0;right:0;background:var(--azul)}
.humor{display:flex;justify-content:space-between;gap:6px}
.humor button{flex:1;border:2px solid var(--linha);background:var(--card);border-radius:14px;padding:8px 2px;font-size:1.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.humor button small{font-size:.68rem;color:var(--txt2)}
.humor button[aria-pressed="true"]{border-color:var(--azul);background:var(--azul-claro)}
.resp{display:grid;place-items:center;padding:12px 0 4px}
.bola{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#A5C5E2,var(--azul2) 60%,var(--azul));transform:scale(.6);transition:transform 4s ease-in-out;display:grid;place-items:center;color:#fff;font-weight:800}
.quiz-op{display:flex;gap:10px}
.quiz-op button{flex:1}
.res{margin-top:10px;padding:12px;border-radius:12px}
.res.ok{background:var(--verde-claro)} .res.nao{background:var(--verm-claro)}
.local{border-bottom:1px solid var(--linha);padding:12px 0}
.local:last-child{border-bottom:0}
.local .tipo{font-size:.78rem;color:var(--txt2);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linha)}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.hbar{height:10px;background:var(--azul);border-radius:99px;margin-top:4px}
.anat svg{width:100%;height:auto;max-height:420px;display:block;margin:0 auto}
.anat .org{cursor:pointer;transition:filter .2s}
.anat .org:hover,.anat .org.sel{filter:brightness(1.12) drop-shadow(0 0 4px rgba(47,111,214,.7))}
.anat text{font-size:13px;font-weight:700;fill:var(--txt);pointer-events:none}
.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha)}
.ck:last-child{border-bottom:0}
.ck .t{flex:1}
.ck .t small{display:block;color:var(--txt2)}
.qr{background:#fff;border-radius:16px;padding:14px;display:inline-block}
.qr img{width:240px;height:240px;display:block}
.centro{text-align:center}
.oculto{display:none!important}
.mini{font-size:.85rem;color:var(--txt2)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (max-width:400px){.topo .sub{display:none}}
@media (min-width:640px){.grade{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topo">
  <button class="voltar" id="voltar" aria-label="Voltar">←</button>
  <img src="logo.svg" alt="">
  <div><div class="nome">Provedor do Autocuidado</div><div class="sub">Cuidar de si também é coisa de homem</div></div>
  <div class="acoes">
    <button id="fonte" aria-label="Aumentar letra" title="Tamanho da letra">A+</button>
    <button id="tema" aria-label="Alto contraste" title="Alto contraste">◐</button>
  </div>
</header>

<main id="app"></main>

<nav class="baixo" aria-label="Menu principal">
  <button data-ir="inicio"><span class="e">🏠</span>Início</button>
  <button data-ir="sinais"><span class="e">🚦</span>Sinais</button>
  <button data-ir="cuidar"><span class="e">🩺</span>Exames</button>
  <button data-ir="mente"><span class="e">🧠</span>Mente</button>
  <button data-ir="onde"><span class="e">📍</span>Onde ir</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   Provedor do Autocuidado: app de saúde integral do homem.
   Tudo roda no aparelho. Os dados pessoais ficam só no celular
   (localStorage) e nada é enviado para servidor nenhum.
   ============================================================ */

/* ---------- Locais de atendimento: EDITE AQUI ----------
   Confirme endereço e telefone antes de divulgar.
   Campo "conf": false mostra o aviso "confirmar antes de ir". */
const LOCAIS = [
  {tipo:"Emergência", nome:"SAMU", fone:"192", desc:"Ambulância para urgências: dor no peito, sinais de AVC, falta de ar forte, acidente.", conf:true},
  {tipo:"Emergência", nome:"Corpo de Bombeiros", fone:"193", desc:"Acidentes, resgate, incêndio.", conf:true},
  {tipo:"Apoio emocional", nome:"CVV: Centro de Valorização da Vida", fone:"188", desc:"Conversa sigilosa e gratuita, 24 horas, por telefone. Também tem chat em cvv.org.br.", conf:true},
  {tipo:"Informação", nome:"Disque Saúde (Ministério da Saúde)", fone:"136", desc:"Tira dúvidas sobre saúde, vacinas e serviços do SUS. Também orienta quem quer parar de fumar.", conf:true},
  {tipo:"Atenção Básica", nome:"Unidade Básica de Saúde (UBS) do seu bairro", desc:"Porta de entrada do SUS: consulta, pressão, glicemia, vacinas, testes rápidos de HIV, sífilis e hepatites, tratamento para parar de fumar, encaminhamentos. Leve RG, Cartão do SUS e comprovante de endereço.", conf:true},
  {tipo:"Clínica-escola", nome:"Afya Clínica Acadêmica, Parnaíba", desc:"Atendimento pelos cursos da saúde da Afya. Pergunte na recepção quais serviços e horários estão disponíveis.", conf:false},
  {tipo:"Hospital", nome:"Hospital Estadual Dirceu Arcoverde (HEDA)", end:"Rua Rodrigo Coimbra, 1650, Rodoviária, Parnaíba", fone:"8633231711", foneTxt:"(86) 3323-1711", desc:"Hospital de referência da região.", conf:false},
  {tipo:"Pronto-socorro", nome:"Pronto Socorro Municipal de Parnaíba", end:"Rua Teresina, 996, Nova Parnaíba", desc:"Urgência e emergência.", conf:false},
  {tipo:"Saúde mental", nome:"CAPS: Centro de Atenção Psicossocial", desc:"Atendimento gratuito para sofrimento mental, depressão, ansiedade e uso de álcool e outras drogas (CAPS AD). Pode procurar direto, sem encaminhamento. Pergunte na UBS o endereço do CAPS mais perto.", conf:true},
  {tipo:"ISTs", nome:"CTA: Centro de Testagem e Aconselhamento", desc:"Testes de HIV, sífilis e hepatites, PEP (até 72 h depois de uma exposição de risco) e PrEP. Sigilo garantido. A UBS também faz os testes rápidos.", conf:true},
  {tipo:"Remédios", nome:"Farmácia Popular", desc:"Remédios de pressão, diabetes e asma de graça nas farmácias credenciadas. Leve receita, documento com foto e CPF.", conf:true}
];

/* ---------- utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const app = $("#app");
const LS = {
  get(k,d){try{const v=localStorage.getItem("pa_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("pa_"+k,JSON.stringify(v))}catch(e){}}
};
const hoje = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtData = s=>{if(!s)return"";const [a,m,d]=s.split("-");return d+"/"+m+"/"+a};
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2600)}
function ouvirBtn(){return '<button class="ouvir" data-ouvir>🔊 Ouvir</button>'}
function falar(txt){
  if(!("speechSynthesis" in window)){toast("Seu celular não tem leitura em voz alta.");return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang="pt-BR";u.rate=.95;speechSynthesis.speak(u);
}
const tel = (n,txt)=>'<a href="tel:'+n+'">'+(txt||n)+'</a>';

/* ---------- conteúdo: sinais de alerta ---------- */
const SINAIS = [
 {id:"peito",ic:"❤️",t:"Dor ou aperto no peito",lvl:"verm",
  o:"Pode ser <b>infarto</b>. O coração está recebendo pouco sangue.",
  s:["Dor, aperto ou queimação no peito por mais de 20 minutos","A dor vai para o braço esquerdo, pescoço, mandíbula ou costas","Suor frio, falta de ar, enjoo ou tontura"],
  f:"<b>Ligue 192 (SAMU) agora.</b> Não dirija. Pare o que está fazendo e fique sentado. Cada minuto conta."},
 {id:"avc",ic:"🧠",t:"Boca torta, braço fraco, fala enrolada",lvl:"verm",
  o:"Pode ser <b>AVC (derrame)</b>. Lembre da palavra <b>SAMU</b>:",
  s:["<b>S</b>orriso: um lado do rosto fica caído","<b>A</b>braço: um braço fica fraco ou dormente","<b>M</b>úsica: a fala fica enrolada ou estranha","<b>U</b>rgente: ligue 192 na hora"],
  f:"<b>Ligue 192.</b> Anote o horário em que começou. O tratamento funciona melhor nas primeiras horas."},
 {id:"suic",ic:"🫂",t:"Pensamentos de se machucar ou de sumir",lvl:"verm",
  o:"Isso é <b>sofrimento intenso</b>, não fraqueza. Tem tratamento e tem gente pronta para ouvir.",
  s:["Pensar que seria melhor não estar vivo","Despedir-se, dar coisas embora, falar que é um peso","Beber muito mais que o normal para aguentar"],
  f:"<b>Ligue 188 (CVV)</b>, de graça, 24 h. Em risco imediato, <b>ligue 192</b>. Procure o CAPS ou a UBS. Conte para alguém de confiança hoje."},
 {id:"pressao",ic:"🩸",t:"Dor de cabeça forte, nuca pesada, visão embaçada",lvl:"amar",
  o:"Pode ser <b>pressão alta</b>. Na maioria das vezes ela não dá sintoma nenhum, por isso é chamada de doença silenciosa.",
  s:["Dor de cabeça na nuca","Tontura, zumbido no ouvido","Visão embaçada","Sangramento no nariz"],
  f:"Meça a pressão na UBS ou na farmácia. Se der <b>14 por 9 (140/90) ou mais</b>, marque consulta. Se vier com dor no peito, fala enrolada ou fraqueza, <b>ligue 192</b>."},
 {id:"diab",ic:"🍬",t:"Muita sede, urina demais, ferida que não sara",lvl:"amar",
  o:"Pode ser <b>diabetes</b> (açúcar alto no sangue).",
  s:["Muita sede e boca seca","Urinar muitas vezes, até de madrugada","Fome demais e perda de peso sem motivo","Visão embaçada, formigamento nos pés","Ferida que demora a cicatrizar"],
  f:"Faça o teste de glicemia (furinho no dedo) na UBS. É rápido e gratuito."},
 {id:"urina",ic:"🚽",t:"Dificuldade para urinar, jato fraco",lvl:"amar",
  o:"Pode ser <b>aumento benigno da próstata</b> (muito comum depois dos 50), infecção ou, menos vezes, <b>câncer de próstata</b>.",
  s:["Jato de urina fraco ou que para e volta","Levantar várias vezes à noite para urinar","Sensação de que a bexiga não esvaziou","Sangue na urina ou no sêmen","Dor ou ardência ao urinar"],
  f:"Marque consulta na UBS. Esses sinais precisam de avaliação, mas <b>não significam câncer</b> automaticamente. Se não conseguir urinar nada e a barriga doer, vá ao pronto-socorro."},
 {id:"testic",ic:"🥚",t:"Caroço ou peso no testículo",lvl:"amar",
  o:"Pode ser <b>câncer de testículo</b>, mais comum entre <b>15 e 35 anos</b>, ou outras alterações benignas.",
  s:["Caroço duro, geralmente sem dor","Um testículo aumentou ou ficou mais duro","Sensação de peso no saco escrotal"],
  f:"Procure a UBS. Descoberto cedo, tem cura na grande maioria dos casos. Veja como fazer o autoexame na aba <b>Corpo</b>."},
 {id:"ist",ic:"🛡️",t:"Corrimento, ferida ou verruga no pênis",lvl:"amar",
  o:"Pode ser uma <b>IST</b> (infecção sexualmente transmissível): gonorreia, clamídia, sífilis, herpes, HPV.",
  s:["Corrimento ou pus saindo pela uretra","Ardência ao urinar","Ferida no pênis, mesmo sem dor (pode ser sífilis)","Verrugas ou caroços na região genital","Íngua na virilha"],
  f:"Vá à UBS ou ao CTA. Teste e tratamento são <b>gratuitos e sigilosos</b>. Avise a parceria e não tenha relação até tratar. Teve relação sem camisinha ou a camisinha rompeu? Procure a <b>PEP em até 72 horas</b>."},
 {id:"intest",ic:"🩻",t:"Sangue nas fezes, intestino mudou",lvl:"amar",
  o:"Pode ser hemorroida, mas também <b>câncer de intestino (cólon e reto)</b>, o 2º mais comum nos homens.",
  s:["Sangue nas fezes ou fezes muito escuras","Intestino que mudou: prisão de ventre ou diarreia que não passa","Dor na barriga frequente","Emagrecer sem motivo, cansaço"],
  f:"Procure a UBS. Entre <b>50 e 75 anos</b>, pergunte sobre o exame de sangue oculto nas fezes."},
 {id:"tosse",ic:"🫁",t:"Tosse há mais de 3 semanas",lvl:"amar",
  o:"Pode ser <b>tuberculose</b>, DPOC (pulmão do fumante) ou câncer de pulmão.",
  s:["Tosse por 3 semanas ou mais","Febre no fim da tarde, suor à noite","Catarro com sangue","Falta de ar, cansaço, emagrecimento"],
  f:"Vá à UBS e peça o exame de escarro. A tuberculose tem cura e o tratamento é gratuito. Falta de ar forte: <b>192</b>."},
 {id:"boca",ic:"👄",t:"Ferida na boca que não sara",lvl:"amar",
  o:"Pode ser <b>câncer de boca</b>, o 5º mais comum em homens, ligado ao cigarro e ao álcool.",
  s:["Ferida na boca, língua ou lábio que não sara em 15 dias","Mancha branca ou vermelha","Caroço no pescoço","Dor ou dificuldade para engolir"],
  f:"Procure o dentista da UBS. Faça o autoexame da boca uma vez por mês, na frente do espelho."},
 {id:"erecao",ic:"⚡",t:"Dificuldade de ereção",lvl:"verde",
  o:"É mais comum do que se fala. Pode ter causa emocional (estresse, ansiedade) ou ser um <b>aviso do coração</b>: diabetes, pressão alta e colesterol entopem os vasos do pênis antes dos do coração.",
  s:["Dificuldade para ter ou manter a ereção na maioria das vezes","Diminuição do desejo"],

  const l=document.createElement("a");l.href=url;l.download="compromisso-saude.ics";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);

DEPOIS.compartilhar=()=>{
  $("#shBtn").onclick=async()=>{const u=location.href.split("#")[0];
    if(navigator.share){try{await navigator.share({title:"Provedor do Autocuidado",text:"App de saúde do homem",url:u})}catch(e){}}
    else{try{await navigator.clipboard.writeText(u);toast("Link copiado")}catch(e){toast(u)}}};
  if(window._instalar){const b=$("#instBtn");b.classList.remove("oculto");b.onclick=()=>{window._instalar.prompt();window._instalar=null;b.classList.add("oculto")}}
};

DEPOIS.sobre=()=>{$("#apagar").onclick=()=>{if(confirm("Apagar tudo o que você salvou neste app?")){Object.keys(localStorage).filter(k=>k.indexOf("pa_")===0).forEach(k=>localStorage.removeItem(k));toast("Dados apagados");ir("inicio")}}};
