<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Gerador do Neurinho</title>
<link rel="icon" href="favicon-32.png">
<style>
:root{--bg:#F7F0EA;--surface:#FFFBF7;--ink:#3A2A26;--muted:#7A6862;--line:#E6D8CE;--accent:#B5583D;--on-accent:#fff;--soft:#F3DDD3;--good:#2F6B3A;--good-soft:#E3F1E2;--bad:#A3352A;--bad-soft:#FBE3DF;--warn-soft:#FFF1C9}
@media (prefers-color-scheme: dark){:root{--bg:#1E1715;--surface:#2A211E;--ink:#F4E9E3;--muted:#C2B0A8;--line:#4A3B36;--accent:#E28A6E;--on-accent:#1E1715;--soft:#4A2E25;--good:#8FD19A;--good-soft:#1F3322;--bad:#FF9A8C;--bad-soft:#3E1F1A;--warn-soft:#3D3214}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 6px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:13px 16px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:800;cursor:pointer;text-decoration:none;text-align:center}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:9px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px}
input,select,textarea{font:inherit;color:inherit;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px}
textarea{min-height:90px;resize:vertical;font-size:13px;word-break:break-all}
.note{border-radius:14px;padding:12px 14px;font-size:14px}
.note.good{background:var(--good-soft)}.note.bad{background:var(--bad-soft)}.note.warn{background:var(--warn-soft)}
.out{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:12px;font-size:14px}
.hist{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.hist:first-child{border-top:0;padding-top:0}
details summary{cursor:pointer;font-weight:800}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';
/* Gerador de códigos de assinatura do Neurinho.
   A chave secreta é criada e guardada só neste aparelho (navegador). Ela nunca é enviada para lugar nenhum.
   O app confere os códigos com a chave pública, que fica no index.html (LIC_PUB). */
var KEY='neurinho.gerador';
var APP=new URL('./',location.href).href;
var G=load();
var out=null,toastT=null;
function load(){try{var g=JSON.parse(localStorage.getItem(KEY)||'{}');g.hist=g.hist||[];return g}catch(e){return {hist:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){toast('Não consegui salvar neste navegador.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},2600)}
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return fmt(new Date())}
function br(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function addMonths(s,m){
  var p=s.split('-').map(Number),y=p[0],mo=p[1]-1+m,d=p[2];
  y+=Math.floor(mo/12);mo=((mo%12)+12)%12;
  var last=new Date(y,mo+1,0).getDate();
  return fmt(new Date(y,mo,Math.min(d,last)));
}
function b64u(bytes){var s='';bytes=new Uint8Array(bytes);for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function utf8(s){return new TextEncoder().encode(s)}
function pubOf(j){return {kty:'EC',crv:'P-256',x:j.x,y:j.y}}
function copy(t,ok){
  var done=function(){toast(ok||'Copiado.')};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){old(t)?done():toast('Não consegui copiar.')});return}
  old(t)?done():toast('Não consegui copiar.');
}
function old(t){var x=document.createElement('textarea');x.value=t;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(x);return ok}

function createKey(){
  crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']).then(function(k){
    return crypto.subtle.exportKey('jwk',k.privateKey);
  }).then(function(j){G.priv=j;G.bk=0;save();render();toast('Chave criada.')},function(){toast('Este navegador não consegue criar a chave.')});
}
function restoreKey(){
  var v=(document.getElementById('rest').value||'').trim();
  try{
    var j=JSON.parse(atob(v.replace(/\s+/g,'')));
    if(!j||j.kty!=='EC'||j.crv!=='P-256'||!j.d||!j.x||!j.y)throw 0;
    crypto.subtle.importKey('jwk',j,{name:'ECDSA',namedCurve:'P-256'},true,['sign']).then(function(){G.priv=j;G.bk=1;save();render();toast('Chave restaurada.')},function(){toast('Backup inválido.')});
  }catch(e){toast('Backup inválido. Confira se colou o texto inteiro.')}
}
function backupText(){return btoa(JSON.stringify(G.priv))}
function gen(){
  var nome=document.getElementById('nome').value.trim(),fone=document.getElementById('fone').value.replace(/\D/g,''),meses=+document.getElementById('meses').value,ini=document.getElementById('ini').value||today();
  if(!nome){toast('Escreva o nome da aluna.');return}
  var x=addMonths(ini,meses);
  var data={n:nome.slice(0,60),x:x,i:today(),r:Math.random().toString(36).slice(2,8)};
  var pl=b64u(utf8(JSON.stringify(data)));
  crypto.subtle.importKey('jwk',G.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']).then(function(k){
    return crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},k,utf8(pl));
  }).then(function(sig){
    var code=pl+'.'+b64u(sig),link=APP+'#ativar='+code;
    var msg='Oi, '+nome.split(' ')[0]+'! Recebi seu Pix 💙\nSeu acesso ao Neurinho vai até '+br(x)+'.\n\nToque no link para ativar:\n'+link+'\n\nSe você usa o Neurinho instalado na tela inicial, abra o app e cole este código na tela de assinatura:\n'+code;
    out={nome:nome,x:x,code:code,link:link,msg:msg,fone:fone};
    G.hist.unshift({n:nome,x:x,i:today(),code:code,fone:fone});G.hist=G.hist.slice(0,300);save();render();
    document.getElementById('res').scrollIntoView({behavior:'smooth'});
  },function(){toast('Não consegui gerar o código.')});
}
function zap(fone,msg){return 'https://wa.me/'+(fone?(fone.length<=11?'55'+fone:fone):'')+'?text='+encodeURIComponent(msg)}

function render(){
  var h='<div><h1>Gerador do Neurinho</h1><p class="muted small">Página só da Erika, para criar os links de ativação da assinatura.</p></div>';
  if(!window.crypto||!crypto.subtle){document.getElementById('app').innerHTML=h+'<div class="note bad">Abra esta página pelo endereço https do site. Este navegador não consegue criar códigos aqui.</div>';return}
  if(!G.priv){
    h+='<div class="card"><h2>Primeiro acesso</h2><p>Crie a sua chave secreta. Ela fica só neste aparelho e é ela que cria os códigos. Depois, mande a <b>chave pública</b> para o Claude colocar no app.</p><button class="btn" data-a="create">Criar minha chave</button></div>';
    h+='<details class="card"><summary>Já tenho um backup da chave</summary><label>Cole o backup<textarea id="rest"></textarea></label><button class="btn soft" data-a="restore">Restaurar chave</button></details>';
    document.getElementById('app').innerHTML=h;return;
  }
  if(!G.bk)h+='<div class="note warn"><b>Faça o backup da chave secreta agora.</b> Se este navegador apagar os dados, a chave some e os códigos param de funcionar até o app ser atualizado com uma chave nova. Toque em "Copiar backup" e guarde o texto num lugar seguro (por exemplo, nas Notas ou num e-mail para você mesma). Nunca mande esse texto para ninguém.<div class="row" style="margin-top:8px"><button class="btn sm" data-a="backup">Copiar backup</button></div></div>';
  h+='<div class="card"><h2>Novo código</h2>';
  h+='<label>Nome da aluna<input id="nome" autocomplete="off" placeholder="Ex.: Maria Silva"></label>';
  h+='<label>WhatsApp da aluna (opcional)<input id="fone" inputmode="tel" autocomplete="off" placeholder="DDD + número"></label>';
  h+='<div class="row"><label style="flex:1">Duração<select id="meses"><option value="1">1 mês</option><option value="2">2 meses</option><option value="3">3 meses</option><option value="6">6 meses</option></select></label>';
  h+='<label style="flex:1">Começa em<input id="ini" type="date" value="'+today()+'"></label></div>';
  h+='<p class="muted small">Renovação antes de vencer: coloque em "Começa em" a data em que o acesso atual vence, para a aluna não perder dias.</p>';
  h+='<button class="btn" data-a="gen">Gerar link</button></div>';
  if(out){
    h+='<div class="card" id="res"><h2>Pronto para '+esc(out.nome)+'</h2><p class="small">Acesso até <b>'+br(out.x)+'</b>.</p><div class="out">'+esc(out.msg)+'</div>';
    h+='<div class="row"><a class="btn" href="'+esc(zap(out.fone,out.msg))+'" target="_blank" rel="noopener">Enviar no WhatsApp</a><button class="btn soft" data-a="copymsg">Copiar mensagem</button></div>';
    h+='<div class="row"><button class="btn ghost sm" data-a="copylink">Copiar só o link</button><button class="btn ghost sm" data-a="copycode">Copiar só o código</button></div></div>';
  }
  if(G.hist.length){
    h+='<details class="card"'+(out?'':' open')+'><summary>Códigos gerados ('+G.hist.length+')</summary>';
    var t=today();
    G.hist.slice(0,100).forEach(function(x,i){
      h+='<div class="hist"><div><b>'+esc(x.n)+'</b><div class="muted small">'+(x.x<t?'Venceu em ':'Até ')+br(x.x)+' · gerado em '+br(x.i)+'</div></div><button class="btn ghost sm" data-a="again" data-i="'+i+'">Reenviar</button></div>';
    });
    h+='</details>';
  }
  h+='<details class="card"><summary>Chave pública (para o app)</summary><p class="small">Mande este texto para o Claude colocar no app. Ele não é secreto: serve só para o app conferir os códigos.</p><div class="out">'+esc(JSON.stringify(pubOf(G.priv)))+'</div><button class="btn soft" data-a="copypub">Copiar chave pública</button></details>';
  h+='<details class="card"><summary>Backup e segurança</summary><p class="small">O backup é a sua chave <b>secreta</b>. Guarde num lugar seguro e nunca envie para ninguém, nem para o Claude. Com ele, você restaura o Gerador em outro aparelho.</p><button class="btn soft" data-a="backup">Copiar backup</button></details>';
  document.getElementById('app').innerHTML=h;
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a');
  if(a==='create')createKey();
  else if(a==='restore')restoreKey();
  else if(a==='gen')gen();
  else if(a==='backup'){copy(backupText(),'Backup copiado. Guarde num lugar seguro.');if(!G.bk){G.bk=1;save();render()}}
  else if(a==='copypub')copy(JSON.stringify(pubOf(G.priv)),'Chave pública copiada.');
  else if(a==='copymsg'&&out)copy(out.msg,'Mensagem copiada.');
  else if(a==='copylink'&&out)copy(out.link,'Link copiado.');
  else if(a==='copycode'&&out)copy(out.code,'Código copiado.');
  else if(a==='again'){
    var x=G.hist[+el.getAttribute('data-i')];if(!x)return;
    var link=APP+'#ativar='+x.code;
    out={nome:x.n,x:x.x,code:x.code,link:link,fone:x.fone||'',msg:'Oi, '+x.n.split(' ')[0]+'! Seu acesso ao Neurinho vai até '+br(x.x)+'.\n\nToque no link para ativar:\n'+link+'\n\nSe você usa o Neurinho instalado na tela inicial, abra o app e cole este código na tela de assinatura:\n'+x.code};
    render();document.getElementById('res').scrollIntoView({behavior:'smooth'});
  }
});
render();
})();
</script>
</body>
</html>
